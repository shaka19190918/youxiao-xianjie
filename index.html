<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFE0B2">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js" defer></script>
<title>幼小衔接快乐营</title>
<style>
:root{
  --bg:#FFF8F0;--pri:#FF8C42;--pri-l:#FFF0E5;--sec:#5B8C5A;--sec-l:#E8F5E9;
  --acc:#FFB800;--acc-l:#FFF8E1;--info:#4FC3F7;--info-l:#E1F5FE;
  --card:#FFF;--txt:#4A3728;--tx2:#8D7B6A;--ok:#66BB6A;--bad:#EF5350;
  --bd:#E8D5C4;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
#app{max-width:600px;margin:0 auto;min-height:100vh;padding:8px 12px 40px}

.top{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100;background:var(--bg);padding:6px 0;margin-bottom:8px}
.back{font-size:24px;color:var(--pri);padding:4px;visibility:hidden}
.back.show{visibility:visible}
.ttl{font-size:18px;font-weight:700;flex:1}
.pill{background:var(--card);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.04)}

/* HOME GRID - large kid-friendly cards */
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.hcard{background:var(--card);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;box-shadow:0 3px 12px rgba(139,90,43,.06);transition:all .2s;border:2px solid transparent}
.hcard:active{transform:scale(.94);border-color:var(--pri)}
.hcard .hc-emoji{font-size:40px;margin-bottom:4px;display:block}
.hcard .hc-label{font-size:14px;font-weight:700;color:var(--txt)}
.hcard .hc-sub{font-size:10px;color:var(--tx2);margin-top:1px}
.hcard.pri{background:var(--pri-l)}
.hcard.sec{background:var(--sec-l)}
.hcard.acc{background:var(--acc-l)}
.hcard.inf{background:var(--info-l)}
.hcard.pet{border:3px dashed var(--pri)}

/* Section header */
.sect{font-size:13px;font-weight:700;color:var(--tx2);margin:0 0 8px;padding-left:2px}

/* CARDS */
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hd h2{font-size:16px;font-weight:700}
.hd small{font-size:11px;color:var(--tx2);font-weight:400}
.desc{font-size:13px;color:var(--tx2);margin-bottom:8px}

/* BUTTONS */
.btn{padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;transition:all .2s}
.btn:active{transform:scale(.95)}
.b1{background:var(--pri);color:#FFF}
.b2{background:var(--acc);color:#333}
.b3{background:var(--pri-l);color:var(--pri)}
.bs{padding:8px 14px;font-size:13px;border-radius:12px}
.br{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

/* GRIDS */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.pc{background:var(--pri-l);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;transition:all .2s;border:2px solid transparent}
.pc:active{transform:scale(.92);border-color:var(--pri)}
.py-big{font-size:22px;font-weight:700;color:var(--pri)}
.py-sm{font-size:10px;color:var(--tx2);margin-top:2px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.cc{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:all .2s}
.cc:active{transform:scale(.95)}
.cc.l{border-color:var(--ok);background:#F1F8F1}
.ch-big{font-size:28px;font-weight:700}.ch-py{font-size:11px;color:var(--pri)}.ch-st{font-size:10px;color:var(--tx2)}
.cbtn{font-size:10px;padding:3px 8px;border-radius:8px;border:1px solid #ddd;background:#FFF;cursor:pointer;margin:3px 2px 0}

/* POEMS */
.pom{background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.pom-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pl{cursor:pointer;padding:3px 8px;border-radius:8px;line-height:1.8;transition:background .2s}
.pl:active{background:var(--pri-l)}
.pl .py{font-size:10px;color:var(--tx2);display:block}
.pl .tx{font-size:15px}

/* MATH */
.mq{font-size:30px;font-weight:800;text-align:center;margin:14px 0;color:var(--pri)}
.mo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.moi{padding:12px 22px;border-radius:14px;border:2px solid var(--bd);background:#FFF;font-size:20px;font-weight:700;cursor:pointer;min-width:56px;text-align:center;transition:all .2s}
.moi:active{transform:scale(.93)}
.moi.g{background:#E8F5E9;border-color:var(--ok);color:var(--ok)}
.moi.b{background:#FFEBEE;border-color:var(--bad);color:var(--bad)}
.lb{padding:8px 14px;border-radius:12px;border:2px solid var(--bd);background:#FFF;font-size:13px;cursor:pointer;font-weight:600}
.lb.on{background:var(--pri);color:#FFF;border-color:var(--pri)}

/* SUDOKU */
.sg{display:grid;gap:2px;justify-content:center;margin:14px auto;max-width:260px}
.sc{width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:#FFF;border:1px solid var(--bd);cursor:pointer;border-radius:6px}
.sc.given{background:var(--pri-l)}
.sc.sel{background:var(--acc-l);border-color:var(--acc)}
.sc.err{background:#FFEBEE;color:var(--bad)}
.sn{display:flex;gap:6px;justify-content:center;margin:10px 0}
.sni{width:38px;height:38px;border-radius:10px;background:var(--pri);color:#FFF;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* SCHULTE */
.sch{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:280px;margin:0 auto}
.schl{aspect-ratio:1;background:#FFF;border:2px solid var(--bd);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;cursor:pointer;transition:all .12s}
.schl.d{background:var(--ok);color:#FFF}.schl.w{background:var(--bad);color:#FFF}

/* ENGLISH */
.etabs{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.etab{flex:0 0 auto;padding:7px 12px;border-radius:16px;border:2px solid var(--bd);background:#FFF;font-size:12px;white-space:nowrap;cursor:pointer}
.etab.on{background:var(--info);color:#FFF;border-color:var(--info)}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.ec{background:var(--card);border-radius:14px;padding:14px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.ec:active{transform:scale(.93)}
.em{font-size:36px}.en{font-size:14px;font-weight:700;color:var(--info);margin-top:3px}.ecn{font-size:11px;color:var(--tx2)}

/* SPORT */
.sp{background:#FFF;border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,.02)}
.sp-em{font-size:36px}.sp-nm{font-weight:700;font-size:14px}.sp-ds{font-size:11px;color:var(--tx2)}

/* DOG PET */
.dog-card{background:var(--card);border-radius:16px;padding:16px;text-align:center;box-shadow:0 3px 16px rgba(139,90,43,.08)}
.dog-av{font-size:80px;display:inline-block;transition:transform .3s}
.dog-av.pet{animation:wag .5s ease}.dog-av.bath{animation:shake .6s ease}.dog-av.eat{animation:bounce .6s ease}
@keyframes wag{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-12deg)}30%{transform:rotate(12deg)}45%{transform:rotate(-8deg)}60%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}60%{transform:translateY(-4px)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}
.hf{position:absolute;font-size:24px;pointer-events:none;animation:floatUp 1.5s ease-out forwards}
.dog-bar{width:100%;height:8px;background:#F0EBFA;border-radius:4px;margin:6px 0;overflow:hidden}
.dog-bar span{display:block;height:100%;background:var(--pri);border-radius:4px;transition:width .3s}
.dog-acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.dog-btn{flex:1;min-width:50px;padding:10px 6px;border-radius:14px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.dog-btn:active{transform:scale(.92)}
.dog-btn.feed{background:#FFF3E0;color:#E65100}
.dog-btn.pet{background:#FCE4EC;color:#C62828}
.dog-btn.bath{background:#E3F2FD;color:#1565C0}
.dog-btn.speak{background:#F3E5F5;color:#7B1FA2}

/* PIANO */
.piano-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 0}
.piano{display:flex;position:relative;height:160px;min-width:280px;justify-content:center}
.pkey{flex:1;max-width:48px;height:100%;background:#FFF;border:1px solid #CCC;border-radius:0 0 8px 8px;cursor:pointer;position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:11px;font-weight:700;color:#999}
.pkey:active{background:#E3F2FD}
.bkey{position:absolute;width:30px;height:55%;background:#333;border-radius:0 0 6px 6px;cursor:pointer;z-index:2;top:0}
.bkey:active{background:#555}
.sheet{background:var(--acc-l);border-radius:10px;padding:12px;font-size:13px;margin:10px 0;line-height:1.6}

/* PARENT */
.pin-dot{width:60px;height:60px;border-radius:50%;border:3px solid var(--bd);background:#FFF;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:4px}
.pin-dot.filled{background:var(--pri);border-color:var(--pri)}

/* CALENDAR */
.clg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cll{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.cll.e{background:transparent}.cll.d{background:#FFF;border:1px solid var(--bd)}
.cll.f{background:var(--ok);color:#FFF}.cll.p{background:var(--acc);color:#333}
.cll.m{background:#F5F5F5;color:#CCC}.cll.t{border:2px solid var(--pri)}
.cl-hd{text-align:center;font-weight:700;font-size:16px;margin-bottom:10px}

/* MODALS */
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center}
.md{background:#FFF;border-radius:18px;padding:18px;max-width:320px;width:90%}
.md-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.md-hd span{font-weight:700;font-size:16px}.md-hd button{font-size:22px;color:var(--tx2)}
#hwTarget{width:200px;height:200px;margin:14px auto;background:#FFFDF5;border:2px dashed var(--bd);border-radius:14px;overflow:hidden}
.rw{text-align:center;padding:28px 16px}

/* TOAST */
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#FFF;padding:8px 18px;border-radius:20px;font-size:13px;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}

@media(max-width:380px){
  .home-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .hcard{padding:12px 6px}.hc-emoji{font-size:34px}.hc-label{font-size:13px}
  .pg{grid-template-columns:repeat(4,1fr)}.cg{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="back" id="backBtn" onclick="goHome()">←</button>
    <div class="ttl" id="ttl">幼小衔接快乐营</div>
    <span class="pill">💎 <span id="pts">0</span></span>
    <span class="pill">🔥 <span id="strk">0</span></span>
  </header>
  <div id="ct"></div>
</div>

<!-- Hanzi Writer Modal -->
<div class="mo" id="hwM" style="display:none" onclick="clHW()">
  <div class="md" onclick="event.stopPropagation()">
    <div class="md-hd"><span id="hwTi"></span><button onclick="clHW()">✕</button></div>
    <div id="hwTarget"></div><p id="hwFb" style="font-size:12px;color:var(--tx2);text-align:center;margin:6px 0"></p>
    <div style="display:flex;gap:8px;justify-content:center"><button class="btn b1 bs" onclick="startHQ()">🎯 描红</button><button class="btn b3 bs" onclick="resetHW()">🔄 重播</button></div>
  </div>
</div>

<!-- Reward Modal -->
<div class="mo" id="rwM" style="display:none" onclick="hideRw()">
  <div class="md rw" onclick="event.stopPropagation()"><div style="font-size:56px">💎</div><div id="rwMsg" style="font-size:17px;font-weight:700"></div></div>
</div>

<!-- Dog Selection Modal -->
<div class="mo" id="dogSel" style="display:none">
  <div class="md" style="text-align:center" onclick="event.stopPropagation()">
    <div style="font-size:20px;font-weight:700;margin-bottom:12px">🐶 选一只狗狗伙伴吧！</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px" id="dogOpts"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
// ==================== STATE ====================
let S={pts:0,strk:0,dog:null,vR:{},ld:'',chars:{},pinyin:{},pinyinToday:{},pinyinDate:'',poems:{},mathC:0,mathT:0,focusM:0,badges:{},sport:{},sudoku:{},cal:{},pianoLog:{},parentPin:'1234',screenLimit:30,screenUsed:{},dailyGoal:{tasks:5,chars:3}};
if(!S.dog&&!S._dogChosen)try{const d=localStorage.getItem('yxxj_dog');if(d)S.dog=JSON.parse(d)}catch(e){}
function L(){try{const s=localStorage.getItem('yxxj_s');if(s){const p=JSON.parse(s);S={...S,...p}}}catch(e){}}
function R(){try{localStorage.setItem('yxxj_s',JSON.stringify(S))}catch(e){}}
function T(){return new Date().toISOString().split('T')[0]}
function Y(){return new Date(Date.now()-864e5).toISOString().split('T')[0]}

// ==================== UTILS ====================
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function uS(){const t=T();if(S.ld===t)return;if(S.ld===Y())S.strk++;else if(S.ld!==t)S.strk=0;if(!S.ld)S.strk=1;S.ld=t;R()}
function up(){document.getElementById('pts').textContent=S.pts;document.getElementById('strk').textContent=S.strk}
function awd(key,n,msg){
  if(S.vR[key])return!1;S.vR[key]=!0;S.pts=(S.pts||0)+n;
  const t=T(),d=Object.keys(S.vR).filter(k=>k.endsWith(t));
  if(d.length>12){S.vR[key]=!1;S.pts-=n;R();toast('今日奖励已达上限（12次）');return!1}
  R();up();sRw(msg);advDog(n);chkBadges();return!0
}
function sRw(msg){document.getElementById('rwMsg').textContent=msg;document.getElementById('rwM').style.display='flex';try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(523,ctx.currentTime);o.frequency.setValueAtTime(659,ctx.currentTime+.1);o.frequency.setValueAtTime(784,ctx.currentTime+.2);g.gain.setValueAtTime(.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+.5);o.start(ctx.currentTime);o.stop(ctx.currentTime+.5)}catch(e){}}
function hideRw(){document.getElementById('rwM').style.display='none'}

// ==================== VOICE SYSTEM ====================
let _sp=!1,_vs=[];
function primeS(){
  if(_sp)return;_sp=!0;
  if(!('speechSynthesis'in window))return;
  try{const u=new SpeechSynthesisUtterance('');u.volume=0;u.rate=1;speechSynthesis.speak(u);_vs=speechSynthesis.getVoices();if(!_vs.length)speechSynthesis.onvoiceschanged=()=>{_vs=speechSynthesis.getVoices()}}catch(e){}
}
function gV(){
  if(!_vs.length)_vs=speechSynthesis.getVoices();
  return _vs.find(v=>/zh-cn/i.test(v.lang))||_vs.find(v=>/^zh/i.test(v.lang)&&!/yue|hk|tw/i.test(v.lang))||_vs.find(v=>/^zh/i.test(v.lang));
}
function say(text,lang,rate,onEnd){
  primeS();if(!('speechSynthesis'in window)){if(onEnd)onEnd();return!1}
  try{
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
    u.lang=lang||'zh-CN';u.rate=rate||.7;u.volume=1;u.pitch=1;
    const v=gV();if(v)u.voice=v;
    let done=!1;const fin=()=>{if(!done){done=!0;if(onEnd)onEnd()}};
    u.onend=fin;u.onerror=fin;setTimeout(fin,Math.max(3000,text.length*500));
    speechSynthesis.speak(u);return!0
  }catch(e){if(onEnd)onEnd();return!1}
}
function sayLine(lines,rate,onEnd){
  if(!lines||!lines.length){if(onEnd)onEnd();return}
  let i=0;const nxt=()=>{if(i>=lines.length){if(onEnd)onEnd();return}const ln=String(lines[i++]).trim();if(!ln)return nxt();say(ln,'zh-CN',rate||.7,nxt)};
  nxt();
}
let _ac=null,_pc=new Map();
function pA(aid,src,onEnd){
  let fin=!1;const done=r=>{if(!fin){fin=!0;if(onEnd)onEnd(r)}};
  try{if(_ac){_ac.pause();_ac.currentTime=0}
  const key=src+':'+aid;let a=_pc.get(key);
  if(!a){const url=src==='init'?`https://www.qqxiuzi.cn/audio/pinyin/${aid}.mp3`:`assets/pinyin/${aid}.mp3`;a=new Audio(url);a.preload='auto';_pc.set(key,a)}
  _ac=a;a.currentTime=0;a.onended=()=>done(!0);a.onerror=()=>done(!1);
  const p=a.play();if(p&&p.catch)p.catch(()=>done(!1));}catch(e){done(!1)}
}
function sayPy(py,aid,src){src=src||'syl';pA(aid,src,ok=>{if(!ok){toast('音频暂不可用');return}const t=T();if(S.pinyinDate!==t){S.pinyinToday={};S.pinyinDate=t}if(!S.pinyinToday[py]){S.pinyinToday[py]=!0;S.pinyin[py]=!0;R()}})}

// ==================== NAVIGATION ====================
let CP='home';
function showPage(id){
  CP=id;
  document.getElementById('backBtn').classList.toggle('show',id!=='home');
  document.getElementById('ttl').textContent=(PGS[id]||PGS.home).title||'幼小衔接快乐营';
  document.getElementById('ct').innerHTML='';
  (PGS[id]||PGS.home).render();
  window.scrollTo(0,0);
  uS();up();
}
function goHome(){showPage('home')}

// ==================== DOG SYSTEM ====================
const DOGS={
  golden:{n:'小金',em:'🐕',cn:'金毛',tr:'温柔陪伴',col:'#FF8C42',voice:'我是小金，最喜欢和你一起学习！',sounds:['汪汪！主人我们来学习吧！','嗷呜～摸摸我的头好不好？','呜呜，好开心呀！']},
  corgi:{n:'小柯',em:'🐶',cn:'柯基',tr:'活泼好动',col:'#FFB800',voice:'我是小柯，短腿也能跑得飞快！',sounds:['汪汪汪！写完字我们去跑步！','唔～再摸摸我的小短腿～','嘿嘿，学习使我快乐！']},
  husky:{n:'小哈',em:'🐺',cn:'哈士奇',tr:'调皮捣蛋',col:'#5B8C5A',voice:'嗷呜～我是小哈，今天学什么？',sounds:['嗷呜～这道题我来帮你做！','好痒好痒再抓抓！','耶耶耶，学习任务完成咯！']}};
const DST=[{xp:0,n:'幼犬'},{xp:60,n:'小狗'},{xp:180,n:'中犬'},{xp:400,n:'大狗'}];
function dlv(){const x=S.dog&&S.dog.xp||0;for(let i=DST.length-1;i>=0;i--)if(x>=DST[i].xp)return i;return 0}
function dpg(){const lv=dlv();if(lv>=DST.length-1)return 100;const x=S.dog&&S.dog.xp||0;return Math.round((x-DST[lv].xp)/(DST[lv+1].xp-DST[lv].xp)*100)}
function advDog(n){if(!S.dog)return;S.dog.xp=(S.dog.xp||0)+Math.max(2,n*2);S.dog.tasks=(S.dog.tasks||0)+1;R()}
function saveDog(){try{localStorage.setItem('yxxj_dog',JSON.stringify(S.dog))}catch(e){}}

function showDogSelect(){
  if(S.dog)return;

function pickDog(id){
  S.dog={type:id,xp:0,hu:60,hy:60,en:60,tasks:0,ad:T()};S._dogChosen=!0;
  R();saveDog();
  document.getElementById('dogSel').style.display='none';
  primeS();say(DOGS[id].voice,'zh-CN',.8);

  up();showPage('dog');
}

function fDog(){if(!S.dog)return;primeS();if((S.pts||0)<15)return toast('💎不够，去学习赚钻石吧！');S.pts-=15;S.dog.hu=Math.min(100,S.dog.hu+35);S.dog.xp+=4;R();saveDog();up();showPage('dog');say('汪汪！好吃好吃！','zh-CN',.9);dogAni('eat')}
function pDog(){if(!S.dog)return;primeS();S.dog.en=Math.min(100,S.dog.en+20);S.dog.xp+=2;R();saveDog();showPage('dog');say(DOGS[S.dog.type].sounds[1],'zh-CN',.85);dogAni('pet')}
function bDog(){if(!S.dog)return;primeS();if((S.pts||0)<8)return toast('💎不够！');S.pts-=8;S.dog.hy=Math.min(100,S.dog.hy+40);S.dog.xp+=3;R();saveDog();up();showPage('dog');say('呜～洗干净了好舒服！','zh-CN',.85);dogAni('bath')}
function tDog(){if(!S.dog)return;primeS();const d=DOGS[S.dog.type],p=S.dog;
  let m=d.sounds[2];
  if(p.hu<40)m='汪汪！好饿呀，能给我点吃的吗？';else if(p.hy<40)m='唔，身上有点脏了，帮我洗洗吧～';else if(p.en<40)m='汪！我想出去玩！';
  say(m,'zh-CN',.88);dogAni('pet')
}
function dogAni(type){const el=document.getElementById('dogAv');if(!el)return;el.classList.remove('pet','bath','eat');void el.offsetWidth;el.classList.add(type);
  if(type==='pet'){const h=document.getElementById('dogH');if(h){h.innerHTML='<span class="hf">❤️</span>';setTimeout(()=>h.innerHTML='',1600)}}
  setTimeout(()=>el.classList.remove('pet','bath','eat'),1000)
}

// HANZI WRITER
let _hw=null,_hch='';
function ohw(ch,py){
  _hch=ch;primeS();
  document.getElementById('hwTi').textContent='描红：'+ch+' ('+py+')';
  document.getElementById('hwTarget').innerHTML='';
  document.getElementById('hwFb').innerHTML='🔊 听读音…';
  document.getElementById('hwM').style.display='flex';
  say(ch+'，'+py,'zh-CN',.6,()=>{document.getElementById('hwFb').innerHTML='👋 用手指沿蓝色轮廓描红每一笔！'});
  if(typeof HanziWriter==='undefined'){document.getElementById('hwFb').innerHTML='⚠️ 需联网加载笔顺';return}
  try{_hw=HanziWriter.create('hwTarget',ch,{width:200,height:200,padding:5,strokeAnimationSpeed:1,delayBetweenStrokes:300,radicalColor:'#FF8C42',showCharacter:!1,showOutline:!0,outlineColor:'#E8D5C4'});_hw.loopCharacterAnimation()}catch(e){document.getElementById('hwFb').innerHTML='⚠️ 暂不支持笔顺动画'}
}
function startHQ(){
  if(!_hw)return;document.getElementById('hwFb').innerHTML='👋 沿着轮廓描红每一笔';
  _hw.quiz({onMistake:()=>{document.getElementById('hwFb').innerHTML='💡 方向不对，重来！'},onCorrectStroke:()=>{document.getElementById('hwFb').innerHTML='✅ 写得好！'},
    onComplete:function(s){const m=s.totalMistakes;let stars,sc,msg;if(m===0){stars='⭐⭐⭐';sc=15;msg='满分！'}else if(m<=2){stars='⭐⭐';sc=10;msg='不错！'}else{stars='⭐';sc=5;msg='加油！'}
    awd('hw_'+_hch+'_'+T(),sc,`${stars} ${msg} +${sc}💎`);say(msg,'zh-CN',.75);
    document.getElementById('hwFb').innerHTML=`${stars} ${msg}<br>${s.strokes}笔 错${m}次 +${sc}💎`;
    if(!S.chars[_hch]){S.chars[_hch]=!0;R()}}});
}
function resetHW(){if(_hw){_hw.loopCharacterAnimation();document.getElementById('hwFb').innerHTML='笔顺重播中…'}}
function clHW(){document.getElementById('hwM').style.display='none';_hw=null;if(CP==='chars')showPage('chars')}

let sN=4,sG=[],sS=[],sSel=null;
PGS.sudoku={title:'🧮 数独',render:function(){
  document.getElementById('ct').innerHTML=`
    <div class="card"><div class="hd"><h2>数独<small>儿童版</small></h2></div>

      <button class="lb ${sN===6?'on':''}" onclick="sSz(6);primeS();say('6乘6进阶','zh-CN',.7)">6×6 进阶</button></div>
    <div class="sg" id="sG" style="grid-template-columns:repeat(${sN},1fr)"></div>
    <div class="sn" id="sN"></div>
    <div class="br" style="justify-content:center"><button class="btn bs b3" onclick="chkS()">✅ 检查</button><button class="btn bs b3" onclick="newS()">🔄 新题</button></div></div>`;
  newS();
}};
function sSz(n){sN=n;showPage('sudoku')}
function newS(){sS=gnS(sN);sG=sS.map(r=>r.map(v=>Math.random()<.4?v:0));sSel=null;renS()}
function gnS(n){const g=[],sq=Math.sqrt(n);for(let r=0;r<n;r++){g.push([]);for(let c=0;c<n;c++)g[r].push(((r*sq+Math.floor(r/sq)+c)%n)+1)}return g}
function renS(){document.getElementById('sG').innerHTML=sG.map((r,ri)=>r.map((v,ci)=>`<div class="sc ${v!==0?'given':''} ${sSel&&sSel.r===ri&&sSel.c===ci?'sel':''}" onclick="selS(${ri},${ci})">${v||''}</div>`).join('')).join('');document.getElementById('sN').innerHTML=Array.from({length:sN},(_,i)=>`<div class="sni" onclick="filS(${i+1})">${i+1}</div>`).join('')}
function selS(r,c){if(sG[r][c]!==0)return;sSel={r,c};renS()}
function filS(v){if(!sSel)return;sG[sSel.r][sSel.c]=v;sSel=null;renS()}
function chkS(){let ok=!0;for(let r=0;r<sN;r++)for(let c=0;c<sN;c++){if(sG[r][c]!==sS[r][c]){ok=!1;document.querySelectorAll('.sc')[r*sN+c].classList.add('err')}}
  if(ok){const key='sud_'+T()+'_'+Object.keys(S.sudoku||{}).length;S.sudoku[key]=!0;R();awd(key,10,'数独完成！+10💎');say('太棒了！全对！','zh-CN',.75)}else toast('有错误，红色处需修改')}

function getAC(){if(!_ac2)_ac2=new(window.AudioContext||window.webkitAudioContext)();if(_ac2.state==='suspended')_ac2.resume();return _ac2}
function playNote(freq){
  const ctx=getAC();const o=ctx.createOscillator();const g=ctx.createGain();
  o.type='triangle';o.frequency.setValueAtTime(freq,ctx.currentTime);
  g.gain.setValueAtTime(.4,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+.8);
  o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime);o.stop(ctx.currentTime+.8);
}

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">
      <div class="card" style="text-align:center;padding:12px"><div style="font-size:28px">📖</div><div style="font-size:20px;font-weight:800;color:var(--ok)">${cc}</div><div style="font-size:11px;color:var(--tx2)">已学汉字</div></div>
      <div class="card" style="text-align:center;padding:12px"><div style="font-size:28px">🔤</div><div style="font-size:20px;font-weight:800;color:var(--info)">${pc}</div><div style="font-size:11px;color:var(--tx2)">已学拼音</div></div>
      <div class="card" style="text-align:center;padding:12px"><div style="font-size:28px">📜</div><div style="font-size:20px;font-weight:800;color:var(--acc)">${pm}</div><div style="font-size:11px;color:var(--tx2)">已学古诗</div></div>
    </div>
    <div class="card"><div class="hd"><h2>⚙️ 设置</h2></div>
    <div style="margin:8px 0"><label style="font-size:13px;font-weight:600">每日任务目标</label><input type="number" id="goalTasks" value="${S.dailyGoal.tasks}" style="width:100%;padding:10px;border:2px solid var(--bd);border-radius:12px;font-size:14px;margin-top:4px"><span style="font-size:11px;color:var(--tx2)">建议3-8次</span></div>
    <div style="margin:8px 0"><label style="font-size:13px;font-weight:600">每日识字目标</label><input type="number" id="goalChars" value="${S.dailyGoal.chars}" style="width:100%;padding:10px;border:2px solid var(--bd);border-radius:12px;font-size:14px;margin-top:4px"><span style="font-size:11px;color:var(--tx2)">建议3-10个</span></div>
    <div style="margin:8px 0"><label style="font-size:13px;font-weight:600">PIN码</label><input type="text" id="newPin" maxlength="4" placeholder="4位数字" style="width:100%;padding:10px;border:2px solid var(--bd);border-radius:12px;font-size:14px;margin-top:4px"></div>
    <button class="btn b1" style="width:100%;margin-top:8px" onclick="saveParent()">💾 保存设置</button></div>
    <button class="btn" style="width:100%;background:#FFEBEE;color:var(--bad);margin-top:8px;font-weight:600" onclick="S._parentAuth=!1;showPage('home')">🔒 退出家长模式</button></div>`;
}};
function showParentLock(){
  document.getElementById('ct').innerHTML=`
    <div class="card" style="text-align:center;padding:24px">
    <div style="font-size:48px;margin-bottom:8px">👨‍👩‍👧</div>
    <div style="font-weight:700;font-size:17px;margin-bottom:12px">家长验证</div>
    <div style="display:flex;justify-content:center;gap:6px;margin:12px 0" id="pinDots"></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:200px;margin:0 auto" id="pinKeys"></div>
    <div id="pinMsg" style="font-size:13px;color:var(--bad);margin-top:8px"></div></div>`;
  let pinInput='';
  const renderDots=()=>{document.getElementById('pinDots').innerHTML=Array.from({length:4},(_,i)=>`<div class="pin-dot ${i<pinInput.length?'filled':''}">${i<pinInput.length?'●':''}</div>`).join('')};
  const renderKeys=()=>{document.getElementById('pinKeys').innerHTML=[...'123','456','789','','0','←'].map(k=>k===''?`<div></div>`:`<div class="moi" style="min-width:50px;padding:14px" onclick="pinKey('${k}')">${k}</div>`).join('')};
  renderDots();renderKeys();
  window.pinKey=function(k){
    if(k==='←'){pinInput=pinInput.slice(0,-1)}else{pinInput+=k}
    renderDots();
    if(pinInput.length===4){
      if(pinInput===S.parentPin){S._parentAuth=!0;document.getElementById('pinMsg').textContent='';showPage('parent')}
      else{document.getElementById('pinMsg').textContent='PIN错误，请重试';pinInput='';renderDots()}
    }
  };
}
function saveParent(){S.dailyGoal.tasks=parseInt(document.getElementById('goalTasks').value)||5;S.dailyGoal.chars=parseInt(document.getElementById('goalChars').value)||3;const np=document.getElementById('newPin').value;if(np&&np.length===4)S.parentPin=np;R();toast('设置已保存！')}

function init(){
  L();uS();up();
  document.addEventListener('click',function(){primeS()},{once:!0,passive:!0});
  document.addEventListener('touchstart',function(){primeS()},{once:!0,passive:!0});
  if(!S.dog)showDogSelect();
  else showPage('home');
}
init();
</script>
