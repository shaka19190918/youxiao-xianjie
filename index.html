<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幼小衔接学习桌面</title>
<style>
:root{
  --cream:#FBF7EC; --paper:#FFFDF7; --ink:#4A4A3C; --soft:#8A8470;
  --line:#E9E2D0; --blue:#EAF3FB; --blueline:#BCD9EF; --main:#4E95D4;
  --yellow:#FFF4D3; --yellowline:#F1D48A; --green:#EAF6EA; --greenline:#BFE3BE;
  --orange:#FDE9D6; --orline:#F3C794; --red:#FCE8E5; --redline:#E7A99E;
  --ok:#4E9E5D; --err:#D97B6C; --errbg:#FDEBEB;
  --r:16px; --sh:0 4px 14px rgba(120,100,60,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--cream);color:var(--ink);overflow:hidden}
.wrap{display:flex;height:100vh;width:100vw}
button{font-family:inherit}
/* ============ 左侧导航 22% ============ */
#nav{width:22%;min-width:240px;max-width:300px;background:var(--cream);border-right:2px solid var(--blueline);display:flex;flex-direction:column;padding:14px 12px;overflow-y:auto;flex-shrink:0}
.nick{border:2px dashed var(--blueline);border-radius:14px;padding:9px 11px;background:#FFFDF7;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nick .lbl{font-size:11px;color:var(--soft);width:100%}
#nickInput{width:100%;border:none;outline:none;background:transparent;font-size:20px;font-weight:800;margin-top:1px;color:var(--ink);border-bottom:2px dashed transparent}
#nickInput:focus{border-color:var(--main)}
#topicBar{font-size:12px;color:var(--soft);margin:10px 2px 2px;line-height:1.5}
#topicBar b{color:var(--main)}
.prog{height:12px;background:#EEE8D8;border-radius:8px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--greenline),var(--yellowline),var(--orline));border-radius:8px;transition:width .4s}
.progTxt{font-size:11px;color:var(--soft);margin:3px 2px}
.mlang{font-size:11px;color:var(--soft);margin:3px 2px 0}
.navSec{font-size:11px;font-weight:800;color:#C6BFAC;letter-spacing:2px;margin:14px 4px 6px}
#navScroll{display:flex;flex-direction:column;gap:4px}
.navBtn{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border:2px solid transparent;border-radius:12px;background:#FFFDF7;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;transition:all .12s;text-align:left}
.navBtn:hover{transform:translateY(-1px)}
.navBtn.on{background:#fff;border-color:var(--main);box-shadow:var(--sh)}
.navBtn .ic{font-size:20px}
.navBtn .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.navBtn .pct{font-size:11px;color:var(--ok);font-weight:800}
#p{display:flex;flex-direction:column;gap:8px}
.pomoMini{background:var(--yellow);border:2px solid var(--yellowline);border-radius:14px;padding:10px}
.pomoMini .t{font-size:14px;font-weight:800;color:#B07D2A}
.pomoMini .row{display:flex;gap:6px;margin-top:8px}
.pomoMini .row button{flex:1;border:2px solid var(--yellowline);background:#FFFDF7;border-radius:10px;padding:8px 0;font-size:13px;font-weight:800;color:#B07D2A;cursor:pointer}
.pomoMini .muted{font-size:11px;color:#C4A25A;margin-top:6px}
/* ============ 右侧内容 78% ============ */
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper)}
#stage{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--paper);border-bottom:2px solid var(--blueline)}
#stIcon{font-size:26px}
#stTitle{font-size:21px;font-weight:900;white-space:nowrap}
#stSub{font-size:13px;color:var(--soft);flex:1;line-height:1.4}
#relearn{border:2px solid var(--blueline);background:#fff;border-radius:11px;padding:8px 14px;font-size:13px;font-weight:800;color:var(--main);cursor:pointer}
#reBtn:active{transform:scale(.97)}
#content{flex:1;overflow-y:auto;padding:18px 22px 70px}
#content>*{animation:fade .22s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.subTabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.subTabs button{border:2px solid var(--line);background:#FFFDF7;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;color:#6E6858;cursor:pointer}
.subTabs button.on{background:var(--blue);border-color:var(--main);color:var(--main)}
.pane{animation:fade .2s}
.card{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{font-size:18px;font-weight:900;margin-bottom:2px}
.card .des{font-size:13px;color:var(--soft);margin-bottom:10px;line-height:1.6}
.muted{color:var(--soft);font-size:12px}
/* 卡片墙 */
.cards{display:flex;flex-wrap:wrap;gap:12px}
.cardItem{width:112px;background:#FFFDF7;border:2px solid var(--line);border-radius:14px;padding:12px 6px 8px;text-align:center;cursor:pointer;transition:all .12s}
.cardItem:hover{transform:translateY(-3px);border-color:var(--main)}
.cardItem .big{font-size:38px;font-weight:900;line-height:1.25}
.cardItem .tip{font-size:14px;color:var(--main);font-weight:800;margin-top:4px}
.cardItem .hint{font-size:12px;color:var(--soft);line-height:1.5;margin-top:3px}
/* 大字卡弹窗 */
#bigMask{position:fixed;inset:0;background:rgba(80,70,35,.35);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
#bigMask.on{display:flex;animation:pop .2s}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
#bigBox{background:#fff;border-radius:22px;width:82%;max-width:430px;text-align:center;padding:26px 18px 22px;box-shadow:0 12px 60px rgba(0,0,0,.25);position:relative}
#bigBox .bBig{font-size:86px;font-weight:900;line-height:1.15}
#bigBox .bPi{font-size:24px;font-weight:800;color:var(--main);margin-top:4px}
#bigBox .bHi{font-size:15px;color:var(--soft);margin-top:10px;min-height:20px;line-height:1.6}
#bigBox .bBtns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.bclose{position:absolute;top:10px;right:14px;background:none;border:none;font-size:22px;cursor:pointer;color:#B4AE98}
.pbtn{border:none;border-radius:999px;padding:10px 22px;font-size:15px;font-weight:800;cursor:pointer;background:var(--blue);color:var(--main)}
.pbtn.alt{background:var(--green);color:#3E8A45}
.pbtn.warm{background:var(--yellow);color:#A67B1F}
.pbtn.ghost{background:#F2EFE6;color:var(--soft)}
.pbtn.mini{padding:7px 14px;font-size:13px}
/* 选择 */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;font-weight:700;cursor:pointer;background:#fff;transition:all .1s;width:100%;text-align:left}
.opt:hover{border-color:var(--main)}
.opt.led{pointer-events:none}
.opt.good{border-color:var(--ok);background:#ECF8EE}
.opt.bad{border-color:var(--ok);background:var(--okbg);border-color:var(--err);background:var(--errbg)}
.fbTxt{min-height:22px;margin-top:9px;font-size:15px;font-weight:800;color:var(--soft)}
.fbTxt.good{color:var(--ok)} .fbTxt.bad{color:var(--err)}
/* 配对 */
.pairGrid{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.pairCol{display:flex;flex-direction:column;gap:8px}
.pairBtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 18px;font-size:19px;font-weight:900;cursor:pointer;min-width:88px;text-align:center}
.pairBtn.on{border-color:var(--main);background:var(--blue)}
.pairBtn.good{border-color:var(--ok);background:#ECF8EE}
/* 生成式 */
.genRow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#FFFDF7;border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.genRow .gq{font-size:20px;font-weight:900;min-width:130px}
.genRow .btns{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.genBtn{border:2px solid var(--blueline);background:var(--blue);border-radius:10px;padding:7px 13px;font-size:13px;font-weight:800;color:var(--main);cursor:pointer}
.selG{display:flex;gap:10px;flex-wrap:wrap}
.selG button{border:2px solid var(--line);background:#fff;border-radius:12px;font-size:17px;font-weight:800;padding:11px 15px;cursor:pointer;min-width:50px}
.selG button.good{border-color:var(--ok);background:#ECF8F0}
.selG button.bad{border-color:var(--err);background:var(--errbg)}
.feed{margin-top:10px;font-size:15px;font-weight:800;color:var(--soft);min-height:22px}
.feed.good{color:var(--ok)} .feed.bad{color:var(--err)}
.feed .again{border:none;background:var(--blue);color:var(--main);border-radius:999px;padding:7px 18px;font-size:14px;font-weight:800;cursor:pointer;margin-top:6px}
/* 故事 */
.storyBody{border-left:5px solid var(--yellowline);background:#FFFDF6;border-radius:0 12px 12px 0;padding:13px 15px;line-height:2;font-size:16px;margin:10px 0}
.storkimgs{display:flex;align-items:center;justify-content:center;gap:16px;background:linear-gradient(135deg,var(--yellow),var(--orange));border-radius:14px;padding:16px;margin:10px 0;font-size:40px}
.wordWall{display:flex;flex-wrap:wrap;gap:8px;background:#FFF6;border-radius:12px;padding:12px}
.wordWall span{border:2px solid var(--blueline);border-radius:9px;padding:4px 10px;font-size:15px;font-weight:800;background:#F0F7FD;cursor:pointer}
/* 输入 */
.inrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numInput{width:96px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:19px;font-weight:800;text-align:center;outline:none}
.numInput:focus{border-color:var(--main)}
.okBtn{border:none;background:var(--main);color:#fff;border-radius:11px;padding:10px 20px;font-size:15px;font-weight:800;cursor:pointer}
/* 家长 */
#parentBtn{position:fixed;right:18px;bottom:18px;border:none;background:#fff;border:2px solid var(--line);border-radius:999px;padding:11px 16px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.14);z-index:400;color:var(--ink)}
#parentBtn:hover{transform:translateY(-1px)}
#pm{display:none;position:fixed;inset:0;background:rgba(60,50,20,.5);z-index:2000;align-items:center;justify-content:center;padding:16px}
#pm.on{display:flex}
#pmBox{width:min(1200px,100%);max-height:94vh;background:#fff;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.3)}
#pmHead{display:flex;align-items:center;gap:6px;padding:13px 16px;border-bottom:2px solid var(--line);background:var(--cream);flex-wrap:wrap}
#pmHead h3{font-size:17px;font-weight:900;flex:1;min-width:200px}
.pmBtn{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer;color:var(--ink)}
.pmBtn.prim{border-color:var(--main);color:var(--main)}
.pmBtn:active{transform:scale(.97)}
#pmBody{display:flex;flex:1;min-height:0;flex-direction:column}
@media(min-width:900px){#pmBody{flex-direction:row}}
#pmL{flex:1;min-width:0;overflow-y:auto;padding:12px;border-right:2px solid var(--line);background:#FBF8F0;max-height:60vh}
@media(min-width:900px){#pmL{max-height:none}}
#pmR{flex:1.4;min-width:0;overflow-y:auto;padding:14px 16px}
.pmSec{font-size:12px;color:var(--soft);margin:12px 4px 6px;font-weight:800;letter-spacing:1px}
.pmTi{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:11px;background:#fff;border:2px solid transparent;cursor:pointer;font-size:14px;font-weight:800;margin:3px 0}
.pmTi:hover{border-color:var(--blueline)}
.pmTi.sel{background:var(--blue);border-color:var(--main)}
.pmTi .e{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmTi .ic{font-size:16px}
.fi{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.fi label{font-size:13px;font-weight:800;color:var(--soft);min-width:64px}
.fi input,.fi select{flex:1;min-width:100px;border:2px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;outline:none;font-family:inherit;background:#fff}
.fi input:focus,.fi select:focus{border-color:var(--main)}
.miniBtn{border:none;border-radius:8px;width:26px;height:26px;font-size:13px;font-weight:900;cursor:pointer;flex-shrink:0}
.mu{background:var(--blue);color:var(--main)} .md{background:var(--blue);color:var(--main)} .mxx{background:var(--red);color:#c0392b}
.addBtn{border:2px dashed var(--blueline);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:800;color:var(--main);cursor:pointer;background:#F4F9FE;margin-top:6px}
.addBtn:active{transform:scale(.98)}
/* ============ 一年级素材板块样式 ============ */
.pyGrid{display:flex;flex-wrap:wrap;gap:10px}
.pyBtn{flex:0 1 calc(25% - 10px);min-width:76px;border:2px solid var(--blueline);background:#F0F8FF;border-radius:14px;padding:14px 4px 10px;text-align:center;font-size:24px;font-weight:900;color:var(--main);cursor:pointer;transition:all .12s}
.pyBtn small{display:block;font-size:11px;color:var(--soft);font-weight:600;margin-top:4px}
.pyBtn:active{transform:scale(.96)}
.chGrid{display:flex;flex-wrap:wrap;gap:12px}
.chCard{width:92px;background:#FFFDF7;border:2px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;cursor:pointer;transition:all .12s}
.chCard:hover{transform:translateY(-2px);border-color:var(--greenline)}
.chBig{font-size:44px;font-weight:900;line-height:1.15}
.chPy{font-size:15px;color:var(--main);font-weight:800;margin-top:2px}
.chW{font-size:11px;color:var(--soft);margin-top:2px}
.poemLine{cursor:pointer;margin:8px 0;padding:7px 10px;border-radius:10px;background:#FFFDF6;transition:background .12s}
.poemLine:hover{background:var(--yellow)}
.poemLine .poemPy{display:block;font-size:12px;color:var(--main);font-weight:600;margin-bottom:2px}
.poemLine .poemTx{display:block;font-size:17px;font-weight:800}
.petGrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.petCard{width:150px;background:#FFFDF7;border:2px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;transition:all .12s}
.petCard:hover{transform:translateY(-3px);border-color:var(--yellowline)}
.petEm{font-size:52px;line-height:1.2}
.petNm{font-size:17px;font-weight:900;margin-top:6px}
.petCn{font-size:12px;color:var(--soft)}
.petTr{font-size:12px;font-weight:800;margin-top:6px}
.petDisp{position:relative}
.petBar{height:12px;background:#EEE8D8;border-radius:8px;overflow:hidden;margin:10px auto 2px;max-width:260px}
.petBar i{display:block;height:100%;background:linear-gradient(90deg,var(--greenline),var(--yellowline),var(--orline));border-radius:8px}
.petActs{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.mQ{font-size:26px;font-weight:900;text-align:center;margin:14px 0}
.mb{margin-top:12px;text-align:center}
.tip{font-size:13px;color:var(--soft);line-height:1.6}
.readCard{line-height:2;font-size:16px;background:#FFFDF6;border-left:5px solid var(--yellowline);border-radius:0 12px 12px 0;padding:12px 15px;margin:10px 0}
/* ============ 竖屏 ============ */
@media (max-width:860px){
  body{overflow:auto}
  .wrap{flex-direction:column;height:auto;min-height:100vh}
  #nav{width:100%;min-width:0;border-right:none;border-bottom:2px solid var(--blueline);padding:10px;position:sticky;top:0;z-index:100;max-height:44vh;overflow-y:auto}
  #navScroll{flex-direction:row;overflow-x:auto;gap:8px;padding:2px 0 6px;scrollbar-width:none}
  #navScroll::-webkit-scrollbar{display:none}
  .navBtn{flex-shrink:0;width:auto;padding:9px 14px}
  .navBtn .pct,.pomoMini .row button{white-space:nowrap}
  #p{flex-direction:row;flex-wrap:wrap}
  #main{border-radius:0}
  #stage{padding:10px 14px;flex-wrap:wrap;gap:8px}
  #content{padding:14px}
  #stSub{flex-basis:100%;order:3}
  .cardItem{width:calc(50% - 8px)}
  .cardItem .big{font-size:36px}
  #bigBox{width:94%}
  #bigBox .bBig{font-size:72px}
  .pairGrid{gap:10px}
  .genRow{flex-direction:column;align-items:flex-start}
  .genRow .btns{margin-left:0}
  #parentBtn{padding:10px 13px;font-size:13px}
}
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav">
    <div class="nick">
      <div class="lbl">🧒 孩子昵称 <span onclick="saveNick()" style="cursor:pointer;color:var(--main)">✏️</span></div>
      <input id="nickname" maxlength="8" placeholder="点这里起个名字">
    </div>
    <div id="topicBar"></div>
    <div class="prog"><i id="progFill" style="width:0%"></i></div>
    <div class="progTxt" id="progTxt"></div>
    <div class="mlang" id="mlangTag"></div>
    <div class="navSec">学习板块</div>
    <div id="navScroll"></div>
    <div class="navSec">学习助力</div>
    <div id="p"></div>
  </nav>
  <main id="main">
    <div id="stage">
      <span id="stIcon">🚩</span>
      <span id="stTitle">幼小衔接学习桌面</span>
      <span id="stSub">选择左侧板块开始学习</span>
      <button id="reBtn" onclick="relLearThis()" title="清空本主题进度，重新学">🔄 重新学本主题</button>
    </div>
    <div id="content"></div>
  </main>
</div>
<button id="parentBtn" onclick="openPM()">👨‍👩‍👧 家长编辑</button>
<div id="pm"><div id="pmBox">
  <div id="pmHead" onclick="event.stopPropagation()">
    <h3>👨‍👩‍👧 家长编辑面板</h3>
    <button class="pmBtn prim" onclick="pmExport()">⬇ 导出 content.json</button>
    <button class="pmBtn" onclick="pmImport()">⬆ 导入</button>
    <button class="pmBtn" onclick="pmReset()">↩ 恢复默认</button>
    <button class="pmBtn prim" onclick="closePM()">完成 ✕</button>
  </div>
  <div id="pmBody">
    <div id="pmL"></div>
    <div id="pmR"></div>
  </div>
</div></div>
<div id="bigMask" onclick="if(event.target===this)closeBig()"><div id="bigBox"></div></div>
<script>
"use strict";
/* =============================================================
 * 幼小衔接学习桌面 · 核心引擎（一年级素材版）
 * 数据驱动 · 板块可家长编辑 · 完全离线单文件
 * 拼音/古诗/生字/英语/数学/阅读均使用本地 assets 真人音频
 * ============================================================*/
var LS="learningDesk_v2";
var CFG=null;   /* 内容(家长可改, localStorage) */
var DB=null;    /* 学习进度 */
var SC={b:"pinyin",g:""};

/* 拼音真人音频资源映射（assets/pinyin 目录，wav/mp3） */

function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=rand(i+1);var t=b[i];b[i]=b[j];b[j]=t}return b}

function qOpt(btn){

/* 返回题目数组: {t,o:[...],a:index} 或 {t,w:答案}(输入式) */
function genQ(g){
  var t=g.gen||"count",out=[],i;
  function mk(tpl,opts,ans){return {t:tpl,o:opts,a:ans}}
  switch(t){
    case "count":{
      var n=2+rand(8);
      var ems=["🌻","🍎","🐤","🍓","⭐","🚗","🎈","🐟"];
      var em=ems[rand(ems.length)];
      var s="";for(i=0;i<n;i++)s+=em;
      var opts=[n];while(opts.length<3){var x=n+rand(3)-1;if(x<1)x=1;if(opts.indexOf(x)<0)opts.push(x)}
      opts=shuf(opts);
      out.push(mk(s+"   有几个 "+em+"?",opts,opts.indexOf(n)));
      break}
    case "write":{
      var v=1+rand(9);

    case "match":{
      var em2=pick(["🐶","🍬","🎈","🌸","⭐"]);
      var cnt=2+rand(6);var s="";for(i=0;i<cnt;i++)s+=em2;
      var ops=[cnt,cnt+1,Math.max(1,cnt-1)].map(String);
      ops=ops.filter(function(x,ii,aa){return aa.indexOf(x)===ii});
      while(ops.length<3)ops.push(String(cnt+2));
      out.push(mk("数一数: "+s+"  有几个 "+em2+"?",ops,ops.indexOf(String(cnt))));
      break}
    case "compare":{
      var a=1+rand(9),b=1+rand(9);
      var sym=a>b?">":(a<b?"<":"=");
      out.push(mk(a+" ○ "+b+" 选符号",[">","<","="],sym===">"?0:(sym==="<"?1:2)));
      break}
    case "add":{
      var plus=rand(2),x=2+rand(8),y=1+Math.min(4,x);
      var q,d;
      if(plus){q=x+" + "+y+" = ?";d=x+y}else{q=x+" - "+y+" = ?";d=x-y}
      var opts=[d,d+1,Math.max(0,d-1)];opts=shuf(opts);
      out.push(mk(q,opts,opts.indexOf(d)));
      break}
    case "classify":{
      var pools=[["苹果","香蕉","橙子","椅子"],["小狗","小猫","小鱼","桌子"],["红","蓝","绿","香蕉"],["春","夏","秋","铅笔"]];
      var p=pick(pools);
      out.push(mk("找不一样:",p,p.indexOf(1)));
      break}
    case "pattern":{
      var base=[[1,2,3,4,5,6],[2,4,6,8,10],[3,6,9,12],[1,3,5,7,9],[5,10,15,20]];
      var b=pick(base);var d=b[1]-b[0];
      var next=b[2]+d;
      out.push(mk("找规律: "+b[0]+" "+b[1]+" "+b[2]+" 接下来是?",[String(b[3]),String(next),String(b[2]+2)],0));
      break}
    case "mem":{
      var set=shuf(["🍎","🍌","🍇","🍓","🍔","🥕"]).slice(0,4);
      out.push({t:"记住这 4 个: "+set.join(" ")+"；然后选你看到的",o:[set.join(" "),set.slice(0,3).join(" ")+"🍣",shuf(set).join(" ")],a:0});
      break}
    case "diff":{
      var rows=5,cols=5,emo=pick(["🌼","⚽","🔵","🍉"]);
      var lines=[],di=rand(rows),other=pick(["⭐","🌸","🔺","🟡"]);
      for(i=0;i<rows;i++){
        var row=[];for(j=0;j<cols;j++)row.push(emo);
        if(i===di)row[rand(cols)]=other;
        lines.push(row.join(""));
      }
      out.push(mk("哪一行不一样?",lines,di));
      break}
    case "seq":{
      var base=pick([[2,4,6,8],[1,3,5,7],[3,6,9,12],[5,10,15,20]]);
      var shown=base.slice(0,rand(3)+1);
      var nextv=base[shown.length]+(base[1]-base[0]);
      out.push({t:"看数字： "+shown.join(" , ")+"  下一个是?",o:[String(nextv),String(nextv+1),String(base[1])],a:0});
      break}
    case "clock":{
      var h=rand(12)+1;
      var txts=["点","整点"]; var qTxt="⏰ 现在是 "+h+" 点整，下面哪个钟？";
      out.push(mk("现在是 "+h+" 点整，选正确的:",["⌚ "+h+":00","⌚ "+(h+8%12)+":00","⌚ "+h+":30"],0));
      break}
    default:return[];
  }
  return out;
}

  var g=grp(SC.b,SC.g);

/* ================= 渲染派发 ================= */
function renderBoard(b,g){
  if(!b)return "";
  /* 组级：优先用 g.kind 路由（拼音/声母/韵母/生字/古诗等） */
  if(g&&g.kind){
    switch(g.kind){
      case "pinyin": return renderPyTones(g);
      case "pinyin2": return renderPyList(g);
      case "poem": return renderPoem(g);
      case "chars": return renderChars(g);
      default: break;
    }
  }
  /* 板块级：无 groups 的整板渲染 */
  var k=b.kind||"";
  if(k==="pet")return renderPet(b,g);
  if(k==="pinyin")return renderPyTones(b);
  if(k==="pinyin2")return renderPyList(b);
  if(k==="poem")return renderPoem(b);
  if(k==="chars")return renderChars(b);
  if(k==="math")return renderMathB(b,g);
  if(k==="english")return renderEnglishB(b,g);
  if(k==="reading")return renderReading(b,g);
  if(k==="pindu")return renderPindu(b);
  return "";
}

function pinduSpeak(pair,result){
  /* 播放组成音（声母+韵母）: 用 assets/pinyin 里已有的音节文件,没有则 TTS 兜底 */
  var parts=pair.split("-");
  if(parts.length===2){
    var smP=parts[0][0],ymP=parts[1];
    /* 播放韵母即组成音，声母用参考音文件(X) */
    var ymFile=PINYIN_AUDIO[ymP+'1']||(ymP+'.mp3');
