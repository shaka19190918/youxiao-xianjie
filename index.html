<title>幼小衔接快乐营</title>
<style>
:root{--pri:#A66CFF;--pri-l:#F1E9FF;--cn:#49C7C0;--math:#FFD567;--habit:#69C98C;--focus:#A66CFF;--bg:#FAF7FF;--card:#FFF;--txt:#332C43;--tx2:#80778E;--sh:0 8px 28px rgba(94,70,150,.10);--r:24px;--sb:env(safe-area-inset-bottom,20px);--bad:#E53935}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
#app{max-width:600px;margin:0 auto;min-height:100vh}
.header{position:sticky;top:0;z-index:100;background:linear-gradient(120deg,#AD7BFF,#F28AB2);padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 22px rgba(154,104,222,.28)}
.header .logo{font-size:20px;font-weight:800;color:#FFF;letter-spacing:1px;flex:1}
.header .pill{background:rgba(255,255,255,.25);border-radius:20px;padding:5px 12px;color:#FFF;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;margin-left:6px}
.main{padding:14px 16px;padding-bottom:calc(40px + var(--sb))}
.page{display:none}.page.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.btn{padding:12px 20px;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;border:none;font-family:inherit}.btn:active{transform:scale(.95)}
.b1{background:linear-gradient(135deg,#A66CFF,#E879B0);color:#FFF;box-shadow:0 5px 14px rgba(166,108,255,.28)}
.b2{background:linear-gradient(135deg,#FFD93D,#FFA726);color:#5D4037}
.b3{background:#FFF;color:var(--pri);border:2px solid var(--pri)}
.bs{padding:8px 14px;font-size:13px;border-radius:12px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.card-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}.card-hd .ic{font-size:26px}.card-hd h2{font-size:17px;font-weight:700}.card-hd small{font-size:11px;color:var(--tx2);margin-left:auto}
.desc{font-size:13px;color:var(--tx2);margin-bottom:10px}
.back{font-size:22px;color:var(--pri);padding:4px;cursor:pointer}
/* Home */
.welcome{background:linear-gradient(135deg,#A66CFF,#E879B0);border-radius:var(--r);padding:22px;color:#FFF;margin-bottom:14px;position:relative;overflow:hidden}
.welcome::after{content:'🎒📚✏️🌈';position:absolute;right:16px;top:16px;font-size:36px;opacity:.35}
.welcome h1{font-size:20px;margin-bottom:4px}.welcome p{font-size:13px;opacity:.9}
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border-radius:20px;padding:14px;text-align:center;box-shadow:var(--sh)}
.stat-card .si{font-size:28px}.stat-card .sv{font-size:22px;font-weight:800;color:var(--pri)}.stat-card .sl{font-size:11px;color:var(--tx2)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.qa-item{background:var(--card);border-radius:20px;padding:14px 6px;text-align:center;box-shadow:var(--sh);cursor:pointer;transition:all .2s;border:2px solid transparent}
.qa-item:active{transform:scale(.95)}
.qa-item .qi{font-size:34px;margin-bottom:4px;display:block}.qa-item .ql{font-size:13px;font-weight:700;color:var(--txt)}.qa-item .qs{font-size:10px;color:var(--tx2);margin-top:1px}
.qa-item.c1{background:linear-gradient(135deg,#FFE0E0,#FFCDD2)}.qa-item.c2{background:linear-gradient(135deg,#E0F7FA,#B2EBF2)}.qa-item.c3{background:linear-gradient(135deg,#FFF8E1,#FFECB3)}.qa-item.c4{background:linear-gradient(135deg,#E8F5E9,#C8E6C9)}.qa-item.c5{background:linear-gradient(135deg,#E3F2FD,#BBDEFB)}.qa-item.c6{background:linear-gradient(135deg,#F3E5F5,#E1BEE7)}
.sect-t{font-size:14px;font-weight:800;color:var(--tx2);margin:16px 0 8px;padding-left:2px}
/* Pinyin */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.pc{background:var(--card);border-radius:16px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s;border:2px solid #F0F0F0;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.pc:active{transform:scale(.92);background:var(--cn);color:#FFF;border-color:var(--cn)}
.pc .py-c{font-size:26px;font-weight:800}.pc .py-l{font-size:10px;color:var(--tx2);margin-top:3px}
.pc:active .py-l{color:#FFF}
/* Chars */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.cc{background:var(--card);border-radius:20px;padding:14px 6px;text-align:center;cursor:pointer;transition:all .2s;border:2px solid #F0F0F0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.cc:active{transform:scale(.92)}.cc .ch-b{font-size:36px;font-weight:800}.cc .ch-p{font-size:12px;color:var(--cn);margin-top:3px}.cc .ch-s{font-size:10px;color:var(--tx2)}
.cc.l{border-color:var(--habit);background:#F0FFF0}
.cbtn{font-size:10px;padding:3px 8px;border-radius:8px;border:1px solid #DDD;background:#FFF;cursor:pointer;margin:3px 2px 0}
/* Poems */
.pom{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--sh)}
.pom-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pl{cursor:pointer;padding:4px 8px;border-radius:8px;line-height:1.9;transition:background .2s}.pl:active{background:var(--pri-l)}
.pl .py{font-size:10px;color:var(--tx2);display:block}.pl .tx{font-size:15px}
/* Math */
.mq{font-size:32px;font-weight:800;text-align:center;margin:14px 0;color:var(--pri)}
.mo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}.mopts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.moi{padding:12px 22px;border-radius:16px;border:2px solid #E0E0E0;background:#FFF;font-size:20px;font-weight:700;cursor:pointer;min-width:56px;text-align:center;transition:all .2s;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.moi:active{transform:scale(.93)}.moi.g{background:linear-gradient(135deg,#6BCB77,#4CAF50);border-color:var(--habit);color:#FFF}.moi.b{background:#FFEBEE;border-color:var(--bad);color:var(--bad)}
.lb{padding:8px 14px;border-radius:14px;border:2px solid #E0E0E0;background:#FFF;font-size:13px;cursor:pointer;font-weight:600;transition:all .2s}
.lb.on{background:linear-gradient(135deg,#A66CFF,#E879B0);color:#FFF;border-color:transparent}
/* Sudoku */
.sg{display:grid;gap:2px;justify-content:center;margin:14px auto;max-width:260px}
.sc{width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:#FFF;border:1px solid #E0E0E0;cursor:pointer;border-radius:8px}
.sc.given{background:var(--pri-l)}.sc.sel{background:var(--math-l,#FFF8E1);border-color:var(--math)}.sc.err{background:#FFEBEE;color:var(--bad)}
.sn{display:flex;gap:6px;justify-content:center;margin:10px 0}
.sni{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#FF6B6B,#FF8E53);color:#FFF;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* Schulte */
.sch{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:280px;margin:0 auto}
.schl{aspect-ratio:1;background:#FFF;border:2px solid #E0E0E0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;cursor:pointer;transition:all .12s}
.schl.d{background:linear-gradient(135deg,#6BCB77,#4CAF50);color:#FFF;border-color:transparent}.schl.w{background:var(--bad);color:#FFF}
/* English */
.etabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.etab{flex:0 0 auto;padding:8px 14px;border-radius:16px;border:2px solid #E0E0E0;background:#FFF;font-size:12px;white-space:nowrap;cursor:pointer;font-weight:600;transition:all .2s}
.etab.on{background:linear-gradient(135deg,#4FC3F7,#29B6F6);color:#FFF;border-color:transparent}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px}
.ec{background:var(--card);border-radius:20px;padding:14px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:var(--sh)}
.ec:active{transform:scale(.93)}.ec .em{font-size:36px}.ec .en{font-size:14px;font-weight:700;color:#29B6F6;margin-top:3px}.ec .ecn{font-size:11px;color:var(--tx2)}
/* Sport */
.sp{background:#FFF;border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.sp-em{font-size:36px}.sp-nm{font-weight:700;font-size:14px}.sp-ds{font-size:11px;color:var(--tx2)}
/* === 3D DOG PET === */
.dog-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#667eea,#764ba2);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.dog-ov-t{font-size:24px;font-weight:800;color:#FFF;margin-bottom:6px;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.dog-ov-s{font-size:14px;color:rgba(255,255,255,.85);margin-bottom:28px;text-align:center}
.dog-cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:560px}
.dog-card{width:155px;background:#FFF;border-radius:28px;padding:18px 12px;text-align:center;cursor:pointer;box-shadow:0 12px 40px rgba(0,0,0,.15);transition:all .3s;border:4px solid transparent;position:relative;overflow:hidden}
.dog-card:hover,.dog-card:active{transform:translateY(-8px) scale(1.02);box-shadow:0 16px 48px rgba(0,0,0,.2)}
.dog-card.sel{border-color:var(--pri);transform:translateY(-8px);box-shadow:0 16px 48px rgba(255,107,107,.3)}
.dog-card .d-svg{width:130px;height:130px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center}
.dog-card .d-nm{font-size:18px;font-weight:800;margin-bottom:2px}
.dog-card .d-br{font-size:11px;color:var(--tx2);margin-bottom:6px}
.dog-card .d-tr{font-size:11px;padding:4px 12px;border-radius:16px;display:inline-block;font-weight:600}
.dog-card .d-chk{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#FF6B6B,#FF8E53);color:#FFF;font-size:16px;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.dog-card.sel .d-chk{opacity:1}
.dog-confirm{margin-top:26px;padding:14px 48px;border-radius:18px;background:linear-gradient(135deg,#FFD93D,#FFA726);color:#5D4037;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(255,167,38,.4);transition:all .2s;opacity:.4;pointer-events:none}
.dog-confirm.active{opacity:1;pointer-events:auto}.dog-confirm:active{transform:scale(.95)}
/* Dog main */
.dog-main{text-align:center}
.dog-display{position:relative;width:240px;height:240px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.dog-display svg{filter:drop-shadow(0 8px 16px rgba(0,0,0,.2));transition:all .3s}
.dog-bubble{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#FFF;border-radius:18px;padding:8px 16px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.12);white-space:nowrap;opacity:0;transition:all .3s;pointer-events:none;z-index:5}
.dog-bubble.show{opacity:1;top:-44px}
.dog-stats{margin:14px 0}
.dog-stat-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.dog-stat-row span:first-child{width:28px;text-align:center;font-size:18px}
.dog-bar-wrap{flex:1;height:12px;background:#F0EBFA;border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.dog-bar-wrap span{display:block;height:100%;border-radius:6px;transition:width .4s;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.dog-level{font-size:16px;font-weight:800;margin:4px 0}.dog-level small{font-weight:400;color:var(--tx2);font-size:12px}
.dog-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.dog-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 6px;border-radius:22px;font-size:13px;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s;border:none;min-height:64px}.dog-btn:active{transform:scale(.93);box-shadow:0 2px 4px rgba(80,53,108,.10)}
.dog-btn:active{transform:scale(.9)}
.dog-btn .di{font-size:30px}
.dog-btn.feed{background:linear-gradient(135deg,#FFF3E0,#FFE0B2);color:#E65100}
.dog-btn.pet-btn{background:linear-gradient(135deg,#FCE4EC,#F8BBD0);color:#C62828}
.dog-btn.bath{background:linear-gradient(135deg,#E3F2FD,#BBDEFB);color:#1565C0}
.dog-btn.talk{background:linear-gradient(135deg,#F3E5F5,#E1BEE7);color:#7B1FA2}
@keyframes dogWag{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes dogBounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px)}60%{transform:translateY(-4px)}}
@keyframes dogShake{0%,100%{transform:rotate(0)}15%{transform:rotate(-10deg)}30%{transform:rotate(10deg)}45%{transform:rotate(-7deg)}60%{transform:rotate(7deg)}75%{transform:rotate(-3deg)}}
@keyframes dogRoar{0%,100%{transform:scale(1)}25%{transform:scale(1.15) rotate(-3deg)}50%{transform:scale(1.2)}75%{transform:scale(1.1) rotate(3deg)}}
@keyframes dogHeart{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.dog-display.roar{animation:dogRoar .8s ease}
.dog-display.heart{animation:dogHeart .6s ease}
@keyframes dogBreathe{0%,100%{transform:scale(1)}25%{transform:scale(1.03)}50%{transform:scale(1.06)}75%{transform:scale(1.03)}}@keyframes dogBlink{0%,96%,100%{clip-path:inset(0)}97%,99%{clip-path:inset(40% 0 40% 0)}}@keyframes dogIdleSway{0%,100%{transform:rotate(0)}25%{transform:rotate(2deg)}50%{transform:rotate(0)}75%{transform:rotate(-2deg)}}@keyframes dogLookAround{0%,100%{transform:translateX(0)}20%{transform:translateX(4px)}40%{transform:translateX(0)}60%{transform:translateX(-4px)}80%{transform:translateX(0)}}@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(1.6)}}
.float-em{position:absolute;font-size:32px;pointer-events:none;animation:floatUp 1.8s ease-out forwards;z-index:10}
.dog-display.wag svg{animation:dogWag .5s ease}
.dog-display.bounce svg{animation:dogBounce .6s ease}
.dog-display.shake svg{animation:dogShake .7s ease}
/* Pet stage: a calmer, more premium home for the companion. */
.dog-overlay{background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.35),transparent 32%),linear-gradient(135deg,#8F70ED,#E982B0)}
.dog-card{border-radius:30px;background:linear-gradient(180deg,#FFF,#FAF6FF);box-shadow:0 14px 34px rgba(66,39,110,.22)}
.dog-card.sel{border-color:#A66CFF;box-shadow:0 18px 46px rgba(166,108,255,.34)}
.dog-card .d-svg{border-radius:22px;overflow:hidden;background:#FFF9E8}
.dog-card .d-svg img{border-radius:20px}
.dog-confirm{background:linear-gradient(135deg,#FFD86B,#F6A645);box-shadow:0 8px 22px rgba(246,166,69,.34)}
.dog-main{position:relative;overflow:hidden;padding:22px 18px;background:linear-gradient(160deg,#FFF 0%,#F8F1FF 60%,#FDF7FB 100%);border:1px solid rgba(166,108,255,.16)}
.dog-main::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;right:-110px;top:-128px;background:radial-gradient(circle,rgba(255,214,103,.32),rgba(255,214,103,0) 68%);pointer-events:none}
.dog-main .card-hd,.dog-main .dog-display,.dog-main .dog-level,.dog-main .dog-bar-wrap,.dog-main .dog-stats,.dog-main .dog-acts{position:relative;z-index:1}
.dog-display{border-radius:38px;background:radial-gradient(circle at 50% 24%,#FFFDF3 0%,#F8EFD9 65%,#EFD9B9 100%);box-shadow:inset 0 0 0 6px rgba(255,255,255,.7),0 12px 28px rgba(110,78,143,.16);overflow:visible}
.dog-display img{position:relative;z-index:1;border-radius:32px;filter:drop-shadow(0 10px 12px rgba(77,51,51,.18))!important;transition:transform .28s ease}
.dog-display.wag img{animation:dogWag .5s ease}.dog-display.bounce img{animation:dogBounce .6s ease}.dog-display.shake img{animation:dogShake .7s ease}

.dog-bubble.show{top:-58px}

.dog-bar-wrap{height:14px;background:#EAE1F4}.dog-acts{gap:8px}.dog-btn{border:1px solid rgba(112,84,151,.09);box-shadow:0 4px 10px rgba(80,53,108,.07)}
/* === PIANO === */
.staff-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0}
.staff-card{background:#FFFEF7;border:2px solid #F0E6C0;border-radius:14px;padding:14px;margin:8px 0}
.staff-card .sc-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.staff-card .sc-num{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#FF6B6B,#FF8E53);color:#FFF;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.staff-card .sc-ti{font-weight:800;font-size:15px}.staff-card .sc-ds{font-size:11px;color:var(--tx2)}
.staff-card .sc-type{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600;margin-left:auto}

.piece-section{font-size:13px;font-weight:800;color:#FFF;margin:16px 0 8px;padding:8px 14px;background:linear-gradient(135deg,#A66CFF,#7C4DFF);border-radius:14px}
.timer-card{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:var(--r);padding:20px;text-align:center;color:#FFF;margin-bottom:14px}
.timer-disp{font-size:40px;font-weight:800;font-family:monospace;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.timer-lbl{font-size:13px;opacity:.85;margin-top:4px}
.timer-bar{height:8px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:12px;overflow:hidden}
.timer-bar span{display:block;height:100%;background:linear-gradient(90deg,#FFD93D,#FFA726);border-radius:4px;transition:width 1s linear}
/* Parent */
.wiz-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#667eea,#764ba2);z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}

.wiz-step{text-align:center;font-size:12px;color:var(--tx2);margin-bottom:4px}
.wiz-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px}
.wiz-desc{font-size:13px;color:var(--tx2);text-align:center;margin-bottom:20px}
.wiz-inp{width:100%;padding:14px 16px;border:2px solid #E0E0E0;border-radius:16px;font-size:16px;margin:8px 0;text-align:center;font-weight:600}
.wiz-inp:focus{border-color:var(--pri);outline:none}

/* Calendar */

.md{background:#FFF;border-radius:24px;padding:20px;max-width:340px;width:90%;max-height:80vh;overflow-y:auto}
.md-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.md-hd span{font-weight:800;font-size:17px}.md-hd button{font-size:24px;color:var(--tx2);cursor:pointer;background:none;border:none}
#hwTarget{width:200px;height:200px;margin:14px auto;background:#FFFDF5;border:2px dashed #E0D5B0;border-radius:14px;overflow:hidden}
.rw{text-align:center;padding:28px 16px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#FFF;padding:10px 20px;border-radius:22px;font-size:13px;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
@media(max-width:380px){

  .qa-item .qi{font-size:30px}

  .dog-card .d-svg{width:80px;height:80px;margin:0;flex-shrink:0}
  .dog-acts{grid-template-columns:repeat(2,1fr)}
}

<body>
<div id="app">
  <header class="header">
    <div class="logo" id="hLogo">幼小衔接快乐营</div>
    <span class="pill">💎<span id="pts">0</span></span>
    <span class="pill">🔥<span id="strk">0</span></span>
  </header>
  <div class="main"><div id="ct"></div></div>
</div>
<div class="mo" id="hwM" style="display:none" onclick="clHW()"><div class="md" onclick="event.stopPropagation()"><div class="md-hd"><span id="hwTi"></span><button onclick="clHW()">✕</button></div><div id="hwTarget"></div><p id="hwFb" style="font-size:12px;color:var(--tx2);text-align:center;margin:6px 0"></p><div style="display:flex;gap:8px;justify-content:center"><button class="btn b1 bs" onclick="startHQ()">🎯 描红</button><button class="btn b3 bs" onclick="resetHW()">🔄 重播</button></div></div></div>
<div class="mo" id="rwM" style="display:none" onclick="hideRw()"><div class="md rw" onclick="event.stopPropagation()"><div style="font-size:56px">💎</div><div id="rwMsg" style="font-size:17px;font-weight:700"></div></div></div>
<div id="dogSelWrap"></div><div id="wizWrap"></div>
<div class="toast" id="toast"></div>
<script>
// STATE
let S={pts:0,strk:0,dog:null,vR:{},ld:'',chars:{},pinyin:{},pinyinToday:{},pinyinDate:'',poems:{},mathC:0,mathT:0,focusM:0,badges:{},sport:{},sudoku:{},cal:{},pianoLog:{},pianoStart:0,pianoSec:0,parentPin:'1234',dailyGoal:{tasks:5,chars:3},_setup:{done:false,name:'',grade:'幼升小'},_parentAuth:false};
try{const s=localStorage.getItem('yxxj_s');if(s)S={...S,...JSON.parse(s)}}catch(e){}
try{const d=localStorage.getItem('yxxj_dog');if(d)S.dog=JSON.parse(d)}catch(e){}
function L(){}function R(){try{localStorage.setItem('yxxj_s',JSON.stringify(S))}catch(e){}}
function T(){return new Date().toISOString().split('T')[0]}function Y(){return new Date(Date.now()-864e5).toISOString().split('T')[0]}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function uS(){const t=T();if(S.ld===t)return;if(S.ld===Y())S.strk++;else if(S.ld!==t)S.strk=0;if(!S.ld)S.strk=1;S.ld=t;R()}
function up(){document.getElementById('pts').textContent=S.pts;document.getElementById('strk').textContent=S.strk}
function awd(key,n,msg){if(S.vR[key])return!1;S.vR[key]=!0;S.pts=(S.pts||0)+n;const t=T(),d=Object.keys(S.vR).filter(k=>k.indexOf(t)>-1);if(d.length>12){S.vR[key]=!1;S.pts-=n;R();toast('今日奖励已达上限');return!1}R();up();sRw(msg);advDog(n);return!0}
function sRw(msg){document.getElementById('rwMsg').textContent=msg;document.getElementById('rwM').style.display='flex';try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(523,ctx.currentTime);o.frequency.setValueAtTime(659,ctx.currentTime+.1);o.frequency.setValueAtTime(784,ctx.currentTime+.2);g.gain.setValueAtTime(.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+.5);o.start(ctx.currentTime);o.stop(ctx.currentTime+.5)}catch(e){}}
function hideRw(){document.getElementById('rwM').style.display='none'}
// VOICE
let _sp=!1,_vs=[];
function primeS(){if(_sp)return;_sp=!0;if(!('speechSynthesis'in window))return;try{const u=new SpeechSynthesisUtterance('');u.volume=0;speechSynthesis.speak(u);_vs=speechSynthesis.getVoices();if(!_vs.length)speechSynthesis.onvoiceschanged=()=>{_vs=speechSynthesis.getVoices()}}catch(e){}}
function gV(){if(!_vs.length)_vs=speechSynthesis.getVoices();return _vs.find(v=>/zh-cn/i.test(v.lang))||_vs.find(v=>/^zh/i.test(v.lang)&&!/yue|hk|tw/i.test(v.lang))||_vs.find(v=>/^zh/i.test(v.lang))}
function say(text,lang,rate,onEnd){primeS();if(!('speechSynthesis'in window)){if(onEnd)onEnd();return!1}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang||'zh-CN';u.rate=rate||.7;u.volume=1;u.pitch=1;const v=gV();if(v)u.voice=v;let d=!1;const f=()=>{if(!d){d=!0;if(onEnd)onEnd()}};u.onend=f;u.onerror=f;setTimeout(f,Math.max(3000,text.length*500));speechSynthesis.speak(u);return!0}catch(e){if(onEnd)onEnd();return!1}}
let _ac=null,_pc=new Map();function playLocalSeq(paths,ttsText,onEnd){let i=0,fail=0;const nxt=()=>{if(i>=paths.length){if(fail>=paths.length&&ttsText){say(ttsText,"zh-CN",.65,onEnd)}else{if(onEnd)onEnd()}return;}const path=paths[i++];let fin=!1;const done=()=>{if(!fin){fin=!0;nxt()}};try{if(_ac){_ac.pause();_ac.currentTime=0}const a=new Audio(path);a.preload="auto";_ac=a;a.onended=done;a.onerror=()=>{fail++;done()};const p=a.play();if(p&&p.catch)p.catch(()=>{fail++;done()});}catch(e){fail++;done()}};if(!paths.length){if(ttsText)say(ttsText,"zh-CN",.65,onEnd);else if(onEnd)onEnd();return}nxt();}
function pA(aid,src,onEnd){let fin=!1;const done=r=>{if(!fin){fin=!0;if(onEnd)onEnd(r)}};try{if(_ac){_ac.pause();_ac.currentTime=0}const key='local:'+aid;let a=_pc.get(key);if(!a){a=new Audio(`assets/pinyin/${aid}.mp3`);a.preload='auto';_pc.set(key,a)}_ac=a;a.currentTime=0;a.onended=()=>done(!0);a.onerror=()=>done(!1);const p=a.play();if(p&&p.catch)p.catch(()=>done(!1))}catch(e){done(!1)}}
function sayPy(py,aid,src){src=src||'syl';pA(aid,src,ok=>{if(!ok){toast('音频暂不可用');return}const t=T();if(S.pinyinDate!==t){S.pinyinToday={};S.pinyinDate=t}if(!S.pinyinToday[py]){S.pinyinToday[py]=!0;S.pinyin[py]=!0;R()}})}
// === 3D DOG images (Pixar-style rendered) ===
function dogSVG(type,size){size=size||120;
  const map={golden:'labrador-cartoon.png',corgi:'corgi-cartoon-v2.png',husky:'husky-cartoon.png'};
  const f=map[type]||'labrador-cartoon.png';
  return `<img src="assets/pets/${f}" width="${size}" height="${size}" style="object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.2))" alt="dog">`;
}
const DOGS={
  golden:{id:'golden',n:'小金',cn:'金毛寻回犬',tr:'温柔陪伴',col:'#F4A460',col2:'#C87F3A',voice:'汪汪！我是小金，最喜欢和你一起玩！',sounds:{feed:'汪汪！好吃好吃，谢谢你！',pet:'嗯～好舒服，再摸摸我的头好不好？',bath:'呜～洗干净了好开心！我要香喷喷地陪你学习！',talk:'汪汪！主人我们来学习吧！写完字我们出去跑步！'}},
  corgi:{id:'corgi',n:'小柯',cn:'彭布罗克柯基',tr:'活泼好动',col:'#E8923F',col2:'#B86A1E',voice:'汪！我是小柯，短腿也能跑得飞快！',sounds:{feed:'汪汪汪！太好吃啦！',pet:'嘿嘿嘿，别停别停，再抓抓我的小短腿～',bath:'噗噜噜～我不喜欢水，但为了香香我忍了！',talk:'汪汪！快去看看今天有什么好玩的！学习完我们去跑步！'}},
  husky:{id:'husky',n:'小哈',cn:'西伯利亚哈士奇',tr:'调皮捣蛋',col:'#8B8B9B',col2:'#5A5A6A',voice:'嗷呜～我是小哈！今天学什么？我帮你做题！',sounds:{feed:'嗷呜嗷呜！再来一碗！我还要！',pet:'好痒好痒再抓抓！对对对就是那里～',bath:'呜嗷嗷！水温刚好！舒服到灵魂出窍～',talk:'嗷呜～这道题我来帮你做！不对……这道题我不会……我们还是玩吧！'}}
};
const DST=[{xp:0,n:'幼体',sz:90},{xp:60,n:'成长期',sz:105},{xp:180,n:'进化体',sz:120},{xp:400,n:'完全体',sz:135}];
function dlv(){const x=S.dog&&S.dog.xp||0;for(let i=DST.length-1;i>=0;i--)if(x>=DST[i].xp)return i;return 0}
function dpg(){const lv=dlv();if(lv>=DST.length-1)return 100;const x=S.dog&&S.dog.xp||0;return Math.round((x-DST[lv].xp)/(DST[lv+1].xp-DST[lv].xp)*100)}
function advDog(n){if(!S.dog)return;var oldLv=dlv();S.dog.xp=(S.dog.xp||0)+Math.max(2,n*2);S.dog.tasks=(S.dog.tasks||0)+1;R();saveDog();if(dlv()>oldLv){setTimeout(function(){toast('🎉 伙伴升级到「'+DST[dlv()].n+'」啦！继续学习，继续进化！')},300)}}
function saveDog(){try{localStorage.setItem('yxxj_dog',JSON.stringify(S.dog))}catch(e){}}
// DOG SELECT
let _selDog=null;
function showDogSelect(){document.getElementById('dogSelWrap').innerHTML=`<div class="dog-overlay"><div class="dog-ov-t">🐶 选一只狗狗伙伴吧！</div><div class="dog-ov-s">它会陪你一起学习、一起成长哦～</div><div class="dog-cards" id="dsCards"></div><div style="margin-top:22px"><button class="dog-confirm" id="dsConfirm" onclick="confirmDog()">选定伙伴，开始探险！</button></div></div>`;document.getElementById('dsCards').innerHTML=Object.entries(DOGS).map(([id,d])=>`<div class="dog-card" id="dsc_${id}" onclick="selDog('${id}')"><div class="d-chk">✓</div><div class="d-svg">${dogSVG(id,110)}</div><div class="d-nm">${d.n}</div><div class="d-br">${d.cn}</div><div class="d-tr" style="background:${d.col}22;color:${d.col2}">${d.tr}</div></div>`).join('')}
function selDog(id){_selDog=id;document.querySelectorAll('.dog-card').forEach(c=>c.classList.remove('sel'));document.getElementById('dsc_'+id).classList.add('sel');const btn=document.getElementById('dsConfirm');btn.classList.add('active');btn.textContent='选定 '+DOGS[id].n+'，开始探险！';primeS();say(DOGS[id].voice,'zh-CN',.8)}
function confirmDog(){if(!_selDog)return toast('先选一只狗狗吧！');S.dog={type:_selDog,xp:0,hu:80,hy:80,en:80,tasks:0,ad:T()};R();saveDog();document.getElementById('dogSelWrap').innerHTML='';primeS();say(DOGS[_selDog].voice,'zh-CN',.8);setTimeout(()=>showPage('home'),500)}
// PARENT WIZARD
let _wStep=1,_wPin='',_wName='',_wGrade='幼升小',_wTasks=5,_wChars=3;
function showWizard(){_wStep=1;_wPin='';_wName=S._setup.name||'';_wGrade=S._setup.grade||'幼升小';_wTasks=S.dailyGoal.tasks;_wChars=S.dailyGoal.chars;renWiz()}

function startDogIdle(){if(_dogBusy)return;stopDogIdle();const el=document.getElementById('dogDisp');if(!el)return;const anims=['idle-breathe','idle-sway','idle-look','idle-breathe'];function nextIdle(){if(_dogBusy||!el||!document.getElementById('dogDisp'))return;el.classList.remove('idle-breathe','idle-sway','idle-look');void el.offsetWidth;el.classList.add(anims[_dogIdleAnim]);_dogIdleAnim=(_dogIdleAnim+1)%anims.length;_dogIdleTimer=setTimeout(nextIdle,3500+Math.random()*2000)}nextIdle()}

function dogAnim(type){const el=document.getElementById('dogDisp');if(!el)return;_dogBusy=true;stopDogIdle();el.classList.remove('wag','bounce','shake','roar','heart');void el.offsetWidth;if(type==='pet'){el.classList.add('heart');dogFloat(el,'❤️');el.style.transform='scale(1.05)';setTimeout(()=>el.style.transform='',400)}else if(type==='feed'){el.classList.add('bounce');dogFloat(el,'🍖');el.style.transform='translateY(-8px)';setTimeout(()=>el.style.transform='',500)}else if(type==='bath'){el.classList.add('shake');dogFloat(el,'💧');el.style.transform='rotate(-3deg)';setTimeout(()=>el.style.transform='',600)}else if(type==='talk'){el.classList.add('wag');dogFloat(el,'💬');el.style.transform='scale(1.03)';setTimeout(()=>el.style.transform='',300)}else if(type==='roar'){el.classList.add('roar');dogFloat(el,'🦖');el.style.transform='scale(1.15)';setTimeout(()=>el.style.transform='',500)}setTimeout(function(){el.classList.remove('wag','bounce','shake','roar','heart');_dogBusy=false;startDogIdle()},1600)}

PGS.sudoku={title:'🧮 数独',render:function(){document.getElementById('ct').innerHTML=`<button class="back" onclick="showPage('home')" style="margin-bottom:8px">←</button><div class="card"><div class="card-hd"><span class="ic">🧮</span><h2>数独</h2><small>儿童版</small></div><div style="display:flex;gap:6px;justify-content:center;margin:8px 0"><button class="lb ${sN===4?'on':''}" onclick="sSz(4);primeS();say('4乘4入门','zh-CN',.7)">4×4 入门</button><button class="lb ${sN===6?'on':''}" onclick="sSz(6);primeS();say('6乘6进阶','zh-CN',.7)">6×6 进阶</button></div><div class="sg" id="sG" style="grid-template-columns:repeat(${sN},1fr)"></div><div class="sn" id="sN"></div><div style="display:flex;gap:6px;justify-content:center"><button class="btn b3 bs" onclick="chkS()">✅ 检查</button><button class="btn b3 bs" onclick="newS()">🔄 新题</button></div></div>`;newS()}};
function sSz(n){sN=n;showPage('sudoku')}
function newS(){sS=gnS(sN);sG=sS.map(r=>r.map(v=>Math.random()<.4?v:0));sSel=null;renS()}
function gnS(n){const g=[],sq=Math.sqrt(n);for(let r=0;r<n;r++){g.push([]);for(let c=0;c<n;c++)g[r].push(((r*sq+Math.floor(r/sq)+c)%n)+1)}return g}
function renS(){document.getElementById('sG').innerHTML=sG.map((r,ri)=>r.map((v,ci)=>`<div class="sc ${v!==0?'given':''} ${sSel&&sSel.r===ri&&sSel.c===ci?'sel':''}" onclick="selS(${ri},${ci})">${v||''}</div>`).join('')).join('');document.getElementById('sN').innerHTML=Array.from({length:sN},(_,i)=>`<div class="sni" onclick="filS(${i+1})">${i+1}</div>`).join('')}
function selS(r,c){if(sG[r][c]!==0)return;sSel={r,c};renS()}
function filS(v){if(!sSel)return;sG[sSel.r][sSel.c]=v;sSel=null;renS()}
function chkS(){let ok=!0;for(let r=0;r<sN;r++)for(let c=0;c<sN;c++){if(sG[r][c]!==sS[r][c]){ok=!1;document.querySelectorAll('.sc')[r*sN+c].classList.add('err')}}if(ok){const key='sud_'+T()+'_'+Object.keys(S.sudoku||{}).length;S.sudoku[key]=!0;R();awd(key,10,'数独完成！+10💎');say('太棒了！全对！','zh-CN',.75)}else toast('有错误，红色处需修改')}

function drawStaff(notes){const w=Math.max(280,notes.length*28+40);let svg=`<svg viewBox="0 0 ${w} 80" width="${w}" height="80" style="max-width:100%">`;for(let i=0;i<5;i++)svg+=`<line x1="10" y1="${20+i*10}" x2="${w-10}" y2="${20+i*10}" stroke="#5D4037" stroke-width="1"/>`;svg+=`<line x1="10" y1="20" x2="10" y2="60" stroke="#5D4037" stroke-width="2"/>`;svg+=`<text x="14" y="48" font-size="28" fill="#5D4037" font-weight="bold">𝄞</text>`;notes.forEach((n,i)=>{const x=40+i*28;const np=notePos[n]||30;svg+=`<ellipse cx="${x}" cy="${np}" rx="6" ry="4.5" fill="#1A1A2E" transform="rotate(-20 ${x} ${np})"/>`;svg+=`<line x1="${x+5}" y1="${np-1}" x2="${x+5}" y2="${np-26}" stroke="#1A1A2E" stroke-width="1.5"/>`;svg+=`<text x="${x-4}" y="76" font-size="10" fill="#FF6B6B" font-weight="bold">${n}</text>`});svg+=`</svg>`;return svg}

let _pAudio=null;
function playPiece(notesStr){const notes=notesStr.split(',');let i=0;if(_pAudio)clearInterval(_pAudio);const ctx=new(window.AudioContext||window.webkitAudioContext)();const playOne=()=>{if(i>=notes.length){clearInterval(_pAudio);return}const n=notes[i];const f=noteFreq[n]||262;const o=ctx.createOscillator();const g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(f,ctx.currentTime);g.gain.setValueAtTime(.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+.5);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.5);i++};playOne();_pAudio=setInterval(playOne,500)}

function courseChecked(key){return S.courseLog&&S.courseLog[key]}
function checkCourse(key,name,timeStr){
  if(!S.courseLog)S.courseLog={};
  if(S.courseLog[key]){toast('这节课已打卡过了');return}
  // 时间窗口核验：开课前15分钟 ~ 下课时间 内才能打卡
  const m=(timeStr||'').match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
  if(m){
    const now=new Date();
    const nowMin=now.getHours()*60+now.getMinutes();
    const startMin=parseInt(m[1])*60+parseInt(m[2]);
    const endMin=parseInt(m[3])*60+parseInt(m[4]);
    if(nowMin < startMin-15){
      toast('还没到上课时间哦，'+(m[1]+':'+m[2])+' 才开始');
      return;
    }
    if(nowMin > endMin){
      toast('这节课已经下课啦，下次按时打卡哦');
      return;
    }
  }
  S.courseLog[key]=!0;R();
  awd('course_'+key,5,'🎉 '+name+' 上课打卡完成！');
  showPage('home');
}

/* Writing is assessed by the local HanziWriter stroke engine: it checks the
   canonical stroke order and direction.  A card is only learned at 65+. */
function openTraceV6(ch,py){
  _hch=ch;primeS();
  document.getElementById('hwTi').textContent='描红：'+ch+'（'+py+'）';
  document.getElementById('hwTarget').innerHTML='';
  document.getElementById('hwTarget').classList.add('tian-grid');
  document.getElementById('hwFb').innerHTML='先看蓝色笔顺，再按顺序描红。80 分才算通过。';
  document.getElementById('hwM').style.display='flex';
  playCue('trace_start','先看笔顺，再描红。');
  if(typeof HanziWriter==='undefined'){
    document.getElementById('hwFb').innerHTML='描红笔顺资源正在准备，暂时不能评分。';return;
  }
  try{
    _hw=HanziWriter.create('hwTarget',ch,{width:280,height:280,padding:20,strokeAnimationSpeed:0.8,delayBetweenStrokes:240,radicalColor:'#5d8cff',showCharacter:false,showOutline:true,outlineColor:'#b9cef9'});
    _hw.loopCharacterAnimation();
  }catch(e){document.getElementById('hwFb').innerHTML='这个字的笔顺资源暂不可用。'}
}
function beginTraceV6(){
  if(!_hw)return;
  let mistakes=0,correct=0;
  document.getElementById('hwFb').innerHTML='按笔顺、方向和轮廓认真描红。';
  _hw.quiz({
    onMistake:function(){mistakes++;document.getElementById('hwFb').innerHTML='这一步不对，看看蓝色笔画后重试。'},
    onCorrectStroke:function(){correct++;document.getElementById('hwFb').innerHTML='这一笔正确，继续！'},
    onComplete:function(summary){
      const score=Math.max(0,100-mistakes*18);
      const passed=score>=80;
      const feedback=passed?'通过！':'还没有通过，重看笔顺再写一次。';
      document.getElementById('hwFb').innerHTML=`${passed?'✅':'🔄'} ${feedback}<br>得分 ${score} 分 · 正确 ${correct} 笔 · 错误 ${mistakes} 次`;
      if(!passed){playCue('trace_retry','这次还没有通过，看看笔顺，再写一次。');return;}
      const reward=score>=90?12:score>=75?8:5;
      awd('trace_'+_hch+'_'+T(),reward,`描红 ${score} 分，获得 ${reward} 💎`);
      S.chars[_hch]=true;R();
      playCue('trace_pass','描红通过，写得真认真！');
    }
  });
}

PGS.english={title:'🔠 英语',render:function(){const words=ENGLISH_V6[englishTabV6];document.getElementById('ct').innerHTML=`<button class="back" onclick="showPage('home')">←</button><div class="card"><div class="child-task-title">英语小词卡</div><p class="desc">先听英文；想知道中文时，再点“翻译”。中文解释同样使用本地音频。</p><div class="etabs">${Object.keys(ENGLISH_V6).map(k=>`<button class="etab ${k===englishTabV6?'on':''}" onclick="englishTabV6='${k}';showPage('english')">${({animals:'动物',colors:'颜色',family:'家庭',body:'身体',actions:'动作',dialogue:'小对话'})[k]}</button>`).join('')}</div><div class="english-v6-grid">${words.map(w=>`<article class="english-word"><div class="em">${w[0]}</div><strong>${w[1]}</strong><button class="btn b3" onclick="sayEnglishV6('${w[1]}')">🔊 English</button><button class="btn b1" onclick="translateEnglishV6('${w[1]}','${w[2]}')">翻译</button></article>`).join('')}</div></div>`}}
const PIANO_V6={title:'欢乐颂（主题）',composer:'贝多芬 · 公共领域作品',tempo:96,notes:[['E4',.5],['E4',.5],['F4',.5],['G4',.5],['G4',.5],['F4',.5],['E4',.5],['D4',.5],['C4',.5],['C4',.5],['D4',.5],['E4',.5],['E4',.75],['D4',.25],['D4',1]]};
const PIANO_FREQ={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392};
function playPianoV6(){const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return toast('此设备不支持钢琴播放');const ctx=new Ctx(),beat=60/PIANO_V6.tempo,start=ctx.currentTime+.06;let at=start;PIANO_V6.notes.forEach(([note,len])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=PIANO_FREQ[note];g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.22,at+.015);g.gain.exponentialRampToValueAtTime(.0001,at+len*beat-.02);o.connect(g).connect(ctx.destination);o.start(at);o.stop(at+len*beat);at+=len*beat});setTimeout(()=>awd('pianov6_'+T(),6,'完成钢琴聆听，获得 6 💎'),Math.ceil((at-start)*1000)+120)}
PGS.piano={title:'🎹 钢琴',render:function(){const notes=PIANO_V6.notes.map(([n,l])=>`<span class="staff-note" title="${l}拍">${n.replace('4','')}</span>`).join('');document.getElementById('ct').innerHTML=`<button class="back" onclick="showPage('home')">←</button><div class="card"><div class="child-task-title">钢琴小练习</div><p class="desc">${PIANO_V6.composer}。4/4 拍，速度 ${PIANO_V6.tempo}；每个音按固定时值播放。</p><div class="staff-v6" aria-label="五线谱音名练习">${notes}</div><div class="piano-legend">右手 · C 大调 · 请跟着节拍听与弹</div><button class="btn b1" onclick="playPianoV6()">▶️ 准确节拍播放</button></div>`}}
function init(){migratePetsV6();uS();up();preloadAudio();document.addEventListener('click',function(){primeS();playQueuedCue()},{once:!0,passive:!0});document.addEventListener('touchstart',function(){primeS();playQueuedCue()},{once:!0,passive:!0});if(!S._setup.done){showWizard()}else if(!S.dog){showDogSelect()}else{showPage('home');setTimeout(()=>playCue(greetingCue(),'欢迎回来，小主人！'),350)}}
function preloadAudio(){try{var list=['assets/voice/trace_start.mp3','assets/voice/pet_hello.mp3','assets/voice/greeting_morning.mp3','assets/voice/greeting_late_morning.mp3','assets/voice/greeting_noon.mp3','assets/voice/greeting_afternoon.mp3','assets/voice/greeting_evening.mp3','assets/voice/greeting_night.mp3'];list.forEach(function(p){var a=new Audio();a.preload='auto';a.src=p;var k='local:'+p;if(!_pc.has(k))_pc.set(k,a)});if(typeof POEM_COURSE_V6!=='undefined'){POEM_COURSE_V6.forEach(function(p){var a=new Audio('assets/voice/'+p.key+'.mp3');a.preload='auto';_pc.set('local:'+p.key,a)})}}catch(e){}}
// INIT
init();
</script>
