<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFE0B2">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js" defer></script>
<title>幼小衔接快乐营</title>
<style>
:root{--bg:#FFF8F0;--pri:#FF8C42;--pri-l:#FFF0E5;--sec:#5B8C5A;--sec-l:#E8F5E9;--acc:#FFB800;--acc-l:#FFF8E1;--info:#4FC3F7;--info-l:#E1F5FE;--card:#FFF;--txt:#4A3728;--tx2:#8D7B6A;--ok:#66BB6A;--bad:#EF5350;--bd:#E8D5C4;--gold:#F4A460;--corgi:#E8923F;--husky:#8B8B8B}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
#app{max-width:600px;margin:0 auto;min-height:100vh;padding:8px 12px 40px}
.top{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100;background:var(--bg);padding:6px 0;margin-bottom:8px}
.back{font-size:24px;color:var(--pri);padding:4px;visibility:hidden}.back.show{visibility:visible}
.ttl{font-size:18px;font-weight:700;flex:1}
.pill{background:var(--card);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.04)}

/* Home grid */
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.hcard{background:var(--card);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;box-shadow:0 3px 12px rgba(139,90,43,.06);transition:all .2s;border:2px solid transparent}
.hcard:active{transform:scale(.94);border-color:var(--pri)}
.hcard .hc-emoji{font-size:38px;margin-bottom:4px;display:block}
.hcard .hc-label{font-size:14px;font-weight:700;color:var(--txt)}
.hcard .hc-sub{font-size:10px;color:var(--tx2);margin-top:1px}
.hcard.pri{background:var(--pri-l)}.hcard.sec{background:var(--sec-l)}.hcard.acc{background:var(--acc-l)}.hcard.inf{background:var(--info-l)}
.sect{font-size:13px;font-weight:700;color:var(--tx2);margin:18px 0 8px;padding-left:2px}
.sect:first-of-type{margin-top:8px}

/* Cards */
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}.hd h2{font-size:16px;font-weight:700}.hd small{font-size:11px;color:var(--tx2)}
.desc{font-size:13px;color:var(--tx2);margin-bottom:8px}

/* Buttons */
.btn{padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;transition:all .2s}.btn:active{transform:scale(.95)}
.b1{background:var(--pri);color:#FFF}.b2{background:var(--acc);color:#333}.b3{background:var(--pri-l);color:var(--pri)}
.bs{padding:8px 14px;font-size:13px;border-radius:12px}.br{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.danger-btn{width:100%;padding:12px;border-radius:14px;font-size:14px;font-weight:600;margin-top:10px}

/* Grids */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.pc{background:var(--pri-l);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;transition:all .2s;border:2px solid transparent}
.pc:active{transform:scale(.92);border-color:var(--pri)}.py-big{font-size:22px;font-weight:700;color:var(--pri)}.py-sm{font-size:10px;color:var(--tx2);margin-top:2px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.cc{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:all .2s}.cc:active{transform:scale(.95)}.cc.l{border-color:var(--ok);background:#F1F8F1}
.ch-big{font-size:28px;font-weight:700}.ch-py{font-size:11px;color:var(--pri)}.ch-st{font-size:10px;color:var(--tx2)}
.cbtn{font-size:10px;padding:3px 8px;border-radius:8px;border:1px solid #ddd;background:#FFF;cursor:pointer;margin:3px 2px 0}

/* Poems */
.pom{background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.pl{cursor:pointer;padding:3px 8px;border-radius:8px;line-height:1.8;transition:background .2s}.pl:active{background:var(--pri-l)}
.pl .py{font-size:10px;color:var(--tx2);display:block}.pl .tx{font-size:15px}

/* Math */
.mq{font-size:30px;font-weight:800;text-align:center;margin:14px 0;color:var(--pri)}
.mo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.moi{padding:12px 22px;border-radius:14px;border:2px solid var(--bd);background:#FFF;font-size:20px;font-weight:700;cursor:pointer;min-width:56px;text-align:center;transition:all .2s}
.moi:active{transform:scale(.93)}.moi.g{background:#E8F5E9;border-color:var(--ok);color:var(--ok)}.moi.b{background:#FFEBEE;border-color:var(--bad);color:var(--bad)}
.lb{padding:8px 14px;border-radius:12px;border:2px solid var(--bd);background:#FFF;font-size:13px;cursor:pointer;font-weight:600}.lb.on{background:var(--pri);color:#FFF;border-color:var(--pri)}

/* Sudoku */
.sg{display:grid;gap:2px;justify-content:center;margin:14px auto;max-width:260px}
.sc{width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:#FFF;border:1px solid var(--bd);cursor:pointer;border-radius:6px}
.sc.given{background:var(--pri-l)}.sc.sel{background:var(--acc-l);border-color:var(--acc)}.sc.err{background:#FFEBEE;color:var(--bad)}
.sn{display:flex;gap:6px;justify-content:center;margin:10px 0}
.sni{width:38px;height:38px;border-radius:10px;background:var(--pri);color:#FFF;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Schulte */
.sch{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:280px;margin:0 auto}
.schl{aspect-ratio:1;background:#FFF;border:2px solid var(--bd);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;cursor:pointer;transition:all .12s}
.schl.d{background:var(--ok);color:#FFF}.schl.w{background:var(--bad);color:#FFF}

/* English */
.etabs{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.etab{flex:0 0 auto;padding:7px 12px;border-radius:16px;border:2px solid var(--bd);background:#FFF;font-size:12px;white-space:nowrap;cursor:pointer}.etab.on{background:var(--info);color:#FFF;border-color:var(--info)}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.ec{background:var(--card);border-radius:14px;padding:14px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:0 2px 6px rgba(0,0,0,.03)}.ec:active{transform:scale(.93)}
.em{font-size:36px}.en{font-size:14px;font-weight:700;color:var(--info);margin-top:3px}.ecn{font-size:11px;color:var(--tx2)}

/* Sport */
.sp{background:#FFF;border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,.02)}
.sp-em{font-size:36px}.sp-nm{font-weight:700;font-size:14px}.sp-ds{font-size:11px;color:var(--tx2)}

/* === DOG PET FULL UI === */
.dog-select-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#FFF8F0,#FFE0B2);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.ds-title{font-size:24px;font-weight:800;color:var(--txt);margin-bottom:8px;text-align:center}
.ds-sub{font-size:14px;color:var(--tx2);margin-bottom:28px;text-align:center}
.ds-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:560px}
.ds-card{width:150px;background:#FFF;border-radius:20px;padding:16px 10px;text-align:center;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.08);transition:all .3s;border:3px solid transparent;position:relative;overflow:hidden}
.ds-card:hover,.ds-card:active{transform:translateY(-6px);box-shadow:0 10px 32px rgba(0,0,0,.12)}
.ds-card.sel{border-color:var(--pri);transform:translateY(-6px);box-shadow:0 10px 32px rgba(255,140,66,.2)}
.ds-card .ds-svg{width:100px;height:100px;margin:0 auto 8px}
.ds-card .ds-name{font-size:17px;font-weight:800;margin-bottom:2px}
.ds-card .ds-breed{font-size:12px;color:var(--tx2);margin-bottom:4px}
.ds-card .ds-trait{font-size:11px;padding:3px 10px;border-radius:20px;display:inline-block;margin-top:2px}
.ds-card .ds-check{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#FFF;font-size:14px;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .2s}
.ds-card.sel .ds-check{opacity:1}
.ds-confirm{margin-top:24px;padding:14px 44px;border-radius:16px;background:var(--pri);color:#FFF;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(255,140,66,.3);transition:all .2s;opacity:.3;pointer-events:none}
.ds-confirm.active{opacity:1;pointer-events:auto}.ds-confirm:active{transform:scale(.95)}

/* Dog main display */
.dog-main{text-align:center;padding:0}
.dog-display{position:relative;width:180px;height:180px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.dog-display svg{transition:all .3s}
.dog-bubble{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#FFF;border-radius:16px;padding:6px 14px;font-size:12px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.1);white-space:nowrap;opacity:0;transition:all .3s;pointer-events:none}
.dog-bubble.show{opacity:1;top:-40px}
.dog-stats{margin:12px 0}
.dog-stat-row{display:flex;align-items:center;gap:6px;margin:6px 0;font-size:12px}
.dog-stat-row span:first-child{width:36px;text-align:right;font-weight:600}
.dog-bar-wrap{flex:1;height:10px;background:#F0EBFA;border-radius:5px;overflow:hidden}
.dog-bar-wrap span{display:block;height:100%;border-radius:5px;transition:width .4s}
.dog-level{font-size:14px;font-weight:700;margin:4px 0}.dog-level small{font-weight:400;color:var(--tx2)}
.dog-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.dog-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;border:2px solid transparent}
.dog-btn:active{transform:scale(.9)}
.dog-btn .di{font-size:28px}
.dog-btn.feed{background:linear-gradient(135deg,#FFF3E0,#FFE0B2);border-color:#FFB74D;color:#E65100}
.dog-btn.pet-btn{background:linear-gradient(135deg,#FCE4EC,#F8BBD0);border-color:#F48FB1;color:#C62828}
.dog-btn.bath{background:linear-gradient(135deg,#E3F2FD,#BBDEFB);border-color:#64B5F6;color:#1565C0}
.dog-btn.talk{background:linear-gradient(135deg,#F3E5F5,#E1BEE7);border-color:#BA68C8;color:#7B1FA2}

/* Dog SVG animations */
@keyframes dogWag{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes dogBounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px)}60%{transform:translateY(-4px)}}
@keyframes dogShake{0%,100%{transform:rotate(0)}15%{transform:rotate(-10deg)}30%{transform:rotate(10deg)}45%{transform:rotate(-7deg)}60%{transform:rotate(7deg)}75%{transform:rotate(-3deg)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.5)}}
.floating-emoji{position:absolute;font-size:28px;pointer-events:none;animation:floatUp 1.8s ease-out forwards;z-index:10}
.dog-display.wag svg{animation:dogWag .5s ease}
.dog-display.bounce svg{animation:dogBounce .6s ease}
.dog-display.shake svg{animation:dogShake .7s ease}

/* === PIANO FULL === */
.piano-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 0}
.piano{display:flex;position:relative;height:160px;min-width:300px;justify-content:center;padding:0 20px}
.pkey{flex:1;max-width:48px;height:100%;background:linear-gradient(180deg,#FFF,#F5F5F5);border:1px solid #CCC;border-radius:0 0 8px 8px;cursor:pointer;position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:11px;font-weight:700;color:#999;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.pkey:active{background:#E3F2FD;box-shadow:inset 0 2px 4px rgba(0,0,0,.1)}
.bkey{position:absolute;width:30px;height:55%;background:linear-gradient(180deg,#444,#222);border-radius:0 0 6px 6px;cursor:pointer;z-index:2;top:0;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.bkey:active{background:linear-gradient(180deg,#666,#444)}
.piece-card{background:var(--card);border-radius:12px;padding:12px;margin:6px 0;cursor:pointer;transition:all .2s;border:2px solid transparent;display:flex;align-items:center;gap:10px}
.piece-card:active{transform:scale(.98);border-color:var(--pri)}
.piece-card .pc-num{width:28px;height:28px;border-radius:50%;background:var(--pri-l);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.piece-card .pc-info{flex:1;min-width:0}
.piece-card .pc-title{font-weight:700;font-size:14px}.piece-card .pc-desc{font-size:11px;color:var(--tx2)}
.piece-card .pc-score{font-size:10px;color:var(--pri);font-family:monospace;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.piece-card .pc-play{font-size:20px;flex-shrink:0;color:var(--info)}
.piano-section-title{font-size:13px;font-weight:700;color:var(--tx2);margin:14px 0 6px;padding:6px 10px;background:var(--acc-l);border-radius:8px}

/* === PARENT WIZARD === */
.wiz-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#667eea,#764ba2);z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#FFF}
.wiz-card{background:#FFF;border-radius:24px;padding:28px 24px;max-width:380px;width:100%;color:var(--txt);box-shadow:0 12px 48px rgba(0,0,0,.15)}
.wiz-step{text-align:center;font-size:12px;color:var(--tx2);margin-bottom:4px}
.wiz-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px}
.wiz-desc{font-size:13px;color:var(--tx2);text-align:center;margin-bottom:20px}
.wiz-inp{width:100%;padding:14px 16px;border:2px solid var(--bd);border-radius:14px;font-size:16px;margin:8px 0;text-align:center;font-weight:600}
.wiz-inp:focus{border-color:var(--pri);outline:none}
.wiz-btns{display:flex;gap:8px;margin-top:16px;justify-content:center}
.wiz-btn{padding:12px 28px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.wiz-btn.primary{background:var(--pri);color:#FFF;box-shadow:0 4px 12px rgba(255,140,66,.3)}
.wiz-btn.secondary{background:#F5F5F5;color:var(--tx2)}
.wiz-btn:active{transform:scale(.95)}
.wiz-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:0 auto}
.wiz-num{aspect-ratio:1;border-radius:14px;background:var(--pri-l);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--pri);cursor:pointer;border:2px solid transparent;transition:all .15s}
.wiz-num:active{background:var(--pri);color:#FFF}
.wiz-dots{display:flex;gap:10px;justify-content:center;margin:16px 0}
.wiz-dot{width:16px;height:16px;border-radius:50%;background:var(--bd);transition:all .2s}
.wiz-dot.filled{background:var(--pri);transform:scale(1.2)}
.wiz-done{font-size:56px;text-align:center;margin:10px 0}

/* Parent panel */
.parent-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pstat{background:var(--card);border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.pstat .ps-val{font-size:24px;font-weight:800}.pstat .ps-lbl{font-size:11px;color:var(--tx2);margin-top:2px}
.setting-row{margin:10px 0}.setting-row label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
.setting-row input{width:100%;padding:12px;border:2px solid var(--bd);border-radius:12px;font-size:15px}
.setting-row input:focus{border-color:var(--pri);outline:none}
.setting-hint{font-size:11px;color:var(--tx2);margin-top:2px}
.save-btn{width:100%;padding:14px;border-radius:14px;background:var(--pri);color:#FFF;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;transition:all .2s}.save-btn:active{transform:scale(.97)}

/* Calendar */
.clg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cll{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.cll.e{background:transparent}.cll.d{background:#FFF;border:1px solid var(--bd)}.cll.f{background:var(--ok);color:#FFF}.cll.p{background:var(--acc);color:#333}.cll.m{background:#F5F5F5;color:#CCC}.cll.t{border:2px solid var(--pri)}
.cl-hd{text-align:center;font-weight:700;font-size:16px;margin-bottom:10px}

/* Modals */
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center}
.md{background:#FFF;border-radius:18px;padding:18px;max-width:340px;width:90%;max-height:80vh;overflow-y:auto}
.md-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.md-hd span{font-weight:700;font-size:16px}.md-hd button{font-size:22px;color:var(--tx2)}
#hwTarget{width:200px;height:200px;margin:14px auto;background:#FFFDF5;border:2px dashed var(--bd);border-radius:14px;overflow:hidden}
.rw{text-align:center;padding:28px 16px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#FFF;padding:8px 18px;border-radius:20px;font-size:13px;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}

@media(max-width:380px){
  .home-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .hcard{padding:12px 6px}.hc-emoji{font-size:32px}.hc-label{font-size:13px}
  .pg{grid-template-columns:repeat(4,1fr)}.cg{grid-template-columns:repeat(3,1fr)}
  .ds-cards{flex-direction:column;align-items:center}
  .ds-card{width:220px;display:flex;align-items:center;gap:12px;text-align:left;padding:14px}
  .ds-card .ds-svg{width:70px;height:70px;margin:0;flex-shrink:0}
  .dog-acts{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="back" id="backBtn" onclick="goHome()">←</button>
    <div class="ttl" id="ttl">幼小衔接快乐营</div>
    <span class="pill">💎 <span id="pts">0</span></span>
    <span class="pill">🔥 <span id="strk">0</span></span>
  </header>
  <div id="ct"></div>
</div>

<!-- Hanzi Writer Modal -->
<div class="mo" id="hwM" style="display:none" onclick="clHW()"><div class="md" onclick="event.stopPropagation()"><div class="md-hd"><span id="hwTi"></span><button onclick="clHW()">✕</button></div><div id="hwTarget"></div><p id="hwFb" style="font-size:12px;color:var(--tx2);text-align:center;margin:6px 0"></p><div style="display:flex;gap:8px;justify-content:center"><button class="btn b1 bs" onclick="startHQ()">🎯 描红</button><button class="btn b3 bs" onclick="resetHW()">🔄 重播</button></div></div></div>

<!-- Reward Modal -->
<div class="mo" id="rwM" style="display:none" onclick="hideRw()"><div class="md rw" onclick="event.stopPropagation()"><div style="font-size:56px">💎</div><div id="rwMsg" style="font-size:17px;font-weight:700"></div></div></div>

<!-- Dog Selection -->
<div id="dogSelWrap"></div><!-- Rendered dynamically -->

<!-- Parent Setup Wizard -->
<div id="wizWrap"></div><!-- Rendered dynamically -->

<div class="toast" id="toast"></div>

<script>
// ==================== STATE ====================
let S={pts:0,strk:0,dog:null,vR:{},ld:'',chars:{},pinyin:{},pinyinToday:{},pinyinDate:'',poems:{},mathC:0,mathT:0,focusM:0,badges:{},sport:{},sudoku:{},cal:{},pianoLog:{},parentPin:'1234',dailyGoal:{tasks:5,chars:3},_setup:{done:false,name:'',grade:'幼升小'}};

function T(){return new Date().toISOString().split('T')[0]}
function Y(){return new Date(Date.now()-864e5).toISOString().split('T')[0]}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

// ==================== UTILS ====================
function uS(){const t=T();if(S.ld===t)return;if(S.ld===Y())S.strk++;else if(S.ld!==t)S.strk=0;if(!S.ld)S.strk=1;S.ld=t;R()}
function up(){document.getElementById('pts').textContent=S.pts;document.getElementById('strk').textContent=S.strk}
function awd(key,n,msg){
  if(S.vR[key])return!1;S.vR[key]=!0;S.pts=(S.pts||0)+n;
  const t=T(),d=Object.keys(S.vR).filter(k=>k.endsWith(t));
  if(d.length>12){S.vR[key]=!1;S.pts-=n;R();toast('今日奖励已达上限（12次）');return!1}
  R();up();sRw(msg);advDog(n);chkBadges();return!0
}
function sRw(msg){document.getElementById('rwMsg').textContent=msg;document.getElementById('rwM').style.display='flex';
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(523,ctx.currentTime);o.frequency.setValueAtTime(659,ctx.currentTime+.1);o.frequency.setValueAtTime(784,ctx.currentTime+.2);g.gain.setValueAtTime(.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+.5);o.start(ctx.currentTime);o.stop(ctx.currentTime+.5)}catch(e){}}
function hideRw(){document.getElementById('rwM').style.display='none'}

// ==================== VOICE SYSTEM ====================
let _sp=!1,_vs=[];
function primeS(){
  if(_sp)return;_sp=!0;
  if(!('speechSynthesis'in window))return;
  try{const u=new SpeechSynthesisUtterance('');u.volume=0;u.rate=1;speechSynthesis.speak(u);_vs=speechSynthesis.getVoices();if(!_vs.length)speechSynthesis.onvoiceschanged=()=>{_vs=speechSynthesis.getVoices()}}catch(e){}
}
function gV(){if(!_vs.length)_vs=speechSynthesis.getVoices();return _vs.find(v=>/zh-cn/i.test(v.lang))||_vs.find(v=>/^zh/i.test(v.lang)&&!/yue|hk|tw/i.test(v.lang))||_vs.find(v=>/^zh/i.test(v.lang))}
function say(text,lang,rate,onEnd){
  primeS();if(!('speechSynthesis'in window)){if(onEnd)onEnd();return!1}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang||'zh-CN';u.rate=rate||.7;u.volume=1;u.pitch=1;const v=gV();if(v)u.voice=v;let done=!1;const fin=()=>{if(!done){done=!0;if(onEnd)onEnd()}};u.onend=fin;u.onerror=fin;setTimeout(fin,Math.max(3000,text.length*500));speechSynthesis.speak(u);return!0}catch(e){if(onEnd)onEnd();return!1}
}
function sayLine(lines,rate,onEnd){if(!lines||!lines.length){if(onEnd)onEnd();return}let i=0;const nxt=()=>{if(i>=lines.length){if(onEnd)onEnd();return}const ln=String(lines[i++]).trim();if(!ln)return nxt();say(ln,'zh-CN',rate||.7,nxt)};nxt()}
let _ac=null,_pc=new Map();
function pA(aid,src,onEnd){let fin=!1;const done=r=>{if(!fin){fin=!0;if(onEnd)onEnd(r)}};try{if(_ac){_ac.pause();_ac.currentTime=0}const key=src+':'+aid;let a=_pc.get(key);if(!a){const url=src==='init'?`https://www.qqxiuzi.cn/audio/pinyin/${aid}.mp3`:`assets/pinyin/${aid}.mp3`;a=new Audio(url);a.preload='auto';_pc.set(key,a)}_ac=a;a.currentTime=0;a.onended=()=>done(!0);a.onerror=()=>done(!1);const p=a.play();if(p&&p.catch)p.catch(()=>done(!1))}catch(e){done(!1)}}
function sayPy(py,aid,src){src=src||'syl';pA(aid,src,ok=>{if(!ok){toast('音频暂不可用');return}const t=T();if(S.pinyinDate!==t){S.pinyinToday={};S.pinyinDate=t}if(!S.pinyinToday[py]){S.pinyinToday[py]=!0;S.pinyin[py]=!0;R()}})}

  if(_wizStep===1){
    h+=`<div class="wiz-step">步骤 1/3</div><div class="wiz-title">👋 家长您好！</div><div class="wiz-desc">为孩子设定专属学习空间</div>

    <div style="display:flex;gap:8px;margin-top:4px">${['幼升小','一年级','二年级'].map(g=>`<button class="lb ${_wizGrade===g?'on':''}" onclick="_wizGrade='${g}';renWiz()" style="flex:1">${g}</button>`).join('')}</div></div>

  }else if(_wizStep===2){
    h+=`<div class="wiz-step">步骤 2/3</div><div class="wiz-title">📋 每日目标</div><div class="wiz-desc">合理的目标让孩子更爱学习</div>
    <div style="margin:10px 0"><label style="font-size:13px;font-weight:600">每日任务次数</label><input class="wiz-inp" type="number" id="wizTasks" value="${_wizTasks}" min="1" max="20" oninput="_wizTasks=parseInt(this.value)||5"><span class="setting-hint" style="display:block;text-align:center">建议3-8次</span></div>
    <div style="margin:10px 0"><label style="font-size:13px;font-weight:600">每日识字目标（个）</label><input class="wiz-inp" type="number" id="wizChars" value="${_wizChars}" min="1" max="20" oninput="_wizChars=parseInt(this.value)||3"><span class="setting-hint" style="display:block;text-align:center">建议3-10个</span></div>
    <div class="wiz-btns"><button class="wiz-btn secondary" onclick="_wizStep=1;renWiz()">← 上一步</button><button class="wiz-btn primary" onclick="nxtWiz(2)">下一步 →</button></div>`;
  }else if(_wizStep===3){
    h+=`<div class="wiz-step">步骤 3/3</div><div class="wiz-title">🔒 设置家长密码</div><div class="wiz-desc">4位数字PIN，进入家长模式时需要</div>
    <div class="wiz-dots">${[0,1,2,3].map(i=>`<div class="wiz-dot ${i<_wizPin.length?'filled':''}"></div>`).join('')}</div>
    <div class="wiz-nums">${[1,2,3,4,5,6,7,8,9,'',0,'←'].map(k=>k===''?`<div></div>`:`<div class="wiz-num" onclick="wizKey('${k}')">${k}</div>`).join('')}</div>
    <div style="text-align:center;font-size:13px;color:var(--tx2);margin-top:4px">${_wizPin?'密码: '+_wizPin:'请输入4位数字'}</div>
    <div class="wiz-btns"><button class="wiz-btn secondary" onclick="_wizStep=2;renWiz()">← 上一步</button><button class="wiz-btn primary" style="opacity:${_wizPin.length===4?1:.3};pointer-events:${_wizPin.length===4?'auto':'none'}" onclick="finWiz()">✓ 完成设置</button></div>`;
  }
  h+='</div></div>';
  document.getElementById('wizWrap').innerHTML=h;
}
function wizKey(k){
  if(k==='←'){_wizPin=_wizPin.slice(0,-1)}else if(_wizPin.length<4){_wizPin+=k}
  renWiz();
}
function nxtWiz(fr){
  if(fr===1){_wizName=document.getElementById('wizNameInp').value.trim();if(!_wizName)return toast('请输入孩子昵称')}
  if(fr===2){_wizTasks=parseInt(document.getElementById('wizTasks').value)||5;_wizChars=parseInt(document.getElementById('wizChars').value)||3}
  _wizStep++;
  renWiz();
}
function finWiz(){
  S.parentPin=_wizPin;S.dailyGoal={tasks:_wizTasks,chars:_wizChars};S._setup={done:true,name:_wizName,grade:_wizGrade};
  R();document.getElementById('wizWrap').innerHTML='';
  toast('设置完成！欢迎进入学习空间 🎉');
  showDogSelect();
}

function dogFloat(el,emoji){
  const f=document.createElement('div');f.className='floating-emoji';f.textContent=emoji;
  f.style.left=Math.random()*60+20+'%';f.style.top='30%';
  el.appendChild(f);setTimeout(()=>f.remove(),1800);
}
function dogAnim(type){
  const el=document.getElementById('dogDisp');if(!el)return;
  el.classList.remove('wag','bounce','shake');void el.offsetWidth;
  if(type==='pet'){el.classList.add('wag');dogFloat(el,'❤️')}
  else if(type==='feed'){el.classList.add('bounce');dogFloat(el,'🍖')}
  else if(type==='bath'){el.classList.add('shake');dogFloat(el,'💧')}
  else if(type==='talk'){dogFloat(el,'💬')}
  setTimeout(()=>el.classList.remove('wag','bounce','shake'),1500);
}
function showBubble(msg){
  const b=document.getElementById('dogBub');if(!b)return;
  b.textContent=msg;b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),2800);
}

PGS.sudoku={title:'🧮 数独',render:function(){

    <div class="sg" id="sG" style="grid-template-columns:repeat(${sN},1fr)"></div>
    <div class="sn" id="sN"></div>
    <div class="br" style="justify-content:center"><button class="btn bs b3" onclick="chkS()">✅ 检查</button><button class="btn bs b3" onclick="newS()">🔄 新题</button></div></div>`;

function sSz(n){sN=n;showPage('sudoku')}
function newS(){sS=gnS(sN);sG=sS.map(r=>r.map(v=>Math.random()<.4?v:0));sSel=null;renS()}
function gnS(n){const g=[],sq=Math.sqrt(n);for(let r=0;r<n;r++){g.push([]);for(let c=0;c<n;c++)g[r].push(((r*sq+Math.floor(r/sq)+c)%n)+1)}return g}
function renS(){document.getElementById('sG').innerHTML=sG.map((r,ri)=>r.map((v,ci)=>`<div class="sc ${v!==0?'given':''} ${sSel&&sSel.r===ri&&sSel.c===ci?'sel':''}" onclick="selS(${ri},${ci})">${v||''}</div>`).join('')).join('');document.getElementById('sN').innerHTML=Array.from({length:sN},(_,i)=>`<div class="sni" onclick="filS(${i+1})">${i+1}</div>`).join('')}
function selS(r,c){if(sG[r][c]!==0)return;sSel={r,c};renS()}
function filS(v){if(!sSel)return;sG[sSel.r][sSel.c]=v;sSel=null;renS()}
function chkS(){let ok=!0;for(let r=0;r<sN;r++)for(let c=0;c<sN;c++){if(sG[r][c]!==sS[r][c]){ok=!1;document.querySelectorAll('.sc')[r*sN+c].classList.add('err')}}if(ok){const key='sud_'+T()+'_'+Object.keys(S.sudoku||{}).length;S.sudoku[key]=!0;R();awd(key,10,'数独完成！+10💎');say('太棒了！全对！','zh-CN',.75)}else toast('有错误，红色处需修改')}

    {n:36,ti:'前春曲',cn:'四手联弹 · 欣赏曲',type:'appreciation',score:'G A B C | D C B A | G G G G'},
    {n:37,ti:'问候',cn:'四手联弹 · 欣赏曲',type:'appreciation',score:'C E G C | D F A D | E G B E'},

];

PGS.piano={title:'🎹 钢琴',render:function(){
  let ph='';
  thompson2Sections.forEach(sec=>{
    ph+=`<div class="piano-section-title">📖 ${sec.title}</div>`;
    sec.pieces.forEach(p=>{
      const typelbl={review:'📖 复习',rhythm:'🎵 节奏',note:'🎵 新音',sharp:'♯ 升号',flat:'♭ 降号',key:'🎼 调号',exercise:'✏️ 练习',song:'🎶 曲目',duet:'👥 联弹',arpeggio:'🎹 分解',natural:'♮ 还原',accent:'💥 重音',appreciation:'👂 欣赏'};
      const badge=typelbl[p.type]||'🎵';
      ph+=`<div class="piece-card" onclick="showPiece('${p.n}','${p.ti.replace(/'/g,"\\'")}','${p.cn.replace(/'/g,"\\'")}','${p.score.replace(/'/g,"\\'")}','${p.type.replace(/'/g,"\\'")}')">
        <div class="pc-num">${p.n}</div>
        <div class="pc-info"><div class="pc-title">${p.ti}</div><div class="pc-desc">${badge} ${p.cn}</div><div class="pc-score">🎵 ${p.score}</div></div>
        <div class="pc-play">▶️</div></div>`;
    });
  });
  document.getElementById('ct').innerHTML=`
    <div class="card"><div class="hd"><h2>🎹 约翰·汤普森简易钢琴教程2</h2><small>共${thompson2Sections.reduce((s,v)=>s+v.pieces.length,0)}首</small></div>
    <p class="desc">点击曲目查看乐谱和弹奏，每个曲目可单独练习</p>
    <div class="piano-wrap"><div class="piano" style="position:relative;padding:0 30px">
      ${whiteKeys.map(k=>`<div class="pkey" onclick="playNote(${noteFreq[k]});primeS();say('${k.replace('4','')}','zh-CN',1)">${k.replace('4','')}</div>`).join('')}
      ${blackKeys.map(k=>`<div class="bkey" style="left:${k.pos}px" onclick="playNote(${noteFreq[k.n.replace('#','').replace('4','')]}*1.06);event.stopPropagation()" ontouchstart="event.preventDefault();playNote(${noteFreq[k.n.replace('#','').replace('4','')]}*1.06);event.stopPropagation()"></div>`).join('')}
    </div></div>
    <div class="card"><div class="hd"><h2>全部曲目</h2><small>按教材章节排列</small></div>${ph}</div>`;
}};
function showPiece(n,ti,cn,score,type){
  const typelbl={review:'复习曲',rhythm:'节奏训练',note:'新学音',sharp:'升记号',flat:'降记号',key:'调号学习',exercise:'练习题',song:'演奏曲',duet:'四手联弹',arpeggio:'分解和弦',natural:'还原记号',accent:'重音练习',appreciation:'欣赏曲'};
  document.getElementById('ct').innerHTML=`
    <button class="back show" onclick="showPage('piano')" style="margin-bottom:12px">← 返回曲目列表</button>
    <div class="card"><div class="hd"><h2>🎵 第${n}首：${ti}</h2><small>${typelbl[type]||''}</small></div>
    <p class="desc">${cn}</p>
    <div style="background:var(--acc-l);border-radius:14px;padding:16px;margin:12px 0;text-align:center">
      <div style="font-size:14px;color:var(--tx2);margin-bottom:4px">乐谱（音名字母）</div>
      <div style="font-size:16px;font-weight:700;color:var(--pri);font-family:monospace;letter-spacing:2px;line-height:2">${score}</div>
    </div>
    <p class="desc" style="text-align:center">🎹 对照上方音名在琴键上弹奏 | 每个空格是停顿 | 点击琴键发声</p>
    <div class="piano-wrap"><div class="piano" style="position:relative;padding:0 30px">
      ${whiteKeys.map(k=>`<div class="pkey" onclick="playNote(${noteFreq[k]});primeS();say('${k.replace('4','')}','zh-CN',1)">${k.replace('4','')}</div>`).join('')}
      ${blackKeys.map(k=>`<div class="bkey" style="left:${k.pos}px" onclick="playNote(${noteFreq[k.n.replace('#','').replace('4','')]}*1.06);event.stopPropagation()" ontouchstart="event.preventDefault();playNote(${noteFreq[k.n.replace('#','').replace('4','')]}*1.06);event.stopPropagation()"></div>`).join('')}
    </div></div>
    <button class="btn b1" style="display:block;margin:10px auto" onclick="awd('piano_'+T()+'_'+Date.now(),5,'练习完成！+5💎');say('弹得真好！','zh-CN',.7)">🎹 今日已练 +5💎</button></div>`;
}

// ==================== CALENDAR ====================
PGS.calendar={title:'📅 日历',render:function(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const fd=new Date(y,m,1).getDay()===0?7:new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate(),td=now.getDate();
  let h=`<div class="cl-hd">${y}年${m+1}月</div><div class="clg">`;
  ['一','二','三','四','五','六','日'].forEach(d=>h+=`<div style="text-align:center;font-size:11px;color:var(--tx2);padding:3px">${d}</div>`);
  for(let i=1;i<fd;i++)h+='<div class="cll e"></div>';
  let fc=0,pc=0;
  for(let d=1;d<=dim;d++){const dk=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const st=S.cal&&S.cal[dk];let cl='d';if(d===td)cl+=' t';if(st==='full'){cl+=' f';fc++}else if(st==='partial'){cl+=' p';pc++}else if(d<td)cl+=' m';h+=`<div class="cll ${cl}">${d}</div>`}
  h+=`</div><div style="display:flex;gap:10px;justify-content:center;margin-top:6px;font-size:11px"><span>🟢全勤</span><span>🟡部分</span><span>⬜未做</span></div>`;
  h+=`<div class="card" style="margin-top:10px;text-align:center"><div style="font-size:26px;font-weight:800;color:var(--pri)">${fc+pc}</div><div style="font-size:12px;color:var(--tx2)">本月打卡</div><div style="font-size:18px;font-weight:700;color:var(--ok);margin-top:6px">${fc}</div><div style="font-size:12px;color:var(--tx2)">全勤天数</div></div>`;
  document.getElementById('ct').innerHTML=`<div class="card"><div class="hd"><h2>学习日历</h2></div>${h}</div>`;
}};

// ==================== PARENT CONTROL (NEW) ====================
PGS.parent={title:'👨‍👩‍👧 家长控制',render:function(){
  if(!S._parentAuth)return showParentLock();
  const cc=Object.keys(S.chars).length,pc=Object.keys(S.pinyin).length,pm=Object.keys(S.poems).length;
  document.getElementById('ct').innerHTML=`
    <div class="card"><div class="hd"><h2>家长控制面板</h2></div>
    <div class="parent-stats">
      <div class="pstat"><div class="ps-val" style="color:var(--ok)">${cc}</div><div class="ps-lbl">已学汉字</div></div>
      <div class="pstat"><div class="ps-val" style="color:var(--info)">${pc}</div><div class="ps-lbl">已学拼音</div></div>
      <div class="pstat"><div class="ps-val" style="color:var(--acc)">${pm}</div><div class="ps-lbl">已学古诗</div></div>
      <div class="pstat"><div class="ps-val">${S.mathC||0}</div><div class="ps-lbl">做对题数</div></div>
      <div class="pstat"><div class="ps-val">${S.strk||0}</div><div class="ps-lbl">连续天数</div></div>
      <div class="pstat"><div class="ps-val" style="color:var(--pri)">${S.pts||0}</div><div class="ps-lbl">钻石</div></div>
      ${S.dog?`<div class="pstat"><div class="ps-val">${dlv()+1}</div><div class="ps-lbl">狗狗等级</div></div><div class="pstat"><div class="ps-val">${S.dog.xp||0}</div><div class="ps-lbl">成长值</div></div><div class="pstat"><div class="ps-val">${S.dog.tasks||0}</div><div class="ps-lbl">完成任务</div></div>`:''}
    </div>
    <div class="card" style="margin-top:12px"><div class="hd"><h2>⚙️ 学习设置</h2></div>
    <div class="setting-row"><label>孩子昵称</label><input id="pName" value="${S._setup.name||''}" placeholder="输入孩子小名"></div>
    <div class="setting-row"><label>学习阶段</label><div style="display:flex;gap:8px;margin-top:4px">${['幼升小','一年级','二年级'].map(g=>`<button class="lb ${S._setup.grade===g?'on':''}" onclick="pgSet('${g}')" style="flex:1">${g}</button>`).join('')}</div></div>
    <div class="setting-row"><label>每日任务目标</label><input type="number" id="pTasks" value="${S.dailyGoal.tasks}" min="1" max="20"><span class="setting-hint">建议3-8次</span></div>
    <div class="setting-row"><label>每日识字目标（个）</label><input type="number" id="pChars" value="${S.dailyGoal.chars}" min="1" max="20"><span class="setting-hint">建议3-10个</span></div>
    <div class="setting-row"><label>修改PIN码</label><input type="text" id="pPin" maxlength="4" placeholder="4位数字（留空不修改）"></div>
    <button class="save-btn" onclick="saveParent()">💾 保存设置</button></div>
    <button class="danger-btn" style="background:var(--acc-l);color:#E65100;border:2px solid #FFB74D" onclick="restoreDefaults()">🔄 恢复默认设置</button>
    <button class="danger-btn" style="background:#FFEBEE;color:var(--bad);border:2px solid var(--bad)" onclick="confirmClearData()">🗑️ 清除所有数据</button>
    <button class="btn" style="width:100%;background:#F5F5F5;color:var(--tx2);margin-top:8px;font-weight:600" onclick="S._parentAuth=!1;showPage('home')">🔒 退出家长模式</button></div>`;
}};
function pgSet(g){S._setup.grade=g;showPage('parent')}
function showParentLock(){
  let pinInput='';
  const renPin=()=>{
    document.getElementById('ct').innerHTML=`
    <div class="card" style="text-align:center;padding:24px">
    <div style="font-size:48px;margin-bottom:8px">👨‍👩‍👧</div>
    <div style="font-weight:700;font-size:17px;margin-bottom:12px">家长验证</div>
    <div style="display:flex;justify-content:center;gap:10px;margin:16px 0">${[0,1,2,3].map(i=>`<div class="wiz-dot ${i<pinInput.length?'filled':''}"></div>`).join('')}</div>
    <div class="wiz-nums">${[1,2,3,4,5,6,7,8,9,'',0,'←'].map(k=>k===''?`<div></div>`:`<div class="wiz-num" onclick="pinT('${k}')">${k}</div>`).join('')}</div>
    <div id="pinMsg" style="font-size:13px;color:var(--bad);margin-top:8px"></div>
    <button class="btn" style="margin-top:12px;color:var(--tx2)" onclick="showPage('home')">← 返回</button></div>`;
  };
  renPin();
  window.pinT=function(k){
    if(k==='←'){pinInput=pinInput.slice(0,-1)}else{pinInput+=k}
    renPin();
    if(pinInput.length===4){
      if(pinInput===S.parentPin){S._parentAuth=!0;document.getElementById('pinMsg').textContent='';showPage('parent')}
      else{document.getElementById('pinMsg').textContent='PIN错误，请重试';pinInput='';renPin()}
    }
  };
}
function saveParent(){
  S._setup.name=document.getElementById('pName').value.trim();
  S.dailyGoal.tasks=parseInt(document.getElementById('pTasks').value)||5;
  S.dailyGoal.chars=parseInt(document.getElementById('pChars').value)||3;
  const np=document.getElementById('pPin').value;
  if(np&&np.length===4)S.parentPin=np;
  R();toast('设置已保存！');
}
function restoreDefaults(){
  if(!confirm('确定要恢复默认设置吗？\n\n这会重置：PIN码、每日目标、孩子昵称和年级。\n\n学习数据不会被清除。'))return;
  S.parentPin='1234';S.dailyGoal={tasks:5,chars:3};S._setup={done:true,name:'',grade:'幼升小'};R();toast('已恢复默认设置');
  showPage('parent');
}
function confirmClearData(){
  if(!confirm('⚠️ 确定清除所有数据吗？\n\n这将永久删除：\n• 所有学习记录（汉字/拼音/古诗/数学）\n• 狗狗和成长数据\n• 打卡记录\n• 钻石和徽章\n\n此操作不可恢复！'))return;
  if(!confirm('再次确认：真的要清除所有数据吗？'))return;
  localStorage.removeItem('yxxj_s');localStorage.removeItem('yxxj_dog');
  S={pts:0,strk:0,dog:null,vR:{},ld:'',chars:{},pinyin:{},pinyinToday:{},pinyinDate:'',poems:{},mathC:0,mathT:0,focusM:0,badges:{},sport:{},sudoku:{},cal:{},pianoLog:{},parentPin:'1234',dailyGoal:{tasks:5,chars:3},_setup:{done:false,name:'',grade:'幼升小'}};
  R();S._parentAuth=!1;toast('所有数据已清除');
  showPage('home');
}

// ==================== INIT ====================
function init(){
  L();uS();up();
  document.addEventListener('click',function(){primeS()},{once:!0,passive:!0});
  document.addEventListener('touchstart',function(){primeS()},{once:!0,passive:!0});
  if(!S._setup.done){showWizard()}else if(!S.dog){showDogSelect()}else{showPage('home')}
}
init();
</script>
