<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A1B3A">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js" defer></script>
<title>星际宝贝学习站</title>
<style>
:root{
  --bg:#F5F0FA;--sidebar-bg:#1A1B3A;--sidebar-text:#B8B0D0;--sidebar-active:#6EC6FF;
  --primary:#9B7ED4;--primary-light:#F0EBFA;--accent:#FFD93D;--accent-light:#FFF9E6;
  --card:#FFF;--text:#333;--text-light:#888;--success:#81C784;--danger:#FF8FA3;
  --info:#6EC6FF;--border:#E8E0F0;--safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}
/* ===== LAYOUT ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:200px;background:var(--sidebar-bg);color:var(--sidebar-text);position:fixed;top:0;left:0;bottom:0;z-index:200;overflow-y:auto;padding-top:var(--safe-top);transition:transform .3s;padding-bottom:var(--safe-bottom)}
.sidebar-header{padding:16px;font-size:17px;font-weight:700;color:#FFF;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-nav{padding:8px 0}
.nav-group{margin-bottom:2px}
.nav-group-title{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:13px;font-weight:700;color:var(--sidebar-text);cursor:pointer;user-select:none}
.nav-group-title .arrow{margin-left:auto;font-size:10px;transition:transform .2s}
.nav-group.collapsed .arrow{transform:rotate(-90deg)}
.nav-sub-items{overflow:hidden;transition:max-height .3s;max-height:500px}
.nav-group.collapsed .nav-sub-items{max-height:0}
.nav-sub-item{padding:8px 16px 8px 36px;font-size:13px;color:var(--sidebar-text);opacity:.7;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s}
.nav-sub-item:hover{opacity:1}
.nav-sub-item.active{background:rgba(110,198,255,.15);color:var(--sidebar-active);opacity:1;font-weight:600}
.nav-standalone{padding:10px 16px;font-size:13px;font-weight:600;color:var(--sidebar-text);cursor:pointer;display:flex;align-items:center;gap:8px}
.nav-standalone.active{background:rgba(110,198,255,.15);color:var(--sidebar-active)}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;text-align:center}
.main{flex:1;margin-left:200px;padding:12px;max-width:820px;padding-top:calc(12px + var(--safe-top))}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:sticky;top:0;z-index:100;background:var(--bg);padding:8px 0}
.menu-toggle{display:none;font-size:22px;color:var(--primary);background:none}
.topbar-title{font-size:18px;font-weight:700;color:var(--text);flex:1}
.stat-pill{background:var(--card);padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.06);white-space:nowrap}
.content{padding-bottom:80px}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:199}
.overlay.show{display:block}
/* ===== CARDS ===== */
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(155,126,212,.06)}
.card-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-header h2{font-size:17px;font-weight:700}
.card-header .icon{font-size:22px}
.card-header small{font-size:11px;color:var(--text-light);font-weight:400;margin-left:4px}
.card p.desc{font-size:13px;color:var(--text-light);margin-bottom:10px}
/* ===== BUTTONS ===== */
.btn{padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .2s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:#FFF}
.btn-accent{background:var(--accent);color:#333}
.btn-secondary{background:#F0EBFA;color:var(--primary)}
.btn-danger{background:#FFF0F0;color:var(--danger);border:1px solid #FFD0D0}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
/* ===== PINYIN ===== */
.pinyin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.pinyin-card{background:var(--primary-light);border-radius:12px;padding:12px 4px;text-align:center;cursor:pointer;transition:all .2s;border:2px solid transparent}
.pinyin-card:active{transform:scale(.94);border-color:var(--primary)}
.py-char{font-size:24px;font-weight:700;color:var(--primary)}
.py-label{font-size:11px;color:var(--text-light);margin-top:2px}
.section-title{font-size:15px;font-weight:700;margin:16px 0 8px;color:var(--text)}
/* ===== CHARS ===== */
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px}
.char-card{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .2s}
.char-card:active{transform:scale(.95)}
.char-card.learned{border-color:var(--success);background:#F1F8F1}
.char-big{font-size:28px;font-weight:700;cursor:pointer}
.char-pinyin{font-size:12px;color:var(--primary);cursor:pointer}
.char-stroke{font-size:10px;color:var(--text-light)}
.char-btn{font-size:10px;padding:3px 8px;border-radius:8px;border:1px solid #ddd;background:#FFF;font-family:inherit;cursor:pointer;margin-top:2px}
.char-btn:active{transform:scale(.92)}
/* ===== POEMS ===== */
.poem-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.poem-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.poem-line{cursor:pointer;padding:4px 8px;border-radius:8px;transition:background .2s;line-height:1.8}
.poem-line:active{background:var(--primary-light)}
.poem-line .py{text-align:left;font-size:11px;color:var(--text-light);margin-bottom:-2px}
.poem-line .txt{font-size:16px;color:#333}
/* ===== MATH ===== */
.math-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px;margin:12px 0}
.num-dot{background:var(--info);color:#FFF;border-radius:10px;padding:12px 0;text-align:center;font-size:18px;font-weight:700;cursor:pointer;transition:all .2s}
.num-dot:active{transform:scale(.9)}
.math-question{font-size:32px;font-weight:800;text-align:center;margin:16px 0;color:var(--primary)}
.math-options{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}
.math-option{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:14px 24px;font-size:20px;font-weight:700;cursor:pointer;transition:all .2s;min-width:60px;text-align:center}
.math-option:active{transform:scale(.94)}
.math-option.correct{background:#E8F5E9;border-color:var(--success);color:var(--success)}
.math-option.wrong{background:#FFEBEE;border-color:var(--danger);color:var(--danger)}
.score-bar{display:flex;justify-content:center;gap:20px;margin:12px 0}
.score-item{text-align:center}
.si-val{font-size:24px;font-weight:800}
.si-val.good{color:var(--success)}
.si-label{font-size:12px;color:var(--text-light)}
.level-btn{padding:8px 14px;border-radius:12px;border:2px solid var(--border);background:#FFF;font-size:13px;cursor:pointer;font-weight:600}
.level-btn.active{background:var(--primary);color:#FFF;border-color:var(--primary)}
/* ===== SUDOKU ===== */
.sudoku-grid{display:grid;gap:2px;justify-content:center;margin:16px auto;max-width:280px}
.sudoku-cell{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:#FFF;border:1px solid var(--border);cursor:pointer;border-radius:6px}
.sudoku-cell.given{background:var(--primary-light);color:var(--text)}
.sudoku-cell.selected{background:var(--accent-light);border-color:var(--accent)}
.sudoku-cell.error{background:#FFEBEE;color:var(--danger)}
.sudoku-nums{display:flex;gap:8px;justify-content:center;margin:12px 0}
.sudoku-num{width:40px;height:40px;border-radius:10px;background:var(--primary);color:#FFF;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* ===== ENGLISH ===== */
.eng-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.eng-tab{flex:0 0 auto;padding:8px 14px;border-radius:16px;border:2px solid var(--border);background:#FFF;font-size:13px;white-space:nowrap;cursor:pointer}
.eng-tab.active{background:var(--info);color:#FFF;border-color:var(--info)}
.eng-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.eng-card{background:var(--card);border-radius:14px;padding:14px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.eng-card:active{transform:scale(.94)}
.eng-emoji{font-size:36px}
.eng-en{font-size:15px;font-weight:700;color:var(--info);margin-top:4px}
.eng-cn{font-size:12px;color:var(--text-light)}
/* ===== SPORT ===== */
.sport-card{background:#FFF;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.sport-emoji{font-size:36px}
.sport-info{flex:1;min-width:0}
.sport-name{font-weight:700;font-size:14px}
.sport-desc{font-size:12px;color:var(--text-light)}
.sport-btn{flex-shrink:0;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;border:none;cursor:pointer;color:#FFF}
/* ===== FOCUS ===== */
.schulte-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:300px;margin:0 auto}
.schulte-cell{aspect-ratio:1;background:#FFF;border:2px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;cursor:pointer;transition:all .15s}
.schulte-cell.done{background:var(--success);color:#FFF}
.schulte-cell.wrong{background:var(--danger);color:#FFF}
.timer-display{font-size:48px;font-weight:800;text-align:center;color:var(--primary);font-variant-numeric:tabular-nums}
/* ===== CALENDAR ===== */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer}
.cal-cell.empty{background:transparent}
.cal-cell.day{background:#FFF;border:1px solid var(--border)}
.cal-cell.full{background:var(--success);color:#FFF}
.cal-cell.partial{background:var(--accent);color:#333}
.cal-cell.missed{background:#F5F5F5;color:#CCC}
.cal-cell.today{border:2px solid var(--primary)}
.cal-header{text-align:center;font-weight:700;font-size:16px;margin-bottom:12px}
.cal-legend{display:flex;gap:12px;justify-content:center;margin-top:8px;font-size:12px}
/* ===== EXPERIMENT (PET) ===== */
.exp-card{background:var(--card);border-radius:16px;padding:16px;text-align:center;box-shadow:0 2px 12px rgba(155,126,212,.08)}
.exp-avatar{font-size:72px;margin-bottom:8px;display:inline-block}
.exp-avatar.bounce{animation:bounce .8s ease}
.exp-avatar.shake{animation:shake .6s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-20px)}50%{transform:translateY(0)}70%{transform:translateY(-10px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-5deg)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}
.exp-stage{font-size:13px;color:var(--text-light)}
.exp-meter{width:100%;height:8px;background:#F0EBFA;border-radius:4px;margin:8px 0;overflow:hidden}
.exp-meter span{display:block;height:100%;background:var(--primary);border-radius:4px;transition:width .3s}
.exp-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.heart-float{position:absolute;font-size:32px;animation:floatUp 1.5s ease-out forwards;pointer-events:none}
/* ===== MODALS ===== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center}
.modal{background:#FFF;border-radius:20px;padding:20px;max-width:340px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.modal-header span{font-weight:700;font-size:17px}
.modal-header button{font-size:22px;color:var(--text-light)}
.modal-actions{display:flex;gap:8px;justify-content:center;margin-top:12px}
#hanziWriterTarget{width:200px;height:200px;margin:16px auto;background:#FFFDF5;border:2px dashed var(--border);border-radius:16px;overflow:hidden}
.reward-modal{text-align:center;padding:32px 20px}
.reward-icon{font-size:64px;margin-bottom:8px}
/* ===== TOAST ===== */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#FFF;padding:10px 20px;border-radius:24px;font-size:14px;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
/* ===== MISC ===== */
.speaking-indicator{display:inline-block;width:16px;height:16px;background:var(--info);border-radius:50%;animation:pulse 1s infinite;margin-left:4px;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.reading-text{font-size:16px;line-height:2;color:#333;padding:12px;background:var(--accent-light);border-radius:12px;margin:8px 0}
.emotion-btn{font-size:48px;padding:16px;border-radius:16px;background:var(--card);border:2px solid var(--border);cursor:pointer;transition:all .2s}
.emotion-btn:active,.emotion-btn.selected{transform:scale(1.1);border-color:var(--primary);background:var(--primary-light)}
.daily-fact{background:var(--accent-light);border-radius:12px;padding:14px;font-size:14px;line-height:1.6;margin:8px 0}
.daily-fact .fact-title{font-weight:700;color:var(--primary);margin-bottom:4px}
/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .menu-toggle{display:block}
  .overlay.show{display:block}
  .pinyin-grid{grid-template-columns:repeat(auto-fill,minmax(56px,1fr))}
  .char-grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
}
@media(max-width:380px){
  .pinyin-grid{grid-template-columns:repeat(4,1fr)}
  .char-grid{grid-template-columns:repeat(3,1fr)}
  .eng-grid{grid-template-columns:repeat(2,1fr)}
  .math-question{font-size:26px}
  .sudoku-cell{width:48px;height:48px;font-size:18px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">🚀 星际学习站</div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer" id="sidebarFooter">💎 0 · 🔥 0天</div>
  </aside>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <main class="main">
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div class="topbar-title" id="topbarTitle">首页</div>
      <span class="stat-pill">💎 <span id="pointsDisplay">0</span></span>
      <span class="stat-pill">🔥 <span id="streakDisplay">0</span></span>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="modal-overlay" id="hanziOverlay" style="display:none" onclick="closeHanziWriter()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header"><span id="hanziTitle">描红练习</span><button onclick="closeHanziWriter()">✕</button></div>
    <div id="hanziWriterTarget"></div>
    <p id="hanziFeedback" style="font-size:13px;color:var(--text-light);text-align:center;margin:8px 0"></p>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="startHanziQuiz()">🎯 开始描红</button>
      <button class="btn btn-secondary" onclick="resetHanziWriter()">🔄 重播</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="rewardOverlay" style="display:none" onclick="hideReward()">
  <div class="modal reward-modal" onclick="event.stopPropagation()">
    <div class="reward-icon">💎</div><div id="rewardMsg" style="font-size:18px;font-weight:700"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
// ==================== STATE ====================
let state={stars:0,points:0,pet:null,verifiedRewards:{},streak:0,lastActiveDate:'',tasksDone:{},charsLearned:{},mathCorrect:0,mathTotal:0,habitStars:{},weekHistory:{},pinyinToday:{},pinyinDate:'',pinyinLearned:{},poemsRead:{},flashcardReview:{},habitDays:{},levelProgress:{},badges:{},dailyGoal:{tasks:3,chars:5},hanziWriterDone:{},sportDone:{},screenUsage:{date:'',seconds:0},screenLimitMinutes:30,calendarLog:{},emotionLog:{},readingLog:{},sudokuDone:{},swimLog:{},drumLog:{}};
function loadState(){try{const s=localStorage.getItem('yxxj_state');if(s){const p=JSON.parse(s);state={...state,...p};if(!state.screenUsage||typeof state.screenUsage!=='object')state.screenUsage={date:'',seconds:0};}}catch(e){}}
function saveState(){try{localStorage.setItem('yxxj_state',JSON.stringify(state))}catch(e){}}
function getToday(){return new Date().toISOString().split('T')[0]}
function getYesterday(){return new Date(Date.now()-864e5).toISOString().split('T')[0]}
function localDateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

// ==================== UTILS ====================
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function updateStreak(){const t=getToday();if(state.lastActiveDate===t)return;if(state.lastActiveDate===getYesterday())state.streak++;else if(state.lastActiveDate&&state.lastActiveDate!==t)state.streak=0;if(!state.lastActiveDate)state.streak=1;state.lastActiveDate=t;saveState()}
function updateDisplay(){document.getElementById('pointsDisplay').textContent=state.points||0;document.getElementById('streakDisplay').textContent=state.streak||0;document.getElementById('sidebarFooter').innerHTML=`💎 ${state.points||0} · 🔥 ${state.streak||0}天`}
function awardVerifiedPoints(key,n,msg,big){if(state.verifiedRewards[key])return false;state.verifiedRewards[key]=true;state.points=(state.points||0)+n;state.stars=state.points;const today=getToday();const dk=Object.keys(state.verifiedRewards).filter(k=>k.endsWith(today));if(dk.length>12){state.verifiedRewards[key]=false;state.points-=n;state.stars=state.points;saveState();showToast('今日奖励已达上限（12次），明天继续加油！');return false}saveState();updateDisplay();showReward(msg);advanceExperiment(n);checkBadges();return true}
function showReward(msg){document.getElementById('rewardMsg').textContent=msg;document.getElementById('rewardOverlay').style.display='flex';try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(523,ctx.currentTime);o.frequency.setValueAtTime(659,ctx.currentTime+.1);o.frequency.setValueAtTime(784,ctx.currentTime+.2);g.gain.setValueAtTime(.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+.5);o.start(ctx.currentTime);o.stop(ctx.currentTime+.5)}catch(e){}}
function hideReward(){document.getElementById('rewardOverlay').style.display='none'}
function numberToChinese(n){if(n<0)return'负'+numberToChinese(-n);if(n===0)return'零';if(n>=100)return n===100?'一百':(n<200?'一百零'+numberToChinese(n-100):'');const units=['','十','百'];const digits=['零','一','二','三','四','五','六','七','八','九'];if(n<10)return digits[n];if(n<20)return n===10?'十':'十'+digits[n-10];if(n<100){const t=Math.floor(n/10),o=n%10;return digits[t]+'十'+(o?digits[o]:'')}return String(n)}

// ==================== VOICE SYSTEM (FIXED) ====================
let _voices=[],_voiceReady=false;
function initVoices(){
  if(!('speechSynthesis'in window))return;
  _voices=speechSynthesis.getVoices();
  if(_voices.length>0){_voiceReady=true;return}
  // Retry polling for Android
  let tries=0;
  const poll=setInterval(()=>{ _voices=speechSynthesis.getVoices(); if(_voices.length>0||tries++>10){clearInterval(poll);_voiceReady=true} },200);
  speechSynthesis.onvoiceschanged=()=>{_voices=speechSynthesis.getVoices();_voiceReady=true};
  // iOS: prime with dummy
  try{const d=new SpeechSynthesisUtterance('');d.volume=0;d.rate=1;speechSynthesis.speak(d)}catch(e){}
}
function getZhVoice(){
  if(_voices.length===0)_voices=speechSynthesis.getVoices();
  return _voices.find(v=>/zh-cn/i.test(v.lang))||_voices.find(v=>/^zh/i.test(v.lang)&&!/yue|hk|tw|hant/i.test(v.lang))||_voices.find(v=>/^zh/i.test(v.lang))||_voices.find(v=>/cmn/i.test(v.lang));
}
// KEY FIX: do NOT call cancel() inside speakText — it breaks speakLines chain
function speakText(text,lang,rate,onEnd){
  if(!('speechSynthesis'in window)){if(onEnd)onEnd();return false}
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang||'zh-CN';u.rate=rate||.65;u.volume=1;u.pitch=1;
    const v=getZhVoice();if(v)u.voice=v;
    let ended=false;const done=function(){if(!ended){ended=true;if(onEnd)onEnd()}};
    u.onend=done;u.onerror=done;
    setTimeout(done,Math.max(2000,Math.round(text.length*400/(rate||.65))));
    speechSynthesis.speak(u);
    return true;
  }catch(e){if(onEnd)onEnd();return false}
}
function stopSpeaking(){if('speechSynthesis'in window)try{speechSynthesis.cancel()}catch(e){}}
function speakLines(lines,rate,onEnd){
  if(!lines||!lines.length){if(onEnd)onEnd();return}
  let i=0;
  const next=function(){if(i>=lines.length){if(onEnd)onEnd();return}const line=String(lines[i++]).trim();if(!line)return next();speakText(line,'zh-CN',rate||.65,next)};
  next();
}
// Pinyin audio (local files + external fallback for initials)
let _pinyinCache=new Map(),_activeAudio=null;
function playPinyinAudio(audioId,source,onEnd){
  let fin=false;const done=function(s){if(!fin){fin=true;if(onEnd)onEnd(s)}};
  try{
    if(_activeAudio){_activeAudio.pause();_activeAudio.currentTime=0}
    const key=source+':'+audioId;let a=_pinyinCache.get(key);
    if(!a){const url=source==='initial'?`https://www.qqxiuzi.cn/audio/pinyin/${audioId}.mp3`:`assets/pinyin/${audioId}.mp3`;a=new Audio(url);a.preload='auto';_pinyinCache.set(key,a)}
    _activeAudio=a;a.currentTime=0;a.onended=()=>done(true);a.onerror=()=>done(false);
    const p=a.play();if(p&&p.catch)p.catch(()=>done(false));
  }catch(e){done(false)}
}
function speakPinyin(py,audioId,source){
  source=source||'syllable';
  playPinyinAudio(audioId,source,function(ok){
    if(!ok){showToast('音频暂时不可用。');return}
    const t=getToday();
    if(state.pinyinDate!==t){state.pinyinToday={};state.pinyinDate=t}
    if(!state.pinyinToday[py]){state.pinyinToday[py]=true;state.pinyinLearned[py]=true;saveState();updateDisplay()}
  });
}

let currentSection='home';
function renderSidebar(){
  const el=document.getElementById('sidebarNav');
  el.innerHTML=navStructure.map(item=>{
    if(item.children){
      const isCollapsed=item.id!==currentSection.split('-')[0]&&item.id!==currentSection;
      return `<div class="nav-group${isCollapsed?' collapsed':''}" id="grp-${item.id}">
        <div class="nav-group-title" onclick="toggleNavGroup('${item.id}')">${item.icon} ${item.label}<span class="arrow">▼</span></div>
        <div class="nav-sub-items">${item.children.map(c=>`<div class="nav-sub-item${currentSection===c.id?' active':''}" onclick="switchSection('${c.id}')">${c.icon} ${c.label}</div>`).join('')}</div>
      </div>`;
    }
    return `<div class="nav-standalone${currentSection===item.id?' active':''}" onclick="switchSection('${item.id}')">${item.icon} ${item.label}</div>`;
  }).join('');
}
function toggleNavGroup(id){

function switchSection(id){
  stopSpeaking();
  currentSection=id;
  const item=findNavItem(id);

  renderSidebar();
  if(window.innerWidth<=768){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}

  document.getElementById('content').innerHTML='';
  r();
  window.scrollTo(0,0);
}
function findNavItem(id){
  for(const item of navStructure){
    if(item.id===id)return item;

  }
  return null;
}

function textToPinyinLines(lines){return lines.map(line=>{let p='';for(const ch of line){const py=charToPinyin(ch);p+=py?py+' ':ch+' '}return p.trim()})}

// ==================== EXPERIMENT (PET) SYSTEM ====================
const experiments={626:{name:'史迪奇',emoji:'👽',trait:'温暖陪伴',stages:['幼体','成长体','完全体','超能力体']},625:{name:'鲁本',emoji:'🥪',trait:'活泼探索',stages:['幼体','成长体','完全体','超能力体']},221:{name:'斯帕奇',emoji:'⚡',trait:'勇敢挑战',stages:['幼体','成长体','完全体','超能力体']}};
const expStages=[{xp:0,name:'幼体'},{xp:80,name:'成长体'},{xp:220,name:'完全体'},{xp:450,name:'超能力体'}];
function migratePetState(){if(!state.pet)return;if(state.pet.type&&!experiments[state.pet.type]){if(state.pet.type==='labrador')state.pet.type='626';else if(state.pet.type==='husky')state.pet.type='625';else if(state.pet.type==='malinois')state.pet.type='221';else state.pet.type='626'}if(typeof state.pet.xp==='undefined')state.pet.xp=0;if(typeof state.pet.hunger==='undefined')state.pet.hunger=60;if(typeof state.pet.hygiene==='undefined')state.pet.hygiene=60;if(typeof state.pet.energy==='undefined')state.pet.energy=60;if(typeof state.pet.completedTasks==='undefined')state.pet.completedTasks=0}
function expLevel(){const xp=Number(state.pet&&state.pet.xp)||0;for(let i=expStages.length-1;i>=0;i--)if(xp>=expStages[i].xp)return i;return 0}
function expNextProgress(){const lv=expLevel();const xp=Number(state.pet&&state.pet.xp)||0;if(lv>=expStages.length-1)return 100;const cur=expStages[lv].xp,nxt=expStages[lv+1].xp;return Math.round((xp-cur)/(nxt-cur)*100)}
function advanceExperiment(n){if(!state.pet)return;migratePetState();state.pet.xp=(state.pet.xp||0)+Math.max(2,n*2);state.pet.completedTasks=(state.pet.completedTasks||0)+1;saveState()}
function adoptExperiment(type){state.pet={type,xp:0,hunger:60,hygiene:60,energy:60,completedTasks:0,adoptedAt:getToday()};saveState();updateDisplay();switchSection('experiment');speakText('你好，我是你的星际试验品伙伴。完成学习挑战，我们一起成长！','zh-CN',.8)}
function renderExperiment(){
  const c=document.getElementById('content');
  if(!state.pet||!experiments[state.pet.type]){
    c.innerHTML=`<div class="card"><div class="card-header"><span class="icon">👽</span><h2>试验品领养中心</h2></div><p class="desc">领养一只星际试验品，完成学习挑战帮它成长！</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${Object.entries(experiments).map(([id,exp])=>`<div class="exp-card" onclick="adoptExperiment('${id}')" style="cursor:pointer"><div style="font-size:56px">${exp.emoji}</div><div style="font-weight:700;font-size:15px">${exp.name}</div><div style="font-size:12px;color:var(--text-light)">${exp.trait}</div><div style="font-size:11px;color:var(--primary);margin-top:4px">编号 ${id}</div></div>`).join('')}</div></div>`;
    return;
  }
  migratePetState();
  const exp=experiments[state.pet.type],lv=expLevel(),stage=expStages[lv],progress=expNextProgress();
  c.innerHTML=`<div class="card"><div class="card-header"><span class="icon">👽</span><h2>试验品中心</h2></div>
    <div class="exp-card"><div class="exp-avatar" id="expAvatar" onclick="expAnimate('bounce')">${exp.emoji}</div><div id="expHearts" style="position:relative;height:0"></div>
    <div style="font-weight:700;font-size:20px">${exp.name}</div><div class="exp-stage">${stage.name} · ${exp.trait}</div>
    <div style="font-size:12px;color:var(--text-light);margin-top:4px">编号 ${state.pet.type} · 成长值 ${state.pet.xp} · 完成任务 ${state.pet.completedTasks}次</div>
    <div class="exp-meter"><span style="width:${progress}%"></span></div>
    <div style="font-size:12px;color:var(--text-light);margin-bottom:8px">🍖饱腹 ${state.pet.hunger} · 🛁清洁 ${state.pet.hygiene} · ⚡活力 ${state.pet.energy}</div>
    <div class="exp-actions">
      <button class="btn btn-primary" onclick="feedExp()">🍖 喂食(20💎)</button>
      <button class="btn btn-secondary" onclick="batheExp()">🛁 洗澡(10💎)</button>
      <button class="btn btn-accent" onclick="playExp()">🏃 玩耍</button>
      <button class="btn btn-secondary" onclick="expSpeak()">🔊 听它说</button>
    </div></div></div>`;
}
function feedExp(){if(!state.pet)return;if((state.points||0)<20)return showToast('钻石不够！');state.points-=20;state.pet.hunger=Math.min(100,state.pet.hunger+35);state.pet.xp+=4;saveState();updateDisplay();renderExperiment();speakText('谢谢小主人！我吃饱啦！','zh-CN',.85);expAnimate('bounce')}
function batheExp(){if(!state.pet)return;if((state.points||0)<10)return showToast('钻石不够！');state.points-=10;state.pet.hygiene=Math.min(100,state.pet.hygiene+45);state.pet.xp+=3;saveState();updateDisplay();renderExperiment();speakText('身上香香的啦！','zh-CN',.85);expAnimate('shake')}
function playExp(){if(!state.pet)return;if((state.pet.completedTasks||0)<1)return speakText('先完成一项学习任务，我们再一起玩！','zh-CN',.85);state.pet.energy=Math.min(100,state.pet.energy+25);state.pet.hunger=Math.max(10,state.pet.hunger-5);state.pet.xp+=2;saveState();renderExperiment();speakText('今天真开心！','zh-CN',.85);expAnimate('bounce')}
function expSpeak(){if(!state.pet)return;migratePetState();const p=state.pet;let msg='我想听你认真学习。完成一项任务，我们就能一起长大！';if(p.hunger<45)msg='我饿了，小主人。完成学习挑战后，用钻石给我准备三明治吧！';else if(p.hygiene<45)msg='身上脏了，快帮我洗洗吧！';else if(p.energy<45)msg='我要出去和你玩～先完成今天的一项学习任务，我们一起出发！';speakText(msg,'zh-CN',.88)}
function expAnimate(type){const el=document.getElementById('expAvatar');if(!el)return;el.classList.remove('bounce','shake');void el.offsetWidth;el.classList.add(type);if(type==='bounce'){const h=document.getElementById('expHearts');if(h){h.innerHTML='<span class="heart-float">❤️</span>';setTimeout(()=>h.innerHTML='',1600)}}setTimeout(()=>el.classList.remove('bounce','shake'),1000)}

let _hwInstance=null,_hwChar='';
function openHanziWriter(ch,py){
  _hwChar=ch;
  document.getElementById('hanziTitle').textContent='描红：'+ch+' ('+py+')';
  document.getElementById('hanziWriterTarget').innerHTML='';
  document.getElementById('hanziFeedback').innerHTML='🔊 正在播放读音…';
  document.getElementById('hanziOverlay').style.display='flex';
  // AUTO-PLAY sound first
  speakText(ch+'，'+py,'zh-CN',.6,function(){
    document.getElementById('hanziFeedback').innerHTML='👋 请用手指沿着蓝色轮廓描红每一笔！';
  });
  if(typeof HanziWriter==='undefined'){document.getElementById('hanziFeedback').innerHTML='⚠️ 笔顺动画需联网加载。口诀：先上后下，先左后右，先横后竖，先撇后捺。';return}
  try{
    _hwInstance=HanziWriter.create('hanziWriterTarget',ch,{width:200,height:200,padding:5,strokeAnimationSpeed:1,delayBetweenStrokes:300,radicalColor:'#9B7ED4',showCharacter:false,showOutline:true,outlineColor:'#E8E0F0'});
    _hwInstance.loopCharacterAnimation();
  }catch(e){document.getElementById('hanziFeedback').innerHTML='⚠️ 该字暂不支持笔顺动画。'}
}
function startHanziQuiz(){
  if(!_hwInstance)return;
  document.getElementById('hanziFeedback').innerHTML='👋 用手指沿着轮廓描红，写完每一笔松手';
  _hwInstance.quiz({
    onMistake:function(){document.getElementById('hanziFeedback').innerHTML='💡 这笔方向不对，再试一次！'},
    onCorrectStroke:function(){document.getElementById('hanziFeedback').innerHTML='✅ 这一笔写得好！'},
    onComplete:function(s){
      const mistakes=s.totalMistakes;
      let stars,score,msg;
      if(mistakes===0){stars='⭐⭐⭐';score=15;msg='太棒了！满分！'}
      else if(mistakes<=2){stars='⭐⭐';score=10;msg='写得不错！'}
      else{stars='⭐';score=5;msg='继续加油，越写越好！'}
      const key='hanzi_'+_hwChar+'_'+getToday();
      awardVerifiedPoints(key,score,`${stars} ${msg} +${score}💎`);
      speakText(msg,'zh-CN',.75);
      document.getElementById('hanziFeedback').innerHTML=`${stars} ${msg}<br>共${s.strokes}笔，错误${mistakes}次，+${score}💎`;
      if(!state.charsLearned[_hwChar]){state.charsLearned[_hwChar]=true;saveState()}
    }
  });
}
function resetHanziWriter(){if(_hwInstance){_hwInstance.loopCharacterAnimation();document.getElementById('hanziFeedback').innerHTML='笔顺重播中…'}}

let _sudokuSize=4,_sudokuGrid=[],_sudokuSolution=[],_sudokuSelected=null;
sections.sudoku=function(){
  const c=document.getElementById('content');
  c.innerHTML=`<div class="card"><div class="card-header"><span class="icon">🔢</span><h2>数独<small>儿童版</small></h2></div>
    <div class="btn-row" style="justify-content:center">
      <button class="level-btn ${_sudokuSize===4?'active':''}" onclick="setSudokuSize(4)">4×4 入门</button>
      <button class="level-btn ${_sudokuSize===6?'active':''}" onclick="setSudokuSize(6)">6×6 进阶</button>
    </div>
    <div class="sudoku-grid" id="sudokuGrid" style="grid-template-columns:repeat(${_sudokuSize},1fr)"></div>
    <div class="sudoku-nums" id="sudokuNums"></div>
    <div class="btn-row" style="justify-content:center"><button class="btn btn-secondary btn-sm" onclick="checkSudoku()">✅ 检查</button><button class="btn btn-secondary btn-sm" onclick="newSudoku()">🔄 新题</button></div>
  </div>`;
  newSudoku();
};
function setSudokuSize(n){_sudokuSize=n;sections.sudoku()}
function newSudoku(){
  // Simple sudoku generator for 4x4 and 6x6
  const n=_sudokuSize;
  _sudokuSolution=generateSudokuSolution(n);
  _sudokuGrid=_sudokuSolution.map(row=>row.map(v=>Math.random()<.4?v:0));
  _sudokuSelected=null;
  renderSudoku();
}
function generateSudokuSolution(n){
  const grid=[];
  const sq=Math.sqrt(n);
  for(let r=0;r<n;r++){grid.push([]);for(let c=0;c<n;c++){let val=((r*sq+Math.floor(r/sq)+c)%n)+1;grid[r].push(val)}}
  return grid;
}
function renderSudoku(){
  const n=_sudokuSize;
  document.getElementById('sudokuGrid').innerHTML=_sudokuGrid.map((row,r)=>row.map((v,c)=>`<div class="sudoku-cell ${v!==0?'given':''} ${_sudokuSelected&&_sudokuSelected.r===r&&_sudokuSelected.c===c?'selected':''}" onclick="selectSudoku(${r},${c})">${v||''}</div>`).join('')).join('');
  document.getElementById('sudokuNums').innerHTML=Array.from({length:n},(_,i)=>`<div class="sudoku-num" onclick="fillSudoku(${i+1})">${i+1}</div>`).join('');
}
function selectSudoku(r,c){if(_sudokuGrid[r][c]!==0)return;_sudokuSelected={r,c};renderSudoku()}
function fillSudoku(v){if(!_sudokuSelected)return;_sudokuGrid[_sudokuSelected.r][_sudokuSelected.c]=v;_sudokuSelected=null;renderSudoku()}
function checkSudoku(){
  let correct=true;
  for(let r=0;r<_sudokuSize;r++)for(let c=0;c<_sudokuSize;c++){if(_sudokuGrid[r][c]!==_sudokuSolution[r][c]){correct=false;document.querySelectorAll('.sudoku-cell')[r*_sudokuSize+c].classList.add('error')}}
  if(correct){const key='sudoku_'+getToday()+'_'+Object.keys(state.sudokuDone||{}).length;state.sudokuDone[key]=true;saveState();awardVerifiedPoints(key,10,'数独完成！+10💎');speakText('太棒了，数独全对了！','zh-CN',.75)}else{showToast('有错误，红色标记处需要修改')}
}

// CALENDAR
sections.calendar=function(){
  const now=new Date();const y=now.getFullYear(),m=now.getMonth();
  const firstDay=new Date(y,m,1).getDay()===0?7:new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=now.getDate();
  let html='<div class="cal-header">'+y+'年'+(m+1)+'月</div><div class="cal-grid">';
  ['一','二','三','四','五','六','日'].forEach(d=>html+=`<div style="text-align:center;font-size:12px;color:var(--text-light);padding:4px">${d}</div>`);
  for(let i=1;i<firstDay;i++)html+='<div class="cal-cell empty"></div>';
  let fullCount=0,partialCount=0;
  for(let d=1;d<=daysInMonth;d++){
    const dateKey=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const status=state.calendarLog&&state.calendarLog[dateKey];
    let cls='day';if(d===today)cls+=' today';
    if(status==='full'){cls+=' full';fullCount++}else if(status==='partial'){cls+=' partial';partialCount++}else if(d<today){cls+=' missed'}
    html+=`<div class="cal-cell ${cls}">${d}</div>`;
  }
  html+='</div><div class="cal-legend"><span>🟢完整</span><span>🟡部分</span><span>⬜未完成</span></div>';
  html+=`<div class="card" style="margin-top:12px;text-align:center"><div style="font-size:28px;font-weight:800;color:var(--primary)">${fullCount+partialCount}</div><div style="font-size:13px;color:var(--text-light)">本月打卡天数</div><div style="font-size:20px;font-weight:700;color:var(--success);margin-top:8px">${fullCount}</div><div style="font-size:13px;color:var(--text-light)">全勤天数</div></div>`;
  document.getElementById('content').innerHTML=`<div class="card"><div class="card-header"><span class="icon">📅</span><h2>学习日历</h2></div>${html}</div>`;
};

  renderSidebar();

}
