<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A1B3A">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js" defer></script>
<title>星际学习站</title>
<style>
:root{
  --bg:#F5F0FA;--side:#1A1B3A;--side-text:#B8B0D0;--side-active:#6EC6FF;
  --pri:#9B7ED4;--pri-light:#F0EBFA;--acc:#FFD93D;--acc-light:#FFF9E6;
  --card:#FFF;--txt:#333;--tx2:#888;--ok:#81C784;--bad:#FF8FA3;
  --info:#6EC6FF;--bd:#E8E0F0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}

/* LAYOUT */
.app{display:flex;min-height:100vh}
.sidebar{width:200px;background:var(--side);color:var(--side-text);position:fixed;top:0;left:0;bottom:0;z-index:200;overflow-y:auto;transition:transform .3s}
.side-hd{padding:16px;font-size:17px;font-weight:700;color:#FFF;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
.side-nav{padding:6px 0}
.side-item{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:13px;font-weight:600;color:var(--side-text);cursor:pointer;transition:all .15s}
.side-item:active{background:rgba(255,255,255,.08)}
.side-item.active{background:rgba(110,198,255,.15);color:var(--side-active)}

.main{flex:1;margin-left:200px;padding:10px;max-width:700px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:sticky;top:0;z-index:100;background:var(--bg);padding:6px 0}
.ham{display:none;font-size:22px;color:var(--pri)}
.cur{font-size:17px;font-weight:700;flex:1}
.pill{background:var(--card);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.05);white-space:nowrap}
.content{padding-bottom:60px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199}
.overlay.show{display:block}

/* CARDS */
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(155,126,212,.05)}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hd h2{font-size:16px;font-weight:700}
.hd .ico{font-size:22px}
.hd small{font-size:11px;color:var(--tx2);font-weight:400;margin-left:4px}
.desc{font-size:13px;color:var(--tx2);margin-bottom:8px}

/* BUTTONS */
.btn{padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:all .2s}
.btn:active{transform:scale(.95)}
.b1{background:var(--pri);color:#FFF}
.b2{background:var(--acc);color:#333}
.b3{background:#F0EBFA;color:var(--pri)}
.bs{padding:6px 12px;font-size:12px;border-radius:10px}
.br{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}

/* GRIDS */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px}
.pc{background:var(--pri-light);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;transition:all .2s;border:2px solid transparent}
.pc:active{transform:scale(.93);border-color:var(--pri)}
.py-big{font-size:22px;font-weight:700;color:var(--pri)}
.py-sm{font-size:10px;color:var(--tx2);margin-top:2px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:8px}
.cc{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:all .2s}
.cc:active{transform:scale(.95)}
.cc.ok{border-color:var(--ok);background:#F1F8F1}
.ch-big{font-size:26px;font-weight:700}
.ch-py{font-size:11px;color:var(--pri)}
.ch-st{font-size:10px;color:var(--tx2)}
.ch-btn{font-size:10px;padding:3px 8px;border-radius:8px;border:1px solid #ddd;background:#FFF;cursor:pointer;margin:3px 2px 0}
.sect{font-size:14px;font-weight:700;margin:14px 0 6px;color:var(--txt)}

/* POEMS */
.pom{background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.pom-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pl{cursor:pointer;padding:3px 8px;border-radius:8px;line-height:1.8;transition:background .2s}
.pl:active{background:var(--pri-light)}
.pl .py{font-size:10px;color:var(--tx2);display:block}
.pl .tx{font-size:15px}

/* MATH */
.mq{font-size:30px;font-weight:800;text-align:center;margin:14px 0;color:var(--pri)}
.mo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.moi{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px 22px;font-size:20px;font-weight:700;cursor:pointer;transition:all .2s;min-width:56px;text-align:center}
.moi:active{transform:scale(.93)}
.moi.good{background:#E8F5E9;border-color:var(--ok);color:var(--ok)}
.moi.bad{background:#FFEBEE;border-color:var(--bad);color:var(--bad)}
.sb{display:flex;justify-content:center;gap:16px;margin:10px 0}
.si{text-align:center}.si-v{font-size:22px;font-weight:800}.si-v.g{color:var(--ok)}.si-l{font-size:11px;color:var(--tx2)}
.lb{padding:8px 14px;border-radius:12px;border:2px solid var(--bd);background:#FFF;font-size:13px;cursor:pointer;font-weight:600}
.lb.on{background:var(--pri);color:#FFF;border-color:var(--pri)}

/* SUDOKU */
.sg{display:grid;gap:2px;justify-content:center;margin:14px auto;max-width:260px}
.sc{width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:#FFF;border:1px solid var(--bd);cursor:pointer;border-radius:6px}
.sc.given{background:var(--pri-light)}
.sc.sel{background:var(--acc-light);border-color:var(--acc)}
.sc.err{background:#FFEBEE;color:var(--bad)}
.sn{display:flex;gap:6px;justify-content:center;margin:10px 0}
.sni{width:38px;height:38px;border-radius:10px;background:var(--pri);color:#FFF;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ENGLISH */
.et{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.etb{flex:0 0 auto;padding:7px 12px;border-radius:14px;border:2px solid var(--bd);background:#FFF;font-size:12px;white-space:nowrap;cursor:pointer}
.etb.on{background:var(--info);color:#FFF;border-color:var(--info)}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.ec{background:var(--card);border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.ec:active{transform:scale(.93)}
.em{font-size:32px}.en{font-size:14px;font-weight:700;color:var(--info);margin-top:3px}.ecn{font-size:11px;color:var(--tx2)}
.ra-card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,.03)}

/* SPORT */
.sp{background:#FFF;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,.02)}
.sp-em{font-size:34px}.sp-nm{font-weight:700;font-size:14px}.sp-ds{font-size:11px;color:var(--tx2)}.sp-inf{flex:1;min-width:0}

/* SCHULTE */
.sch{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:280px;margin:0 auto}
.schl{aspect-ratio:1;background:#FFF;border:2px solid var(--bd);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;cursor:pointer;transition:all .12s}
.schl.d{background:var(--ok);color:#FFF}
.schl.w{background:var(--bad);color:#FFF}
.tmr{font-size:44px;font-weight:800;text-align:center;color:var(--pri)}

/* PET */
.exp-card{background:var(--card);border-radius:16px;padding:16px;text-align:center;box-shadow:0 2px 12px rgba(155,126,212,.06)}
.exp-av{font-size:72px;margin-bottom:6px;display:inline-block}
.exp-av.bounce{animation:bounce .8s ease}.exp-av.shake{animation:shake .6s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-20px)}50%{transform:translateY(0)}70%{transform:translateY(-10px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-5deg)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}
.exp-st{font-size:12px;color:var(--tx2)}
.exp-bar{width:100%;height:8px;background:#F0EBFA;border-radius:4px;margin:6px 0;overflow:hidden}
.exp-bar span{display:block;height:100%;background:var(--pri);border-radius:4px;transition:width .3s}
.exp-acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.hf{position:absolute;font-size:28px;animation:floatUp 1.5s ease-out forwards;pointer-events:none}

/* MODALS */
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center}
.md{background:#FFF;border-radius:18px;padding:18px;max-width:320px;width:90%}
.md-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.md-hd span{font-weight:700;font-size:16px}.md-hd button{font-size:22px;color:var(--tx2)}
.md-acts{display:flex;gap:8px;justify-content:center;margin-top:10px}
#hwTarget{width:200px;height:200px;margin:14px auto;background:#FFFDF5;border:2px dashed var(--bd);border-radius:14px;overflow:hidden}
.rw{text-align:center;padding:28px 16px}
.rw-ico{font-size:56px;margin-bottom:6px}

/* TOAST */
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#FFF;padding:8px 18px;border-radius:20px;font-size:13px;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}

/* MISC */
.speak-dot{display:inline-block;width:14px;height:14px;background:var(--info);border-radius:50%;animation:pulse 1s infinite;margin-left:4px;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.rtxt{font-size:15px;line-height:2;color:#333;padding:10px;background:var(--acc-light);border-radius:10px;margin:6px 0}
.emobtn{font-size:44px;padding:14px;border-radius:14px;background:var(--card);border:2px solid var(--bd);cursor:pointer;transition:all .2s}
.emobtn:active,.emobtn.sel{transform:scale(1.1);border-color:var(--pri);background:var(--pri-light)}
.fact{background:var(--acc-light);border-radius:10px;padding:12px;font-size:13px;line-height:1.6;margin:6px 0}
.fact .ft{font-weight:700;color:var(--pri);margin-bottom:3px}

/* CAL */
.clg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cll{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:default}
.cll.e{background:transparent}
.cll.d{background:#FFF;border:1px solid var(--bd)}
.cll.f{background:var(--ok);color:#FFF}
.cll.p{background:var(--acc);color:#333}
.cll.m{background:#F5F5F5;color:#CCC}
.cll.t{border:2px solid var(--pri)}
.cl-hd{text-align:center;font-weight:700;font-size:15px;margin-bottom:10px}
.cl-leg{display:flex;gap:10px;justify-content:center;margin-top:6px;font-size:11px}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
  .main{margin-left:0}.ham{display:block}
  .pg{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
  .cg{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
}
@media(max-width:380px){
  .pg{grid-template-columns:repeat(4,1fr)}.cg{grid-template-columns:repeat(3,1fr)}
  .eg{grid-template-columns:repeat(2,1fr)}.mq{font-size:24px}
  .sc{width:44px;height:44px;font-size:18px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sb">
    <div class="side-hd">🚀 星际学习站</div>
    <nav class="side-nav" id="sideNav"></nav>
  </aside>
  <div class="overlay" id="ov" onclick="toggleSide()"></div>
  <main class="main">
    <header class="top">
      <button class="ham" onclick="toggleSide()">☰</button>
      <div class="cur" id="ttl">首页</div>
      <span class="pill">💎 <span id="pts">0</span></span>
      <span class="pill">🔥 <span id="strk">0</span></span>
    </header>
    <div class="content" id="ct"></div>
  </main>
</div>

<!-- Hanzi Writer Modal -->
<div class="mo" id="hwM" style="display:none" onclick="clHW()">
  <div class="md" onclick="event.stopPropagation()">
    <div class="md-hd"><span id="hwTi"></span><button onclick="clHW()">✕</button></div>
    <div id="hwTarget"></div>
    <p id="hwFb" style="font-size:12px;color:var(--tx2);text-align:center;margin:6px 0"></p>
    <div class="md-acts">
      <button class="btn b1" onclick="startHQ()">🎯 开始描红</button>
      <button class="btn b3" onclick="resetHW()">🔄 重播</button>
    </div>
  </div>
</div>

<!-- Reward Modal -->
<div class="mo" id="rwM" style="display:none" onclick="hideRw()">
  <div class="md rw" onclick="event.stopPropagation()">
    <div class="rw-ico">💎</div><div id="rwMsg" style="font-size:17px;font-weight:700"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== STATE ====================
let S={pts:0,strk:0,pet:null,vR:{},ld:'',chars:{},pinyin:{},pinyinToday:{},pinyinDate:'',poems:{},mathC:0,mathT:0,focusM:0,badges:{},sport:{},swimLog:{},drumLog:{},sudoku:{},reading:{},"emo":{},cal:{},rec:{}};
function L(){try{const s=localStorage.getItem('yxxj_s');if(s){const p=JSON.parse(s);S={...S,...p}}}catch(e){}}
function R(){try{localStorage.setItem('yxxj_s',JSON.stringify(S))}catch(e){}}
function T(){return new Date().toISOString().split('T')[0]}
function Y(){return new Date(Date.now()-864e5).toISOString().split('T')[0]}

// ==================== TOAST / DISPLAY ====================
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function uS(){const t=T();if(S.ld===t)return;if(S.ld===Y())S.strk++;else if(S.ld&&S.ld!==t)S.strk=0;if(!S.ld)S.strk=1;S.ld=t;R()}
function up(){document.getElementById('pts').textContent=S.pts;document.getElementById('strk').textContent=S.strk}
function awd(key,n,msg){if(S.vR[key])return!1;S.vR[key]=!0;S.pts=(S.pts||0)+n;const t=T();const d=Object.keys(S.vR).filter(k=>k.endsWith(t));if(d.length>12){S.vR[key]=!1;S.pts-=n;R();toast('今日奖励已达上限（12次）');return!1}R();up();sRw(msg);advExp(n);chkBadges();return!0}
function sRw(msg){document.getElementById('rwMsg').textContent=msg;document.getElementById('rwM').style.display='flex';try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(523,ctx.currentTime);o.frequency.setValueAtTime(659,ctx.currentTime+.1);o.frequency.setValueAtTime(784,ctx.currentTime+.2);g.gain.setValueAtTime(.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+.5);o.start(ctx.currentTime);o.stop(ctx.currentTime+.5)}catch(e){}}
function hideRw(){document.getElementById('rwM').style.display='none'}

// ==================== VOICE SYSTEM (FIXED: primed on every call) ====================
let _sp=!1,_vs=[];
function primeS(){
  if(_sp)return;
  _sp=!0;
  if(!('speechSynthesis'in window))return;
  try{
    const u=new SpeechSynthesisUtterance('');u.volume=0;u.rate=1;
    speechSynthesis.speak(u);
    _vs=speechSynthesis.getVoices();
    if(!_vs.length){speechSynthesis.onvoiceschanged=()=>{_vs=speechSynthesis.getVoices()}}
  }catch(e){}
}
function gV(){
  if(!_vs.length)_vs=speechSynthesis.getVoices();
  return _vs.find(v=>/zh-cn/i.test(v.lang))||_vs.find(v=>/^zh/i.test(v.lang)&&!/yue|hk|tw/i.test(v.lang))||_vs.find(v=>/^zh/i.test(v.lang));
}
function say(text,lang,rate,onEnd){
  primeS();
  if(!('speechSynthesis'in window)){if(onEnd)onEnd();return!1}
  try{
    // Clear any pending speech first
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang||'zh-CN';u.rate=rate||.7;u.volume=1;u.pitch=1;
    const v=gV();if(v)u.voice=v;
    let done=!1;const fin=()=>{if(!done){done=!0;if(onEnd)onEnd()}};
    u.onend=fin;u.onerror=fin;
    // Safety timeout
    setTimeout(fin,Math.max(3000,text.length*500));
    speechSynthesis.speak(u);
    return!0
  }catch(e){if(onEnd)onEnd();return!1}
}
function sayLine(lines,rate,onEnd){
  if(!lines||!lines.length){if(onEnd)onEnd();return}
  let i=0;
  const nxt=()=>{if(i>=lines.length){if(onEnd)onEnd();return}const ln=String(lines[i++]).trim();if(!ln)return nxt();say(ln,'zh-CN',rate||.7,nxt)};
  nxt();
}

// Pinyin audio files
let _ac=null,_pc=new Map();
function pA(aid,src,onEnd){
  let fin=!1;const done=r=>{if(!fin){fin=!0;if(onEnd)onEnd(r)}};
  try{
    if(_ac){_ac.pause();_ac.currentTime=0}
    const key=src+':'+aid;let a=_pc.get(key);
    if(!a){const url=src==='init'?`https://www.qqxiuzi.cn/audio/pinyin/${aid}.mp3`:`assets/pinyin/${aid}.mp3`;a=new Audio(url);a.preload='auto';_pc.set(key,a)}
    _ac=a;a.currentTime=0;a.onended=()=>done(!0);a.onerror=()=>done(!1);
    const p=a.play();if(p&&p.catch)p.catch(()=>done(!1));
  }catch(e){done(!1)}
}
function sayPy(py,aid,src){
  src=src||'syl';pA(aid,src,ok=>{
    if(!ok){toast('音频暂不可用，请检查网络');return}
    const t=T();if(S.pinyinDate!==t){S.pinyinToday={};S.pinyinDate=t}
    if(!S.pinyinToday[py]){S.pinyinToday[py]=!0;S.pinyin[py]=!0;R()}
  });
}

// ==================== NAVIGATION (SIMPLIFIED) ====================
const NAV=[
  {id:'home',icon:'🏠',label:'首页'},
  {id:'chinese',icon:'📖',label:'语文',sub:[
    {id:'pinyin',icon:'🔤',label:'拼音'},{id:'chars',icon:'✏️',label:'生字'},
    {id:'poems',icon:'📜',label:'古诗'}
  ]},
  {id:'math',icon:'🧠',label:'数理',sub:[
    {id:'arithmetic',icon:'🔢',label:'算术'},{id:'sudoku',icon:'🧮',label:'数独'},
    {id:'thinking',icon:'🧩',label:'思维'},{id:'focus',icon:'🎯',label:'专注力'}
  ]},
  {id:'english',icon:'🔠',label:'英语',sub:[
    {id:'phonics',icon:'🔤',label:'拼读'},{id:'raz',icon:'📚',label:'RAZ'},
    {id:'conv',icon:'💬',label:'对话'}
  ]},
  {id:'sport',icon:'⚡',label:'运动',sub:[
    {id:'ball',icon:'🏀',label:'拍球'},{id:'rope',icon:'🪢',label:'跳绳'},
    {id:'home-fit',icon:'🏠',label:'体适能'},{id:'vesti',icon:'⚖️',label:'前庭训练'}
  ]},
  {id:'daily',icon:'📅',label:'每日',sub:[
    {id:'reading',icon:'📖',label:'精读'},{id:'science',icon:'🔬',label:'科普'},
    {id:'emotion',icon:'💙',label:'情绪'},{id:'calendar',icon:'🗓️',label:'日历'}
  ]},
  {id:'extra',icon:'🎨',label:'更多',sub:[
    {id:'swim',icon:'🏊',label:'游泳'},{id:'drum',icon:'🥁',label:'架子鼓'},
    {id:'recite',icon:'🎤',label:'朗诵'}
  ]},
  {id:'experiment',icon:'👽',label:'试验品'},
];
let CS='home';
function renderNav(){
  const el=document.getElementById('sideNav');
  el.innerHTML=NAV.map(it=>{
    if(it.sub){
      return `<div style="padding:2px 0">`+
        `<div style="padding:8px 16px;font-size:11px;font-weight:700;color:var(--side-text);opacity:.5">${it.icon} ${it.label}</div>`+

        `</div>`;
    }
    return `<div class="side-item${CS===it.id?' active':''}" onclick="go('${it.id}')">${it.icon} ${it.label}</div>`;

}
function toggleSide(){

}
function findNav(id){
  for(const it of NAV){
    if(it.id===id)return it;
    if(it.sub)for(const s of it.sub)if(s.id===id)return s;
  }return null;
}
function go(id){
  const item=findNav(id);
  document.getElementById('ttl').textContent=item?item.label:'首页';
  CS=id;renderNav();
  if(window.innerWidth<=768){document.getElementById('sb').classList.remove('open');document.getElementById('ov').classList.remove('show')}
  document.getElementById('ct').innerHTML='';
  (SEC[id]||SEC.home)();
  window.scrollTo(0,0);
  uS();up();
}

// HANZI WRITER
let _hw=null,_hch='';
function ohw(ch,py){
  _hch=ch;primeS();
  document.getElementById('hwTi').textContent='描红：'+ch+' ('+py+')';
  document.getElementById('hwTarget').innerHTML='';
  document.getElementById('hwFb').innerHTML='🔊 听读音…';
  document.getElementById('hwM').style.display='flex';
  say(ch+'，'+py,'zh-CN',.6,()=>{
    document.getElementById('hwFb').innerHTML='👋 用手指沿蓝色轮廓描红每一笔！';
  });
  if(typeof HanziWriter==='undefined'){document.getElementById('hwFb').innerHTML='⚠️ 笔顺动画需联网。口诀：先上后下，先左后右。';return}
  try{
    _hw=HanziWriter.create('hwTarget',ch,{width:200,height:200,padding:5,strokeAnimationSpeed:1,delayBetweenStrokes:300,radicalColor:'#9B7ED4',showCharacter:!1,showOutline:!0,outlineColor:'#E8E0F0'});
    _hw.loopCharacterAnimation();
  }catch(e){document.getElementById('hwFb').innerHTML='⚠️ 该字暂不支持笔顺动画。'}
}
function startHQ(){
  if(!_hw)return;
  document.getElementById('hwFb').innerHTML='👋 沿着轮廓描红每一笔';
  _hw.quiz({
    onMistake:()=>{document.getElementById('hwFb').innerHTML='💡 这笔方向不对，再试一次！'},
    onCorrectStroke:()=>{document.getElementById('hwFb').innerHTML='✅ 这一笔写得好！'},
    onComplete:function(s){
      const m=s.totalMistakes;
      let stars,sc,msg;
      if(m===0){stars='⭐⭐⭐';sc=15;msg='太棒了！满分！'}
      else if(m<=2){stars='⭐⭐';sc=10;msg='写得不错！'}
      else{stars='⭐';sc=5;msg='继续加油！'}
      const key='hw_'+_hch+'_'+T();
      awd(key,sc,`${stars} ${msg} +${sc}💎`);
      say(msg,'zh-CN',.75);
      document.getElementById('hwFb').innerHTML=`${stars} ${msg}<br>${s.strokes}笔，错${m}次，+${sc}💎`;
      if(!S.chars[_hch]){S.chars[_hch]=!0;R()}
    }
  });
}

  genM();

function sML(n){mLv=n;SEC.arithmetic()}
function genM(){
  const a=Math.floor(Math.random()*mLv)+1,b=Math.floor(Math.random()*mLv)+1;
  const plus=Math.random()>.4;
  if(plus){mQ={q:a+' + '+b+' = ?',ans:a+b,sp:a+'加'+b+'等于多少'}}
  else{const big=Math.max(a,b),small=Math.min(a,b);mQ={q:big+' - '+small+' = ?',ans:big-small,sp:big+'减'+small+'等于多少'}}
  document.getElementById('mQ').textContent=mQ.q;
  const opts=[mQ.ans];while(opts.length<4){const r=Math.floor(Math.random()*(mLv*2))+1;if(!opts.includes(r))opts.push(r)}
  opts.sort(()=>Math.random()-.5);
  document.getElementById('mO').innerHTML=opts.map(o=>`<div class="moi" onclick="ansM(${o},this)">${o}</div>`).join('');
}
function ansM(ans,el){
  primeS();
  if(ans===mQ.ans){el.classList.add('good');S.mathC++;S.mathT++;R();const key='math_'+T()+'_'+S.mathT;awd(key,5,'答对了！+5💎');say('答对了！','zh-CN',.7);setTimeout(genM,800)}

}

let sN=4,sG=[],sS=[],sSel=null;
SEC.sudoku=function(){
  document.getElementById('ct').innerHTML=`
    <div class="card"><div class="hd"><span class="ico">🧮</span><h2>数独<small>儿童版</small></h2></div>
    <div class="br" style="justify-content:center">
      <button class="lb ${sN===4?'on':''}" onclick="sSz(4);primeS();say('4乘4入门','zh-CN',.7)">4×4 入门</button>
      <button class="lb ${sN===6?'on':''}" onclick="sSz(6);primeS();say('6乘6进阶','zh-CN',.7)">6×6 进阶</button>
    </div>
    <div class="sg" id="sG" style="grid-template-columns:repeat(${sN},1fr)"></div>
    <div class="sn" id="sN"></div>
    <div class="br" style="justify-content:center"><button class="btn bs b3" onclick="chkS()">✅ 检查</button><button class="btn bs b3" onclick="newS()">🔄 新题</button></div></div>`;
  newS();
};
function sSz(n){sN=n;SEC.sudoku()}
function newS(){sS=gnS(sN);sG=sS.map(r=>r.map(v=>Math.random()<.4?v:0));sSel=null;renS()}
function gnS(n){const g=[],sq=Math.sqrt(n);for(let r=0;r<n;r++){g.push([]);for(let c=0;c<n;c++)g[r].push(((r*sq+Math.floor(r/sq)+c)%n)+1)}return g}
function renS(){document.getElementById('sG').innerHTML=sG.map((r,ri)=>r.map((v,ci)=>`<div class="sc ${v!==0?'given':''} ${sSel&&sSel.r===ri&&sSel.c===ci?'sel':''}" onclick="selS(${ri},${ci})">${v||''}</div>`).join('')).join('');document.getElementById('sN').innerHTML=Array.from({length:sN},(_,i)=>`<div class="sni" onclick="filS(${i+1})">${i+1}</div>`).join('')}
function selS(r,c){if(sG[r][c]!==0)return;sSel={r,c};renS()}
function filS(v){if(!sSel)return;sG[sSel.r][sSel.c]=v;sSel=null;renS()}
function chkS(){let ok=!0;for(let r=0;r<sN;r++)for(let c=0;c<sN;c++){if(sG[r][c]!==sS[r][c]){ok=!1;document.querySelectorAll('.sc')[r*sN+c].classList.add('err')}}
  if(ok){const key='sud_'+T()+'_'+Object.keys(S.sudoku||{}).length;S.sudoku[key]=!0;R();awd(key,10,'数独完成！+10💎');say('太棒了！数独全对！','zh-CN',.75)}
  else toast('有错误，红色处需修改')
}

}

// CALENDAR
SEC.calendar=function(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const fd=new Date(y,m,1).getDay()===0?7:new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate(),td=now.getDate();
  let h=`<div class="cl-hd">${y}年${m+1}月</div><div class="clg">`;
  ['一','二','三','四','五','六','日'].forEach(d=>h+=`<div style="text-align:center;font-size:11px;color:var(--tx2);padding:4px">${d}</div>`);
  for(let i=1;i<fd;i++)h+='<div class="cll e"></div>';
  let fc=0,pc=0;
  for(let d=1;d<=dim;d++){
    const dk=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const st=S.cal&&S.cal[dk];let cl='d';
    if(d===td)cl+=' t';
    if(st==='full'){cl+=' f';fc++}else if(st==='partial'){cl+=' p';pc++}else if(d<td)cl+=' m';
    h+=`<div class="cll ${cl}">${d}</div>`;
  }
  h+=`</div><div class="cl-leg"><span>🟢 全勤</span><span>🟡 部分</span><span>⬜ 未完成</span></div>`;
  h+=`<div class="card" style="margin-top:10px;text-align:center"><div style="font-size:26px;font-weight:800;color:var(--pri)">${fc+pc}</div><div style="font-size:12px;color:var(--tx2)">本月打卡</div><div style="font-size:18px;font-weight:700;color:var(--ok);margin-top:6px">${fc}</div><div style="font-size:12px;color:var(--tx2)">全勤天数</div></div>`;
  document.getElementById('ct').innerHTML=`<div class="card"><div class="hd"><span class="ico">🗓️</span><h2>学习日历</h2></div>${h}</div>`;
};

        ${Object.entries(EXP).map(([id,e])=>`<div class="exp-card" onclick="adopt('${id}')" style="cursor:pointer"><div style="font-size:52px">${e.em}</div><div style="font-weight:700;font-size:14px">${e.n}</div><div style="font-size:11px;color:var(--tx2)">${e.tr}</div><div style="font-size:10px;color:var(--pri);margin-top:3px">编号 ${id}</div></div>`).join('')}</div></div>`;
    return;
  }
  migP();
  const e=EXP[S.pet.type],lv=eLv(),st=EST[lv],pg=ePg();
  document.getElementById('ct').innerHTML=`
    <div class="card"><div class="hd"><span class="ico">👽</span><h2>试验品中心</h2></div>
    <div class="exp-card">
      <div class="exp-av" id="expAv" onclick="expAni('bounce')">${e.em}</div><div id="expH" style="position:relative;height:0"></div>
      <div style="font-weight:700;font-size:19px">${e.n}</div><div class="exp-st">${st.n} · ${e.tr}</div>
      <div style="font-size:11px;color:var(--tx2);margin-top:3px">编号 ${S.pet.type} · 成长值 ${S.pet.xp} · 任务 ${S.pet.ct}次</div>
      <div class="exp-bar"><span style="width:${pg}%"></span></div>
      <div style="font-size:11px;color:var(--tx2);margin-bottom:6px">🍖${S.pet.hu} 🛁${S.pet.hy} ⚡${S.pet.en}</div>
      <div class="exp-acts">
        <button class="btn bs b1" onclick="fdExp()">🍖 喂食(20💎)</button>
        <button class="btn bs b3" onclick="btExp()">🛁 洗澡(10💎)</button>
        <button class="btn bs b2" onclick="plExp()">🏃 玩耍</button>
        <button class="btn bs b3" onclick="tkExp()">🔊 听</button>
      </div></div></div>`;
};
function fdExp(){if(!S.pet)return;primeS();if((S.pts||0)<20)return toast('钻石不够！');S.pts-=20;S.pet.hu=Math.min(100,S.pet.hu+35);S.pet.xp+=4;R();up();SEC.experiment();say('谢谢小主人！我吃饱啦！','zh-CN',.85);expAni('bounce')}
function btExp(){if(!S.pet)return;primeS();if((S.pts||0)<10)return toast('钻石不够！');S.pts-=10;S.pet.hy=Math.min(100,S.pet.hy+45);S.pet.xp+=3;R();up();SEC.experiment();say('身上香香的啦！','zh-CN',.85);expAni('shake')}
function plExp(){if(!S.pet)return;primeS();if((S.pet.ct||0)<1)return say('先完成一项学习任务再玩！','zh-CN',.85);S.pet.en=Math.min(100,S.pet.en+25);S.pet.hu=Math.max(10,S.pet.hu-5);S.pet.xp+=2;R();SEC.experiment();say('今天真开心！','zh-CN',.85);expAni('bounce')}
function tkExp(){if(!S.pet)return;primeS();migP();const p=S.pet;let msg='我想听你认真学习。完成一项任务，我们就能一起长大！';if(p.hu<45)msg='我饿了，小主人。完成学习挑战后，用钻石给我准备三明治吧！';else if(p.hy<45)msg='身上脏了，快帮我洗洗吧！';else if(p.en<45)msg='我要出去和你玩～先完成今天的一项学习任务！';say(msg,'zh-CN',.88)}
function expAni(type){const el=document.getElementById('expAv');if(!el)return;el.classList.remove('bounce','shake');void el.offsetWidth;el.classList.add(type);if(type==='bounce'){const h=document.getElementById('expH');if(h){h.innerHTML='<span class="hf">❤️</span>';setTimeout(()=>h.innerHTML='',1600)}}setTimeout(()=>el.classList.remove('bounce','shake'),1000)}
