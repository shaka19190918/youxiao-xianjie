<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在更新...</title>
<style>
  body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#FAF7FF;color:#332C43;text-align:center;padding:20px}
  .box{background:#fff;padding:30px;border-radius:20px;box-shadow:0 8px 28px rgba(94,70,150,.1);max-width:340px}
  .spinner{font-size:40px;animation:spin 1s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  #log{font-size:12px;color:#80778E;margin-top:14px;text-align:left;min-height:60px}
</style>
</head>
<body>
<div class="box">
  <div class="spinner">🔄</div>
  <h2 style="margin:10px 0 4px">正在更新到最新版</h2>
  <p style="font-size:13px;color:#80778E;margin:0">清除旧缓存中，请稍候…</p>
  <div id="log"></div>
</div>
<script>
const log=m=>{document.getElementById('log').innerHTML+=m+'<br>'};
(async()=>{
  try{
    // 1. 注销所有 Service Worker
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs){await r.unregister();log('✓ 已注销旧服务工作线程')}
      if(!regs.length)log('· 无残留工作线程');
    }
    // 2. 清空所有 Cache Storage
    if('caches' in window){
      const keys=await caches.keys();
      for(const k of keys){await caches.delete(k);log('✓ 已清除缓存 '+k)}
    }
    log('✓ 完成，正在进入…');
    // 3. 强制无缓存跳回首页
    setTimeout(()=>{location.replace('./index.html?t='+Date.now())},800);
  }catch(e){
    log('⚠ '+e.message);
    setTimeout(()=>{location.replace('./index.html?t='+Date.now())},1500);
  }
})();
</script>
</body>
</html>
