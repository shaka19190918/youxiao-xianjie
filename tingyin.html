<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>发音试听校对</title>
<style>
  body{font-family:sans-serif;background:#FAF7FF;color:#332C43;padding:16px;max-width:720px;margin:0 auto}
  h1{font-size:20px}
  .tip{background:#FFF8E1;border:1px solid #F9A825;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px}
  .group{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 4px 12px rgba(94,70,150,.08)}
  .group h2{font-size:15px;margin:0 0 10px;color:#A66CFF}
  .row{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px dashed #eee;flex-wrap:wrap}
  .row:last-child{border-bottom:none}
  .aid{font-weight:800;min-width:52px;font-size:15px}
  .zi{color:#80778E;font-size:13px;min-width:80px}
  button{padding:7px 14px;border:none;border-radius:20px;background:#A66CFF;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
  button:active{transform:scale(.94)}
  .bad{background:#FFCDD2;color:#C62828}
  .mark{font-size:12px;color:#C62828;min-height:16px}
  .poem{background:#F3E5F5}
</style>
</head>
<body>
<h1>🎧 发音试听校对</h1>
<div class="tip">💡 逐个点击「▶ 播放」听发音。<b>读得不对的，点「✗ 不对」标记</b>，然后截屏发给我，我针对性重录。全部听完没问题就告诉我"通过"，我就部署上线。</div>
<div id="app"></div>

<script>
// 拼音分组（音频ID + 引导字 + 显示名）
const GROUPS = [
 {name:'四声', items:[['a1','ā 一声'],['a2','á 二声'],['a3','ǎ 三声'],['a4','à 四声']]},
 {name:'单韵母', items:[['a1','a (ā)'],['o1','o (ō)'],['e1','e (ē)'],['yi1','i (读衣)'],['wu1','u (读屋)'],['yu1','ü (读迂)']]},
 {name:'复韵母', items:[['ai1','ai (哀)'],['ei1','ei (欸)'],['wei1','ui (读威)'],['ao1','ao (凹)'],['ou1','ou (欧)'],['you1','iu (读优)'],['ye1','ie (读耶)'],['yue1','üe (读约)'],['er2','er (儿)']]},
 {name:'鼻韵母', items:[['an1','an (安)'],['en1','en (恩)'],['yin1','in (读因)'],['wen1','un (读温)'],['yun1','ün (读晕)'],['ang1','ang (昂)'],['eng1','eng (鞥)'],['ying1','ing (读英)'],['weng1','ong (读翁)']]},
 {name:'整体认读', items:[['zhi1','zhi (知)'],['chi1','chi (吃)'],['shi1','shi (诗)'],['ri4','ri (日)'],['zi1','zi (资)'],['ci1','ci (雌)'],['si1','si (思)'],['yi1','yi (衣)'],['wu1','wu (屋)'],['yu1','yu (迂)'],['ye1','ye (耶)'],['yue1','yue (约)'],['yuan1','yuan (冤)'],['yin1','yin (因)'],['yun1','yun (晕)'],['ying1','ying (英)']]}
];
const POEMS = [
 ['poem_yong_e','咏鹅'],['poem_hua','画'],['poem_min_nong','悯农'],
 ['poem_jing_ye_si','静夜思'],['poem_chun_xiao','春晓'],['poem_deng_guan_que_lou','登鹳雀楼'],['poem_jiang_xue','江雪']
];
let cur=null;
function play(src,btn){
  if(cur){cur.pause();cur=null}
  cur=new Audio(src);
  cur.play().catch(e=>alert('播放失败:'+e.message));
}
function markBad(el,id){
  el.classList.toggle('bad');
  el.textContent = el.classList.contains('bad') ? '✓ 已标记' : '✗ 不对';
}
const app=document.getElementById('app');
let html='';
GROUPS.forEach(g=>{
  html+=`<div class="group"><h2>${g.name}</h2>`;
  g.items.forEach(([aid,label])=>{
    html+=`<div class="row"><span class="aid">${label}</span>
      <button onclick="play('assets/pinyin/${aid}.mp3',this)">▶ 播放</button>
      <button class="bad-btn" style="background:#eee;color:#666" onclick="markBad(this,'${aid}')">✗ 不对</button>
      <span class="mark"></span></div>`;
  });
  html+='</div>';
});
html+=`<div class="group"><h2>古诗整首朗读</h2>`;
POEMS.forEach(([key,name])=>{
  html+=`<div class="row poem"><span class="aid">${name}</span>
    <button onclick="play('assets/voice/${key}.mp3',this)">▶ 播放</button>
    <button style="background:#eee;color:#666" onclick="markBad(this,'${key}')">✗ 不对</button>
    <span class="mark"></span></div>`;
});
html+='</div>';
app.innerHTML=html;
</script>
</body>
</html>
